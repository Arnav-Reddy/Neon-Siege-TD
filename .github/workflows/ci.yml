name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Game version bumped when the game changed
        # The in-game updater only offers a new build when app-version goes up.
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "No base commit to compare"; exit 0; fi
          if git diff --quiet "$BASE" HEAD -- index.html; then echo "index.html unchanged"; exit 0; fi
          OLD=$(git show "$BASE:index.html" | grep -m1 -o '<meta name="app-version" content="[0-9.]*"')
          NEW=$(grep -m1 -o '<meta name="app-version" content="[0-9.]*"' index.html)
          if [ "$OLD" = "$NEW" ]; then echo "::error::index.html changed but app-version was not bumped ($NEW)"; exit 1; fi
          echo "app-version: $OLD -> $NEW"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1 # browsers come from the explicit install below
      - run: npx playwright install --with-deps chromium
      - name: Syntax check
        shell: bash
        run: |
          node --check main.js preload.js build/afterPack.js
          # the update bootstrap (first <script>) and the inert game source (<script id="game-src">)
          S=$(grep -n '<script>' index.html | head -1 | cut -d: -f1)
          E=$(grep -n '</script>' index.html | head -1 | cut -d: -f1)
          sed -n "$((S+1)),$((E-1))p" index.html > /tmp/boot.js
          node --check /tmp/boot.js
          node -e "const s=require('fs').readFileSync('index.html','utf8');const a=s.indexOf('id=\"game-src\">')+14;require('fs').writeFileSync('/tmp/game.js',s.slice(a,s.indexOf('</script>',a)))"
          node --check /tmp/game.js
      - run: npm test
      - run: npm audit --audit-level=high
