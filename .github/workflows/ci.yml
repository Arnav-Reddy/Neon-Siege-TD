name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1 # browsers come from the explicit install below
      - run: npx playwright install --with-deps chromium
      - name: Syntax check
        shell: bash
        run: |
          node --check main.js preload.js build/afterPack.js
          S=$(grep -n '<script>' index.html | head -1 | cut -d: -f1)
          E=$(grep -n '</script>' index.html | head -1 | cut -d: -f1)
          sed -n "$((S+1)),$((E-1))p" index.html > /tmp/game.js
          node --check /tmp/game.js
      - run: npm test
      - run: npm audit --audit-level=high
