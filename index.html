// ================= Map =================
let P; // { set, pts, cum, ang, len }
function genPath(seed){
  const r = mulberry32(seed), ri = (a, b) => a + Math.floor(r() * (b - a + 1));
  let y = ri(1, ROWS - 2);
  const tiles = [[0, y]];
  for (let x = 0; x < COLS - 1; x++) {
    if (x % 2 === 1) {
      let ty; do { ty = ri(0, ROWS - 1); } while (Math.abs(ty - y) < 2);
      const d = Math.sign(ty - y);
      while (y !== ty) { y += d; tiles.push([x, y]); }
    }
    tiles.push([x + 1, y]);
  }
  return tiles;
}
function setMap(seed){
  const tiles = genPath(seed);
  const pts = tiles.map(([x, y]) => [x + .5, y + .5]);
  const cum = [0], ang = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1];
    cum.push(cum[i] + Math.hypot(dx, dy)); ang.push(Math.atan2(dy, dx));
  }
  P = { set: new Set(tiles.map(([x, y]) => x + ',' + y)), pts, cum, ang, len: cum[cum.length - 1] };
  renderBackground();
}
function posAt(d){
  const { pts, cum, ang } = P;
  if (d <= 0) return [pts[0][0], pts[0][1], ang[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    if (d <= cum[i + 1]) {
      const k = (d - cum[i]) / (cum[i + 1] - cum[i]);
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k, ang[i]];
    }
  }
  const l = pts[pts.length - 1];
  return [l[0], l[1], ang[ang.length - 1]];
}
const isPath = (x, y) => P.set.has(x + ',' + y);
const towerAt = (x, y) => S.towers.find(t => t.x === x && t.y === y);

// ================= State & persistence =================
let S;
const ui = { build:null, sel:null, hover:null, min:false, rerollT:0, pres:false, mutT:null, mutOpts:[], shake:0 };
const randSeed = () => Math.floor(Math.random() * 2 ** 31);

function makeTower(type, x, y){
  return { type, x, y, lv:1, kills:0, earned:0, muts:[], invested:TOWERS[type].cost, cd:0, buff:1, midas:0, lock:0, target:null, ang:-Math.PI / 2, recoil:0 };
}
function makeState(m){
  return {
    seed:m.seed, gold:m.gold, lives:m.lives, wave:m.wave, prestige:m.prestige, catalysts:m.catalysts, best:m.best,
    bossKills:m.bossKills, runEarned:m.runEarned, speed:m.speed, auto:m.auto, autoMut:m.autoMut, muted:m.muted,
    towers:m.towers.map(t => {
      const type = TOWER_INDEX[t.id];
      if (type === undefined) throw new Error(`Unknown tower id in save: ${t.id}`);
      return { ...makeTower(type, t.x, t.y), lv:t.lv, kills:t.kills, earned:t.earned, muts:t.muts.slice(), invested:t.invested };
    }),
    waveActive:false, enemies:[], projs:[], hazards:[], fx:[], parts:[], q:[], spawnT:0, autoT:1.5, time:0,
    inc:new Array(10).fill(0), incI:0, incT:0,
    over:m.lives <= 0, banner:null, coreFlash:0,
  };
}
function freshRun(meta){
  return makeState({ seed:randSeed(), gold:100 + 50 * meta.prestige, lives:START_LIVES, wave:0, towers:[], bossKills:0, runEarned:0, ...meta });
}
function save(){
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    seed:S.seed, gold:S.gold, lives:S.lives, wave:S.waveActive ? S.wave - 1 : S.wave,
    prestige:S.prestige, catalysts:S.catalysts, best:S.best, bossKills:S.bossKills, runEarned:S.runEarned, speed:S.speed, auto:S.auto, autoMut:S.autoMut, muted:S.muted, min:ui.min,
    towers:S.towers.map(t => ({ id:TOWERS[t.type].id, x:t.x, y:t.y, lv:t.lv, kills:t.kills, earned:t.earned, muts:t.muts, invested:t.invested })),
  }));
}
// v1 stored towers by index into the old 10-tower list (no Mint).
function migrateV1(d){
  const ids = ['bolt','frost','flak','tesla','venom','rail','prism','hell','chrono','sing'];
  return { ...d, towers: d.towers.map(t => ({ id:ids[t.type], x:t.x, y:t.y, lv:t.lv, kills:t.kills, earned:0, muts:t.muts, invested:t.invested })) };
}
function load(){
  let raw = localStorage.getItem(SAVE_KEY);
  const old = localStorage.getItem(SAVE_KEY_V1);
  if (!raw && old) raw = JSON.stringify(migrateV1(JSON.parse(old)));
  if (old) localStorage.removeItem(SAVE_KEY_V1);
  if (!raw) { S = freshRun({ prestige:0, catalysts:0, best:0, speed:1, auto:false, autoMut:false, muted:false }); setMap(S.seed); return; }
  const d = JSON.parse(raw);
  // Saves from before prestige requirements have no run-progress counters; the run starts counting now.
  if (d.bossKills === undefined) { d.bossKills = 0; d.runEarned = 0; }
  S = makeState(d);
  ui.min = d.min;
  setMap(S.seed);
  // A reload during a pending mutation choice resolves it automatically.
  for (const t of S.towers) while (t.muts.length < Math.floor(t.lv / 5)) t.muts.push(mutOptions(t)[0]);
}

// ================= Stats =================
function cnt(t, k){ let n = 0; for (const m of t.muts) if (m === k) n++; return n; }
const isMint = t => TOWERS[t.type].kind === 'mint';
function stats(t){
  const d = TOWERS[t.type], pm = 1 + 0.1 * S.prestige;
  const dmg = (d.dmg || 0) * Math.pow(1.2, t.lv - 1) * Math.pow(1.5, t.muts.length) * pm;
  const range = d.kind === 'rail' ? 99 : d.range * Math.min(1.6, 1 + .03 * (t.lv - 1)) * (1 + .25 * cnt(t, 'range'));
  const rate = d.rate * (1 + .04 * (t.lv - 1)) * (1 + .4 * cnt(t, 'overclock')) * t.buff;
  return { dmg, range, rate };
}
function mintStats(t){
  const d = TOWERS[t.type], g = Math.pow(1.22, t.lv - 1) * Math.pow(1.5, t.muts.length) * (1 + .1 * S.prestige);
  return { gps: d.gps * g * (1 + .65 * cnt(t, 'quantum')) * t.buff, bonus: d.bonus * g, range: d.range * Math.min(1.6, 1 + .03 * (t.lv - 1)) };
}
function dpsOf(t, s){
  const d = TOWERS[t.type];
  switch (d.kind) {
    case 'chain': { let m = 0, f = 1; for (let j = 0; j <= d.jumps + Math.floor(t.lv / 10); j++) { m += f; f *= .8; } return s.dmg * s.rate * m; }
    case 'rail': return s.dmg * s.rate * (1 + d.crit * (d.critMul - 1));
    case 'mortar': return 3 * s.dmg * s.rate;
    case 'hole': return 2 * s.dmg * s.rate;
    default: return s.dmg * s.rate;
  }
}
const upCost = t => Math.ceil(TOWERS[t.type].cost * .5 * Math.pow(1.38, t.lv - 1));
const sellValue = t => Math.floor(t.invested * .7);
const incomeRate = () => S.inc.reduce((a, b) => a + b, 0) / 10;

// ================= Waves =================
function buildWave(w){
  const pool = ['grunt'];
  if (w >= 3) pool.push('runner');
  if (w >= 5) pool.push('brute');
  if (w >= 7) pool.push('swarm');
  if (w >= 12) pool.push('shielded');
  const q = [];
  let budget = Math.min(45, 6 + Math.floor(w * .7));
  while (budget > 0) {
    const ty = pool[Math.floor(Math.random() * pool.length)];
    if (ty === 'swarm') { for (let i = 0; i < 5; i++) q.push({ ty, gap: i ? .14 : .6 }); budget -= 2; }
    else { q.push({ ty, gap: ty === 'runner' ? .4 : ty === 'brute' ? 1 : .65 }); budget -= 1; }
  }
  if (w % 10 === 0) for (let i = 0, n = 1 + Math.floor(w / 50); i < n; i++) q.push({ ty:'boss', gap: i ? 1.5 : 1.8 });
  return q;
}
function startWave(){
  if (S.waveActive || S.over) return;
  S.wave++;
  S.q = buildWave(S.wave);
  S.spawnT = .3;
  S.waveActive = true;
  S.banner = { s: `WAVE ${S.wave}${S.wave % 10 === 0 ? ' — BOSS' : ''}`, c: S.wave % 10 === 0 ? '#fb7185' : '#22d3ee', t: 2 };
  sfx('wave');
}
function endWave(){
  S.waveActive = false;
  const clear = goldScale(S.wave) * 5 * (1 + .1 * S.prestige);
  earn(clear);
  let interest = 0, payouts = 0;
  for (const t of S.towers) {
    if (!isMint(t)) continue;
    const b = mintStats(t).bonus;
    earn(b); t.earned += b; payouts += b;
    addText(t.x + .5, t.y + .1, '+$' + fmt(b), '#fbbf24', true);
    interest += .04 * cnt(t, 'compound');
  }
  if (interest > 0) {
    const g = S.gold * Math.min(.2, interest);
    earn(g);
    addText(P.pts[P.pts.length - 1][0], P.pts[P.pts.length - 1][1] - .6, `+$${fmt(g)} interest`, '#34d399', true);
  }
  if (payouts) sfx('payout');
  S.best = Math.max(S.best, S.wave);
  S.banner = { s: `WAVE ${S.wave} CLEAR  +$${fmt(clear + payouts)}`, c: '#4ade80', t: 1.8 };
  S.autoT = 1.5;
  sfx('clear');
  save();
}
function spawnEnemy(ty){
  const d = ENEMIES[ty], w = S.wave, hp = hpScale(w) * d.hp, sh = d.shield ? hp * d.shield : 0;
  const e = {
    type:ty, hp, maxHp:hp, shield:sh, maxShield:sh, armor:d.armor, spd:d.spd * (1 + Math.min(w, 100) * .003),
    dist:0, x:0, y:0, ang:0, off:(Math.random() - .5) * (ty === 'swarm' ? .32 : .14),
    slowAmt:0, slowT:0, pStacks:0, pDps:0, pT:0, pSrc:null, shred:0, siphon:0, lastHit:-9,
    dmgAcc:0, dmgT:0, gold:goldScale(w) * d.gold, boss:!!d.boss, dead:false,
  };
  setPos(e);
  S.enemies.push(e);
}
function setPos(e){
  const [x, y, a] = posAt(e.dist);
  e.x = x - Math.sin(a) * e.off; e.y = y + Math.cos(a) * e.off; e.ang = a;
}

// ================= Economy & feedback =================
function earn(g){ S.gold += g; S.runEarned += g; S.inc[S.incI] += g; }
function addFx(f){ if (S.fx.length < 260) S.fx.push(f); }
function addText(x, y, s, c, big){
  if (!big && S.fx.length > 150) return;
  S.fx.push({ k:'text', x, y, s, c, big:!!big, t:big ? 1.2 : .8, life:big ? 1.2 : .8 });
}
function burst(x, y, c, n, spd){
  for (let i = 0; i < n && S.parts.length < 320; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (.4 + Math.random() * .8);
    S.parts.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, c, s:1 + Math.random() * 1.6, t:.5 + Math.random() * .3, life:.8 });
  }
}
function shake(m){ ui.shake = Math.max(ui.shake, m); }

// ================= Combat =================
function hit(e, amt, src, proc){
  if (e.dead) return;
  let d = amt * (1 - Math.max(-.5, e.armor - e.shred));
  e.lastHit = S.time;
  e.dmgAcc += d;
  if (e.shield > 0) { const a = Math.min(e.shield, d); e.shield -= a; d -= a; }
  e.hp -= d;
  if (src) {
    const sg = .2 * cnt(src, 'siphon');
    if (sg > e.siphon) e.siphon = sg;
    const ex = cnt(src, 'execute');
    if (ex && e.hp > 0 && e.hp < e.maxHp * Math.min(.3, .1 + .05 * ex)) { e.hp = 0; addText(e.x, e.y - .3, 'EXECUTE', '#fb7185', true); }
    if (proc) { const sw = cnt(src, 'shockwave'); if (sw && Math.random() < Math.min(.6, .2 * sw)) shockwave(e, amt, src); }
  }
  if (e.hp <= 0) kill(e, src);
}
function shockwave(e, amt, src){
  addFx({ k:'ring', x:e.x, y:e.y, r:1, c:'#f0abfc', t:.35, life:.35, w:2 });
  for (const o of S.enemies) if (!o.dead && dist2(o.x, o.y, e.x, e.y) <= 1) hit(o, amt, src, false);
}
function kill(e, src){
  e.dead = true;
  const ed = ENEMIES[e.type];
  const g = e.gold * (1 + e.siphon) * (1 + .1 * S.prestige) * (1 + (src ? src.midas : 0));
  earn(g);
  if (src) { src.kills++; src.earned += g; }
  for (const m of S.towers) {
    const k = isMint(m) ? cnt(m, 'bounty') : 0;
    if (!k) continue;
    const r = mintStats(m).range;
    if (dist2(e.x, e.y, m.x + .5, m.y + .5) > r * r) continue;
    const b = e.gold * .5 * k;
    earn(b); m.earned += b;
    addFx({ k:'line', x1:e.x, y1:e.y, x2:m.x + .5, y2:m.y + .5, c:'#fbbf24', w:1.5, t:.3, life:.3 });
  }
  addText(e.x, e.y - .15, '+$' + fmt(g), '#fbbf24', e.boss);
  addFx({ k:'ring', x:e.x, y:e.y, r:ed.size * 2.6, c:ed.color, t:.3, life:.3 });
  burst(e.x, e.y, ed.color, e.boss ? 36 : 8, e.boss ? 3.5 : 2.2);
  if (e.boss) {
    const c = 1 + Math.floor(S.wave / 30);
    S.catalysts += c;
    S.bossKills++;
    addText(e.x, e.y - .55, `+${c} ◆ CATALYST`, '#c084fc', true);
    burst(e.x, e.y, '#fbbf24', 20, 3);
    shake(6);
    sfx('boss');
  } else sfx('kill');
}
function slow(e, amt, time){
  if (e.boss) amt *= .5;
  if (amt >= e.slowAmt || e.slowT <= 0) e.slowAmt = amt;
  e.slowT = Math.max(e.slowT, time);
}
function poison(e, dmg, src){
  e.pStacks = Math.min(10, e.pStacks + 1);
  e.pDps = Math.max(e.pDps, dmg * .5);
  e.pT = 4; e.pSrc = src;
  e.shred = e.pStacks * .05;
}
function explode(x, y, r, dmg, src, c, sh){
  addFx({ k:'ring', x, y, r, c, t:.3, life:.3, fill:true });
  burst(x, y, c, 6, 2);
  shake(sh);
  for (const e of S.enemies) if (!e.dead && dist2(e.x, e.y, x, y) <= r * r) hit(e, dmg, src, true);
  sfx('boom');
}
function inRange(t, r){
  const cx = t.x + .5, cy = t.y + .5, r2 = r * r;
  return S.enemies.filter(e => !e.dead && dist2(e.x, e.y, cx, cy) <= r2);
}
function pick(t, r, n, byHp){
  const l = inRange(t, r);
  l.sort(byHp ? (a, b) => (b.hp + b.shield) - (a.hp + a.shield) : (a, b) => b.dist - a.dist);
  return l.slice(0, n);
}
function chain(t, first, dmg, jumps){
  const pts = [[t.x + .5, t.y + .5]], done = new Set();
  let e = first;
  for (let j = 0; j <= jumps && e; j++) {
    pts.push([e.x, e.y]); done.add(e);
    hit(e, dmg, t, true);
    dmg *= .8;
    let best = null, bd = 1.6 * 1.6;
    for (const o of S.enemies) {
      if (o.dead || done.has(o)) continue;
      const dd = dist2(o.x, o.y, e.x, e.y);
      if (dd < bd) { bd = dd; best = o; }
    }
    e = best;
  }
  addFx({ k:'zap', pts, c:'#a78bfa', t:.18, life:.18 });
}

function updMint(t, dt){
  t.cd -= dt;
  if (t.cd > 0) return;
  t.cd += 1;
  const g = mintStats(t).gps;
  earn(g); t.earned += g;
  addText(t.x + .5, t.y + .2, '+$' + fmt(g), '#fde68a');
  burst(t.x + .5, t.y + .5, '#34d399', 3, .8);
  t.recoil = 1;
  sfx('coin');
}
function updTower(t, dt){
  const d = TOWERS[t.type];
  t.recoil = Math.max(0, t.recoil - dt * 5);
  if (d.kind === 'mint') { updMint(t, dt); return; }
  const s = stats(t), cx = t.x + .5, cy = t.y + .5;
  if (d.kind === 'beam') {
    let e = t.target;
    if (!e || e.dead || dist2(e.x, e.y, cx, cy) > s.range * s.range) {
      e = pick(t, s.range, 1)[0] || null;
      t.target = e; t.lock = 0;
      if (e) sfx('prism');
    }
    if (e) {
      t.lock += dt;
      t.ang = Math.atan2(e.y - cy, e.x - cx);
      hit(e, s.dmg * s.rate * Math.min(64, Math.pow(2, t.lock)) * dt, t, false);
    }
    return;
  }
  t.cd -= dt;
  if (t.cd > 0) return;
  const n = 1 + 2 * cnt(t, 'split');
  let ts = [];
  switch (d.kind) {
    case 'proj': case 'shell':
      ts = pick(t, s.range, n);
      ts.forEach((e, i) => S.projs.push({ kind:d.id, x:cx, y:cy, tx:e.x, ty:e.y, e, dmg:i ? s.dmg * .5 : s.dmg, src:t, spd:d.kind === 'shell' ? 7 : 11, splash:d.splash, c:d.color }));
      break;
    case 'pulse':
      ts = inRange(t, s.range);
      if (ts.length) {
        for (const e of ts) { hit(e, s.dmg, t, true); if (!e.dead) slow(e, d.slow, d.slowT); }
        addFx({ k:'ring', x:cx, y:cy, r:s.range, c:d.color, t:.45, life:.45, w:2, fill:true });
      }
      break;
    case 'chain':
      ts = pick(t, s.range, n);
      ts.forEach((e, i) => chain(t, e, i ? s.dmg * .5 : s.dmg, d.jumps + Math.floor(t.lv / 10)));
      break;
    case 'rail':
      ts = pick(t, s.range, n, true);
      ts.forEach((e, i) => {
        const crit = Math.random() < d.crit, a = Math.atan2(e.y - cy, e.x - cx);
        addFx({ k:'line', x1:cx, y1:cy, x2:e.x + Math.cos(a) * .6, y2:e.y + Math.sin(a) * .6, c:crit ? '#ffffff' : d.color, w:crit ? 4 : 2.5, t:.25, life:.25 });
        burst(e.x, e.y, '#bfdbfe', crit ? 10 : 4, 2.5);
        if (crit) { addText(e.x, e.y - .45, 'CRIT!', '#93c5fd', true); shake(2); }
        hit(e, (i ? .5 : 1) * s.dmg * (crit ? d.critMul : 1), t, true);
      });
      break;
    case 'mortar':
      ts = pick(t, s.range, n);
      ts.forEach((e, i) => {
        for (let k = 0; k < 3; k++) S.projs.push({ kind:'hell', sx:cx, sy:cy, x:cx, y:cy, h:0, tx:e.x + (Math.random() - .5) * .7, ty:e.y + (Math.random() - .5) * .7, t:0, T:.7 + k * .08, dmg:i ? s.dmg * .5 : s.dmg, src:t, splash:d.splash });
      });
      break;
    case 'hole':
      ts = pick(t, s.range, 1);
      if (ts.length) { S.hazards.push({ k:'hole', x:ts[0].x, y:ts[0].y, r:1.1, dps:s.dmg, t:2, life:2, src:t }); shake(2.5); }
      break;
  }
  if (ts.length) {
    t.cd = 1 / s.rate;
    t.ang = Math.atan2(ts[0].y - cy, ts[0].x - cx);
    t.recoil = 1;
    sfx(d.id);
  }
}
function updEnemy(e, dt){
  if (e.dead) return;
  if (e.slowT > 0) e.slowT -= dt; else e.slowAmt = 0;
  if (e.pT > 0) {
    e.pT -= dt;
    hit(e, e.pStacks * e.pDps * dt, e.pSrc, false);
    if (e.pT <= 0) { e.pStacks = 0; e.pDps = 0; e.shred = 0; }
    if (e.dead) return;
  }
  e.dmgT -= dt;
  if (e.dmgT <= 0 && e.dmgAcc > 0) { addText(e.x + (Math.random() - .5) * .3, e.y - ENEMIES[e.type].size - .1, fmt(e.dmgAcc), '#e2e8f0'); e.dmgAcc = 0; e.dmgT = .45; }
  if (e.maxShield > 0 && S.time - e.lastHit > 1.5) e.shield = Math.min(e.maxShield, e.shield + e.maxShield * .25 * dt);
  e.dist += e.spd * (1 - e.slowAmt) * dt;
  if (e.dist >= P.len) {
    e.dead = true;
    S.lives -= e.boss ? 5 : 1;
    S.coreFlash = .4;
    shake(e.boss ? 6 : 3);
    const pl = $('pLives'); pl.classList.remove('hurt'); void pl.offsetWidth; pl.classList.add('hurt');
    sfx('leak');
    if (S.lives <= 0) gameOver();
    return;
  }
  setPos(e);
}
function updProjs(dt){
  for (const p of S.projs) {
    if (p.kind === 'hell') {
      p.t += dt;
      const k = Math.min(1, p.t / p.T);
      p.x = p.sx + (p.tx - p.sx) * k; p.y = p.sy + (p.ty - p.sy) * k; p.h = Math.sin(k * Math.PI) * .8;
      if (k >= 1) {
        p.done = true;
        explode(p.tx, p.ty, p.splash, p.dmg, p.src, '#f43f5e', 1.5);
        S.hazards.push({ k:'lava', x:p.tx, y:p.ty, r:.45, dps:p.dmg * .35, t:3, life:3, src:p.src });
        if (S.hazards.length > 60) S.hazards.shift();
      }
      continue;
    }
    if (!p.e.dead) { p.tx = p.e.x; p.ty = p.e.y; }
    else if (p.kind !== 'flak') { p.done = true; continue; }
    const dx = p.tx - p.x, dy = p.ty - p.y, dd = Math.hypot(dx, dy), step = p.spd * dt;
    if (dd > step) { p.x += dx / dd * step; p.y += dy / dd * step; continue; }
    p.done = true;
    if (p.kind === 'flak') explode(p.tx, p.ty, p.splash, p.dmg, p.src, '#fb923c', .8);
    else {
      hit(p.e, p.dmg, p.src, true);
      burst(p.tx, p.ty, p.c, 2, 1.2);
      if (p.kind === 'venom' && !p.e.dead) poison(p.e, p.dmg, p.src);
    }
  }
}
function updHazards(dt){
  for (const h of S.hazards) {
    h.t -= dt;
    for (const e of S.enemies) {
      if (e.dead || dist2(e.x, e.y, h.x, h.y) > h.r * h.r) continue;
      if (h.k === 'hole') { e.dist = Math.max(0, e.dist - (e.boss ? .8 : 1.6) * dt); setPos(e); }
      hit(e, h.dps * dt, h.src, false);
    }
  }
}
function applyBuffs(){
  for (const t of S.towers) { t.buff = 1; t.midas = 0; }
  for (const c of S.towers) {
    if (TOWERS[c.type].buff) {
      const b = 1.3 + .02 * (c.lv - 1);
      for (const t of S.towers) if (t !== c && Math.abs(t.x - c.x) <= 1 && Math.abs(t.y - c.y) <= 1) t.buff = Math.max(t.buff, b);
    }
    const mk = isMint(c) ? cnt(c, 'midas') : 0;
    if (mk) {
      const r = mintStats(c).range;
      for (const t of S.towers) if (!isMint(t) && dist2(t.x, t.y, c.x, c.y) <= r * r) t.midas = Math.max(t.midas, .4 * mk);
    }
  }
}
function update(dt){
  S.time += dt;
  S.incT += dt;
  if (S.incT >= 1) { S.incT -= 1; S.incI = (S.incI + 1) % S.inc.length; S.inc[S.incI] = 0; }
  if (S.waveActive && S.q.length) {
    S.spawnT -= dt;
    if (S.spawnT <= 0) { const it = S.q.shift(); spawnEnemy(it.ty); S.spawnT = S.q.length ? S.q[0].gap : 0; }
  }
  if (!S.waveActive && S.auto) { S.autoT -= dt; if (S.autoT <= 0) startWave(); }
  applyBuffs();
  for (const e of S.enemies) updEnemy(e, dt);
  for (const t of S.towers) updTower(t, dt);
  updProjs(dt);
  updHazards(dt);
  for (const f of S.fx) f.t -= dt;
  for (const p of S.parts) { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .93; p.vy *= .93; }
  S.fx = S.fx.filter(f => f.t > 0);
  S.parts = S.parts.filter(p => p.t > 0);
  S.enemies = S.enemies.filter(e => !e.dead);
  S.projs = S.projs.filter(p => !p.done);
  S.hazards = S.hazards.filter(h => h.t > 0);
  if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
  if (S.coreFlash > 0) S.coreFlash -= dt;
  if (S.waveActive && !S.over && !S.q.length && !S.enemies.length) endWave();
}
function gameOver(){
  S.over = true;
  S.best = Math.max(S.best, S.wave);
  closePanel();
  $('mut').classList.add('hidden');
  const ready = prestigeReady();
  $('oTxt').innerHTML = `Reached wave <b>${S.wave}</b> · Best <b>${S.best}</b><br>` + (ready
    ? `Prestige ready: <b style="color:#fde68a">+${prestigeReward()} ★</b>`
    : `<span style="color:#8590a6">Prestige requirements not met: no ★ this run</span>`);
  setText($('oNew'), ready ? `★ Ascend · +${prestigeReward()} ★` : 'New Map');
  $('oNew').classList.toggle('asc', ready);
  $('over').classList.remove('hidden');
  save();
}

// ================= Prestige =================
const clearedWaves = () => S.waveActive ? S.wave - 1 : S.wave;
function prestigeReqs(){
  const p = S.prestige;
  return [
    { icon:'≋', label:'Reach wave',    have:clearedWaves(), need:10 + 5 * p },
    { icon:'☠', label:'Bosses slain',  have:S.bossKills, need:1 + Math.floor(p / 2) },
    { icon:'✦', label:'Mutation tier', have:Math.max(0, ...S.towers.map(t => t.muts.length)), need:1 + Math.floor(p / 3) },
    { icon:'$', label:'Gold earned',   have:S.runEarned, need:1500 * Math.pow(2, p) },
  ];
}
const prestigeReady = () => prestigeReqs().every(r => r.have >= r.need);
const prestigeReward = () => Math.max(1, Math.floor(clearedWaves() / 10));
function ascend(){
  if (!prestigeReady()) throw new Error('Ascend called with prestige requirements unmet');
  newMap(prestigeReward());
}

// ================= Player actions =================
function place(type, x, y){
  const d = TOWERS[type];
  if (S.gold < d.cost) { sfx('err'); return; }
  S.gold -= d.cost;
  S.towers.push(makeTower(type, x, y));
  addFx({ k:'ring', x:x + .5, y:y + .5, r:.9, c:d.color, t:.4, life:.4, w:2 });
  burst(x + .5, y + .5, d.color, 10, 2);
  sfx('place');
  if (S.gold < d.cost) ui.build = null;
  save();
}
function upgrade(t){
  const c = upCost(t);
  if (S.gold < c) { sfx('err'); return; }
  S.gold -= c; t.invested += c; t.lv++;
  addFx({ k:'ring', x:t.x + .5, y:t.y + .5, r:.7, c:'#22d3ee', t:.3, life:.3, w:1.5 });
  sfx('up');
  if (t.lv % 5 === 0) {
    if (S.autoMut) applyMut(t, mutOptions(t)[0]);
    else openMut(t);
  }
  save();
}
function sell(t){
  S.gold += sellValue(t);
  burst(t.x + .5, t.y + .5, '#fbbf24', 12, 2);
  S.towers.splice(S.towers.indexOf(t), 1);
  sfx('sell');
  closePanel();
  save();
}
function mutOptions(t){ return shuffle(TRAIT_POOL[TOWERS[t.type].kind].slice()).slice(0, 3); }
function applyMut(t, k){
  t.muts.push(k);
  const tier = t.muts.length, c = isMint(t) ? '#fbbf24' : TIER_COL[Math.min(tier, 5)];
  addFx({ k:'ring', x:t.x + .5, y:t.y + .5, r:1.5, c, t:.7, life:.7, w:3 });
  burst(t.x + .5, t.y + .5, c, 24, 3);
  S.banner = { s: `${TOWERS[t.type].short} ✦${tier}: ${TRAITS[k].name}`, c:'#f0abfc', t:1.8 };
  sfx('mut');
  save();
}
function newMap(earned){
  S = freshRun({ prestige:S.prestige + earned, catalysts:S.catalysts, best:Math.max(S.best, S.wave), speed:S.speed, auto:S.auto, autoMut:S.autoMut, muted:S.muted });
  setMap(S.seed);
  closePanel();
  $('mut').classList.add('hidden');
  $('over').classList.add('hidden');
  closePrestige();
  ui.build = null;
  if (earned) { burst(W / TS / 2, H / TS / 2, '#fde68a', 60, 5); shake(5); sfx('mut'); }
  S.banner = { s: earned ? `ASCENDED · ★${S.prestige}  (+${S.prestige * 10}% dmg & gold)` : 'NEW MAP', c:'#fde68a', t:2.4 };
  save();
}

// ================= Rendering =================
const cv = $('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(3, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
const bg = document.createElement('canvas');
bg.width = W * DPR; bg.height = H * DPR;
const bctx = bg.getContext('2d');
bctx.setTransform(DPR, 0, 0, DPR, 0, 0);

function circle(c, x, y, r, f){ c.fillStyle = f; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function poly(c, n, r, rot){ c.beginPath(); for (let i = 0; i < n; i++) { const a = rot + i / n * Math.PI * 2; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); }
function glow(c, x, y, r, col, a){
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
}
function lin(c, x0, y0, x1, y1, a, b){ const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }

function renderBackground(){
  const c = bctx;
  c.fillStyle = '#06080d'; c.fillRect(0, 0, W, H);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const px = x * TS, py = y * TS;
    if (isPath(x, y)) { c.fillStyle = '#0d1422'; c.fillRect(px, py, TS, TS); continue; }
    // recessed build tile: dark well, shadowed top lip, lit bottom lip
    rr(c, px + 2, py + 2, TS - 4, TS - 4, 5);
    c.fillStyle = lin(c, 0, py, 0, py + TS, '#080b12', '#111725'); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.7)'; c.lineWidth = 1; c.stroke();
    c.beginPath(); c.moveTo(px + 6, py + TS - 2.5); c.lineTo(px + TS - 6, py + TS - 2.5);
    c.strokeStyle = 'rgba(255,255,255,.05)'; c.stroke();
    circle(c, px + TS / 2, py + TS / 2, .8, 'rgba(255,255,255,.05)');
  }
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath(); P.pts.forEach(([x, y], i) => i ? c.lineTo(x * TS, y * TS) : c.moveTo(x * TS, y * TS));
  c.strokeStyle = 'rgba(34,211,238,.09)'; c.lineWidth = 27; c.stroke();
  c.strokeStyle = '#0a101c'; c.lineWidth = 24; c.stroke();
  c.strokeStyle = '#111a2b'; c.lineWidth = 19; c.stroke();
  c.strokeStyle = 'rgba(34,211,238,.06)'; c.lineWidth = 8; c.stroke();
}

function drawTower(c, type, px, py, s, ang, tier, now, recoil){
  const d = TOWERS[type], col = d.color, dk = d.dark, tc = TIER_COL[Math.min(tier, 5)], r = s / 2, nb = 1 + Math.min(tier, 3);
  const mint = d.kind === 'mint', ringCol = mint ? '#fbbf24' : tc, k = recoil * r * .22;
  if (tier > 0) glow(c, px, py, r * (1.2 + .12 * Math.sin(now * 3 + px * .1) + tier * .04), ringCol, .45);
  c.save(); c.translate(px, py);
  // base plate
  rr(c, -r * .84, -r * .84, r * 1.68, r * 1.68, r * .3);
  c.fillStyle = lin(c, 0, -r, 0, r, '#252f45', '#0f1420'); c.fill();
  c.lineWidth = tier ? 1.4 : 1; c.strokeStyle = tier ? rgba(tc, .95) : rgba(col, .45); c.stroke();
  rr(c, -r * .74, -r * .74, r * 1.48, r * 1.48, r * .22); c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1; c.stroke();
  for (const [bx, by] of [[-1,-1],[1,-1],[-1,1],[1,1]]) circle(c, bx * r * .6, by * r * .6, .9, 'rgba(255,255,255,.18)');
  circle(c, 0, 0, r * .58, '#0a0e17');
  c.strokeStyle = rgba(col, .3); c.lineWidth = 1; c.beginPath(); c.arc(0, 0, r * .58, 0, 7); c.stroke();
  c.lineCap = 'round';
  switch (d.id) {
    case 'bolt': {
      c.save(); c.rotate(ang);
      for (let i = 0; i < nb; i++) {
        const o = (i - (nb - 1) / 2) * r * .2;
        c.fillStyle = '#cbd5e1'; c.fillRect(r * .1 - k, o - r * .06, r * .6, r * .12);
        c.fillStyle = col; c.fillRect(r * .62 - k, o - r * .07, r * .1, r * .14);
      }
      rr(c, -r * .36, -r * .28, r * .58, r * .56, r * .12); c.fillStyle = lin(c, 0, -r * .3, 0, r * .3, col, dk); c.fill();
      c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(-r * .28, -r * .22, r * .36, r * .07);
      c.restore();
      glow(c, 0, 0, r * .3, col, .5); circle(c, 0, 0, r * .1, '#fff');
      break;
    }
    case 'frost': {
      poly(c, 6, r * .5, Math.PI / 6); c.fillStyle = lin(c, 0, -r * .5, 0, r * .5, '#164e63', '#082f3a'); c.fill();
      c.strokeStyle = rgba(col, .8); c.lineWidth = 1; c.stroke();
      c.save(); c.rotate(now * .8);
      const n = 3 + nb;
      for (let i = 0; i < n; i++) {
        c.rotate(Math.PI * 2 / n);
        c.beginPath(); c.moveTo(r * .2, 0); c.lineTo(r * .34, -r * .06); c.lineTo(r * .48, 0); c.lineTo(r * .34, r * .06); c.closePath();
        c.fillStyle = '#cffafe'; c.fill();
      }
      c.restore();
      glow(c, 0, 0, r * .42, col, .55); circle(c, 0, 0, r * .12 * (1 + .15 * Math.sin(now * 4)), '#f0fdff');
      break;
    }
    case 'flak': {
      c.save(); c.rotate(ang);
      for (let i = 0; i < nb + 1; i++) {
        const o = (i - nb / 2) * r * .26;
        c.fillStyle = '#fdba74'; c.fillRect(r * .05 - k, o - r * .08, r * .58, r * .16);
        c.fillStyle = '#431407'; c.fillRect(r * .56 - k, o - r * .11, r * .12, r * .22);
      }
      rr(c, -r * .4, -r * .34, r * .62, r * .68, r * .08); c.fillStyle = lin(c, 0, -r * .34, 0, r * .34, col, dk); c.fill();
      c.strokeStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.moveTo(-r * .1, -r * .3); c.lineTo(-r * .1, r * .3); c.stroke();
      c.restore();
      circle(c, 0, 0, r * .1, '#fed7aa');
      break;
    }
    case 'mint': {
      const bright = 1 + tier * .25 + recoil * .6;
      poly(c, 8, r * .6, Math.PI / 8); c.fillStyle = lin(c, -r * .6, -r * .6, r * .6, r * .6, '#fde68a', '#92400e'); c.fill();
      c.strokeStyle = 'rgba(254,243,199,.6)'; c.lineWidth = 1; c.stroke();
      circle(c, 0, 0, r * .42, '#04241b');
      c.save(); c.rotate(now * 1.2);
      c.strokeStyle = '#fbbf24'; c.lineWidth = 1.2;
      for (let i = 0; i < 10; i++) { c.rotate(Math.PI / 5); c.beginPath(); c.moveTo(r * .3, 0); c.lineTo(r * .4, 0); c.stroke(); }
      c.restore();
      for (let i = 0; i < 3; i++) { const a = -now * .7 + i * Math.PI * 2 / 3; circle(c, Math.cos(a) * r * .5, Math.sin(a) * r * .5, r * .07, '#fef3c7'); }
      glow(c, 0, 0, r * .36 * bright, '#34d399', .7);
      const g = c.createRadialGradient(-r * .06, -r * .06, 0, 0, 0, r * .22);
      g.addColorStop(0, '#ecfdf5'); g.addColorStop(.5, '#34d399'); g.addColorStop(1, '#065f46');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * .22 * (1 + .08 * Math.sin(now * 4)), 0, 7); c.fill();
      break;
    }
    case 'tesla': {
      for (let i = 0; i < 3; i++) { c.strokeStyle = i % 2 ? dk : col; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r * (.5 - i * .11), 0, 7); c.stroke(); }
      const g = c.createRadialGradient(0, 0, 0, 0, 0, r * .2); g.addColorStop(0, '#fff'); g.addColorStop(1, col);
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * .2, 0, 7); c.fill();
      c.strokeStyle = '#ede9fe'; c.lineWidth = 1;
      for (let i = 0; i < nb + 1; i++) {
        const a = now * 5 + i * 2.1; c.beginPath(); c.moveTo(Math.cos(a) * r * .2, Math.sin(a) * r * .2);
        for (let j = 1; j <= 3; j++) { const q = .2 + j * .12, aa = a + (Math.random() - .5) * .5; c.lineTo(Math.cos(aa) * r * q, Math.sin(aa) * r * q); }
        c.stroke();
      }
      glow(c, 0, 0, r * .5, col, .35);
      break;
    }
    case 'venom': {
      c.save(); c.rotate(ang);
      for (let i = 0; i < nb; i++) {
        const o = (i - (nb - 1) / 2) * r * .22;
        c.fillStyle = '#166534'; c.fillRect(r * .1 - k, o - r * .09, r * .52, r * .18);
        c.fillStyle = '#86efac'; c.fillRect(r * .56 - k, o - r * .06, r * .1, r * .12);
      }
      c.restore();
      const g = c.createRadialGradient(-r * .12, -r * .12, 0, 0, 0, r * .4);
      g.addColorStop(0, '#dcfce7'); g.addColorStop(.45, col); g.addColorStop(1, dk);
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * .38, 0, 7); c.fill();
      for (let i = 0; i < 3; i++) { const p = (now * .6 + i / 3) % 1; circle(c, Math.sin(i * 2 + now) * r * .15, r * .2 - p * r * .4, r * .05 * (1 - p), 'rgba(220,252,231,.8)'); }
      break;
    }
    case 'rail': {
      c.save(); c.rotate(ang);
      for (let i = 0; i < nb; i++) {
        const o = (i - (nb - 1) / 2) * r * .3;
        c.fillStyle = '#93c5fd'; c.fillRect(r * .05 - k, o - r * .13, r * .95, r * .06); c.fillRect(r * .05 - k, o + r * .07, r * .95, r * .06);
        c.fillStyle = rgba(col, .5 + .5 * recoil); c.fillRect(r * .1 - k, o - r * .03, r * .88, r * .06);
      }
      rr(c, -r * .42, -r * .26, r * .56, r * .52, r * .08); c.fillStyle = lin(c, 0, -r * .26, 0, r * .26, col, dk); c.fill();
      for (let i = 0; i < 3; i++) circle(c, -r * .3 + i * r * .14, 0, r * .045, '#dbeafe');
      c.restore();
      break;
    }
    case 'prism': {
      c.save(); c.rotate(now * .8);
      const n = 4 + Math.min(tier, 3);
      c.beginPath();
      for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * Math.PI * 2, rad = i % 2 ? r * .22 : r * .56; c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
      c.closePath();
      const g = c.createRadialGradient(0, 0, 0, 0, 0, r * .56); g.addColorStop(0, '#fff'); g.addColorStop(.5, col); g.addColorStop(1, dk);
      c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = .8; c.stroke();
      c.restore();
      c.save(); c.rotate(ang); c.fillStyle = '#fdf4ff'; c.fillRect(r * .2, -r * .05, r * .32, r * .1); c.restore();
      glow(c, 0, 0, r * .3, '#ffffff', .6);
      break;
    }
    case 'hell': {
      c.save(); c.rotate(ang); c.translate(-k, 0);
      rr(c, -r * .44, -r * .42, r * .84, r * .84, r * .14); c.fillStyle = lin(c, 0, -r * .42, 0, r * .42, '#be123c', dk); c.fill();
      const tubes = nb + 2;
      for (let i = 0; i < tubes; i++) {
        const a = i / tubes * Math.PI * 2, tx = Math.cos(a) * r * .22 + r * .05, ty = Math.sin(a) * r * .22;
        circle(c, tx, ty, r * .11, '#1c0508');
        circle(c, tx, ty, r * .06, rgba('#fb923c', .4 + .6 * recoil));
      }
      c.restore();
      break;
    }
    case 'chrono': {
      c.strokeStyle = rgba(col, .8); c.lineWidth = 1;
      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * r * .48, Math.sin(a) * r * .48); c.lineTo(Math.cos(a) * r * .55, Math.sin(a) * r * .55); c.stroke(); }
      c.beginPath(); c.moveTo(-r * .26, -r * .38); c.lineTo(r * .26, -r * .38); c.lineTo(-r * .26, r * .38); c.lineTo(r * .26, r * .38); c.closePath();
      c.fillStyle = lin(c, 0, -r * .4, 0, r * .4, '#f8fafc', '#94a3b8'); c.fill();
      const sand = (now * .25) % 1;
      c.fillStyle = '#facc15';
      c.beginPath(); c.moveTo(-r * .18 * (1 - sand), -r * .26 * (1 - sand) - r * .02); c.lineTo(r * .18 * (1 - sand), -r * .26 * (1 - sand) - r * .02); c.lineTo(0, -r * .02); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(-r * .18 * sand, r * .36); c.lineTo(r * .18 * sand, r * .36); c.lineTo(0, r * .36 - r * .2 * sand); c.closePath(); c.fill();
      c.save(); c.rotate(now * 2); c.strokeStyle = '#facc15'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -r * .5); c.stroke(); c.restore();
      break;
    }
    case 'sing': {
      glow(c, 0, 0, r * .7, col, .5);
      c.save(); c.rotate(now * 1.5); c.scale(1, .45);
      c.strokeStyle = lin(c, -r * .6, 0, r * .6, 0, '#f0abfc', '#7e22ce'); c.lineWidth = 3;
      c.beginPath(); c.arc(0, 0, r * .48, 0, 7); c.stroke();
      c.restore();
      c.save(); c.rotate(-now * 3); c.strokeStyle = '#e879f9'; c.lineWidth = 1;
      for (let i = 0; i < nb + 1; i++) { c.rotate(Math.PI * 2 / (nb + 1)); c.beginPath(); c.arc(0, 0, r * .36, 0, 1); c.stroke(); }
      c.restore();
      circle(c, 0, 0, r * .26, '#000');
      c.strokeStyle = 'rgba(253,224,255,.9)'; c.lineWidth = .8; c.beginPath(); c.arc(0, 0, r * .27, 0, 7); c.stroke();
      break;
    }
  }
  c.restore();
  for (let i = 0; i < Math.min(tier, 4); i++) {
    const rx = r * (.98 + i * .13), ry = r * (.32 + i * .07);
    c.save(); c.translate(px, py); c.rotate(now * (.7 + i * .35) * (i % 2 ? -1 : 1) + i);
    c.strokeStyle = rgba(ringCol, .6); c.lineWidth = 1;
    c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, 7); c.stroke();
    glow(c, rx, 0, 3.5, ringCol, .8); circle(c, rx, 0, 1.4, '#fff');
    c.restore();
  }
  if (tier > 0) {
    const bx = px + r * .64, by = py - r * .64;
    circle(c, bx, by, 5.8, '#05070b'); circle(c, bx, by, 5, tc);
    c.fillStyle = '#05070b'; c.font = '800 7.5px system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(tier), bx, by + .4);
  }
}

function drawEnemy(e, now){
  const d = ENEMIES[e.type], px = e.x * TS, py = e.y * TS, s = d.size * TS;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(px, py + s * .75, s * .9, s * .35, 0, 0, 7); ctx.fill();
  if (e.boss) glow(ctx, px, py, s * 2, '#ef4444', .4 + .15 * Math.sin(now * 5));
  if (e.type === 'runner') { ctx.strokeStyle = rgba(d.color, .3); ctx.lineWidth = s; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - Math.cos(e.ang) * s * 2.5, py - Math.sin(e.ang) * s * 2.5); ctx.stroke(); }
  const g = ctx.createRadialGradient(px - s * .35, py - s * .4, 0, px, py, s * 1.3);
  g.addColorStop(0, d.light); g.addColorStop(.55, d.color); g.addColorStop(1, rgba(d.color, .7));
  ctx.save(); ctx.translate(px, py);
  ctx.beginPath();
  if (d.shape === 'circle') ctx.arc(0, 0, s, 0, 7);
  else if (d.shape === 'tri') { for (let i = 0; i < 3; i++) { const b = e.ang + i * Math.PI * 2 / 3, k = i ? 1 : 1.4; ctx.lineTo(Math.cos(b) * s * k, Math.sin(b) * s * k); } ctx.closePath(); }
  else if (d.shape === 'square') { ctx.rotate(e.ang); rr(ctx, -s, -s, s * 2, s * 2, s * .3); }
  else { for (let i = 0; i < 12; i++) { const b = i / 12 * Math.PI * 2 + now * .8, rad = i % 2 ? s * .78 : s * 1.08; ctx.lineTo(Math.cos(b) * rad, Math.sin(b) * rad); } ctx.closePath(); }
  ctx.translate(-px, -py);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
  if (d.shape === 'square') { ctx.save(); ctx.translate(px, py); ctx.rotate(e.ang); rr(ctx, -s * .55, -s * .55, s * 1.1, s * 1.1, s * .15); ctx.fillStyle = 'rgba(30,10,50,.45)'; ctx.fill(); ctx.restore(); }
  // eye / core facing the direction of travel
  const ex = px + Math.cos(e.ang) * s * .35, ey = py + Math.sin(e.ang) * s * .35;
  circle(ctx, ex, ey, Math.max(1.2, s * .28), 'rgba(10,6,16,.85)');
  circle(ctx, ex, ey, Math.max(.6, s * .12), e.boss ? '#fde047' : '#fff');
  if (e.slowT > 0) { ctx.strokeStyle = 'rgba(103,232,249,.85)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(px, py, s + 1.8, 0, 7); ctx.stroke(); }
  if (e.pT > 0) for (let i = 0; i < Math.min(3, e.pStacks); i++) circle(ctx, px + Math.cos(now * 3 + i * 2.1) * (s + 2), py + Math.sin(now * 3 + i * 2.1) * (s + 2), 1.3, '#4ade80');
  if (e.shield > 0) {
    ctx.save(); ctx.translate(px, py); poly(ctx, 6, s + 3.5, now);
    ctx.strokeStyle = `rgba(94,234,212,${.25 + .7 * e.shield / e.maxShield})`; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = `rgba(94,234,212,${.08 * e.shield / e.maxShield})`; ctx.fill(); ctx.restore();
  }
  if (e.hp < e.maxHp || e.boss || e.shield < e.maxShield) {
    const bw = Math.max(14, s * 2.4), bx = px - bw / 2, by = py - s - 7;
    rr(ctx, bx - 1, by - 1, bw + 2, 4, 2); ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fill();
    const f = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = f > .5 ? '#4ade80' : f > .25 ? '#facc15' : '#fb7185'; ctx.fillRect(bx, by, bw * f, 2);
    if (e.maxShield > 0) { ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(bx - 1, by - 4, bw + 2, 3); ctx.fillStyle = '#5eead4'; ctx.fillRect(bx, by - 3.5, bw * e.shield / e.maxShield, 1.5); }
  }
}

function drawRange(x, y, r, col){
  ctx.beginPath(); ctx.arc(x * TS, y * TS, r * TS, 0, 7);
  ctx.fillStyle = rgba(col, .07); ctx.fill();
  ctx.setLineDash([4, 4]); ctx.lineDashOffset = -performance.now() / 60;
  ctx.strokeStyle = rgba(col, .6); ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
}

function drawDynamicMap(now){
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // animated energy flow along the path
  ctx.beginPath(); P.pts.forEach(([x, y], i) => i ? ctx.lineTo(x * TS, y * TS) : ctx.moveTo(x * TS, y * TS));
  ctx.setLineDash([3, 9]); ctx.lineDashOffset = -now * 22;
  ctx.strokeStyle = 'rgba(103,232,249,.45)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.setLineDash([]);
  for (let k = 0, n = Math.ceil(P.len / 3); k < n; k++) {
    const [x, y] = posAt((now * 1.4 + k * 3) % P.len);
    glow(ctx, x * TS, y * TS, 7, '#22d3ee', .35);
  }
  // spawn portal
  const [sx, sy] = P.pts[0], spx = sx * TS, spy = sy * TS;
  glow(ctx, spx, spy, 16, '#c026d3', .55);
  circle(ctx, spx, spy, 6, '#12021a');
  for (let i = 0; i < 4; i++) {
    const a = now * (2.2 + i * .6) * (i % 2 ? -1 : 1) + i * 1.7;
    ctx.strokeStyle = i % 2 ? 'rgba(244,114,182,.9)' : 'rgba(232,121,249,.9)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(spx, spy, 5 + i * 2.6, a, a + 2.8); ctx.stroke();
  }
  // core base
  const [ex, ey] = P.pts[P.pts.length - 1], cpx = ex * TS, cpy = ey * TS, flash = S.coreFlash > 0, pulse = Math.sin(now * 3);
  const cc = flash ? '#fb7185' : '#22d3ee';
  glow(ctx, cpx, cpy, 18 + pulse * 2, cc, .5);
  ctx.save(); ctx.translate(cpx, cpy);
  poly(ctx, 6, 11 + pulse, Math.PI / 6); ctx.fillStyle = flash ? 'rgba(251,113,133,.35)' : 'rgba(8,47,73,.9)'; ctx.fill();
  ctx.strokeStyle = cc; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.rotate(-now); poly(ctx, 6, 6.5, 0); ctx.strokeStyle = rgba(cc, .7); ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
  circle(ctx, cpx, cpy, 3 + pulse * .5, flash ? '#fecdd3' : '#cffafe');
}

function render(now){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (ui.shake > .05) ctx.translate((Math.random() - .5) * ui.shake, (Math.random() - .5) * ui.shake);
  ctx.fillStyle = '#06080d'; ctx.fillRect(-8, -8, W + 16, H + 16);
  drawDynamicMap(now);
  // hazards
  for (const h of S.hazards) {
    const a = h.t / h.life, px = h.x * TS, py = h.y * TS, r = h.r * TS;
    if (h.k === 'lava') {
      const g = ctx.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, `rgba(254,215,170,${.6 * a})`); g.addColorStop(.5, `rgba(249,115,22,${.45 * a})`); g.addColorStop(1, 'rgba(244,63,94,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r * (.9 + .1 * Math.sin(now * 12 + px)), 0, 7); ctx.fill();
    } else {
      glow(ctx, px, py, r * 1.1, '#c026d3', .3 * a);
      ctx.strokeStyle = `rgba(232,121,249,${.85 * a})`; ctx.lineWidth = 1.5;
      for (let i = 0; i < 5; i++) { const b = -now * 6 + i * Math.PI * .4; ctx.beginPath(); ctx.arc(px, py, r * (.3 + i * .14), b, b + 1.8); ctx.stroke(); }
      circle(ctx, px, py, r * .26, '#000');
      ctx.strokeStyle = `rgba(253,224,255,${a})`; ctx.lineWidth = .8; ctx.beginPath(); ctx.arc(px, py, r * .27, 0, 7); ctx.stroke();
    }
  }
  // chrono fields & midas auras
  for (const t of S.towers) {
    const d = TOWERS[t.type];
    if (d.buff) { ctx.setLineDash([2, 5]); ctx.lineDashOffset = now * 10; ctx.strokeStyle = 'rgba(226,232,240,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc((t.x + .5) * TS, (t.y + .5) * TS, stats(t).range * TS, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    if (isMint(t) && cnt(t, 'midas')) { ctx.strokeStyle = 'rgba(251,191,36,.18)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc((t.x + .5) * TS, (t.y + .5) * TS, mintStats(t).range * TS, 0, 7); ctx.stroke(); }
  }
  // build hover
  const hv = ui.hover;
  if (hv && !S.over) {
    const free = !isPath(hv.x, hv.y) && !towerAt(hv.x, hv.y);
    if (ui.build !== null) {
      const ok = free && S.gold >= TOWERS[ui.build].cost;
      rr(ctx, hv.x * TS + 2, hv.y * TS + 2, TS - 4, TS - 4, 5);
      ctx.fillStyle = ok ? 'rgba(74,222,128,.16)' : 'rgba(251,113,133,.18)'; ctx.fill();
      ctx.strokeStyle = ok ? 'rgba(74,222,128,.7)' : 'rgba(251,113,133,.7)'; ctx.lineWidth = 1; ctx.stroke();
      if (free) {
        const bd = TOWERS[ui.build];
        if (bd.kind !== 'rail') drawRange(hv.x + .5, hv.y + .5, bd.range, ok ? bd.color : '#fb7185');
        ctx.globalAlpha = .55; drawTower(ctx, ui.build, (hv.x + .5) * TS, (hv.y + .5) * TS, TS, -Math.PI / 2, 0, now, 0); ctx.globalAlpha = 1;
      }
    } else if (free) {
      rr(ctx, hv.x * TS + 2, hv.y * TS + 2, TS - 4, TS - 4, 5);
      ctx.fillStyle = 'rgba(34,211,238,.06)'; ctx.fill();
      ctx.strokeStyle = 'rgba(34,211,238,.45)'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  // inspected tower
  if (ui.sel) {
    const t = ui.sel, col = TOWERS[t.type].color, r = isMint(t) ? mintStats(t).range : stats(t).range;
    if (r < 50) drawRange(t.x + .5, t.y + .5, r, col);
    rr(ctx, t.x * TS + 1, t.y * TS + 1, TS - 2, TS - 2, 6); ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
  }
  for (const t of S.towers) drawTower(ctx, t.type, (t.x + .5) * TS, (t.y + .5) * TS, TS, t.ang, t.muts.length, now, t.recoil);
  for (const e of S.enemies) drawEnemy(e, now);
  // prism beams
  for (const t of S.towers) {
    if (TOWERS[t.type].kind !== 'beam' || !t.target || t.target.dead) continue;
    const x1 = (t.x + .5) * TS, y1 = (t.y + .5) * TS, x2 = t.target.x * TS, y2 = t.target.y * TS, w = 1.2 + Math.min(t.lock, 6) * .7;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(240,171,252,.28)'; ctx.lineWidth = w * 3.2; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = '#fdf4ff'; ctx.lineWidth = w; ctx.stroke();
    glow(ctx, x2, y2, 4 + w * 2, '#f0abfc', .7);
  }
  // projectiles
  for (const p of S.projs) {
    if (p.kind === 'hell') {
      circle(ctx, p.x * TS, p.y * TS, 2, 'rgba(0,0,0,.4)');
      glow(ctx, p.x * TS, (p.y - p.h) * TS, 6, '#f97316', .7);
      circle(ctx, p.x * TS, (p.y - p.h) * TS, 1.6, '#fff7ed');
    } else {
      glow(ctx, p.x * TS, p.y * TS, p.kind === 'flak' ? 6 : 5, p.c, .75);
      circle(ctx, p.x * TS, p.y * TS, p.kind === 'flak' ? 1.8 : 1.3, '#ffffff');
    }
  }
  // particles
  for (const p of S.parts) { ctx.globalAlpha = Math.min(1, p.t / p.life * 1.6); circle(ctx, p.x * TS, p.y * TS, p.s, p.c); }
  ctx.globalAlpha = 1;
  // fx
  ctx.lineCap = 'round';
  for (const f of S.fx) {
    const a = f.t / f.life;
    if (f.k === 'ring') {
      ctx.beginPath(); ctx.arc(f.x * TS, f.y * TS, f.r * TS * (1 - a * .7), 0, 7);
      if (f.fill) { ctx.fillStyle = rgba(f.c, a * .2); ctx.fill(); }
      ctx.strokeStyle = rgba(f.c, a); ctx.lineWidth = f.w || 1.5; ctx.stroke();
    } else if (f.k === 'line') {
      ctx.strokeStyle = rgba(f.c, a * .35); ctx.lineWidth = f.w * a * 3; ctx.beginPath(); ctx.moveTo(f.x1 * TS, f.y1 * TS); ctx.lineTo(f.x2 * TS, f.y2 * TS); ctx.stroke();
      ctx.strokeStyle = rgba(f.c, a); ctx.lineWidth = f.w * a; ctx.stroke();
    } else if (f.k === 'zap') {
      ctx.beginPath();
      f.pts.forEach(([x, y], i) => {
        if (!i) { ctx.moveTo(x * TS, y * TS); return; }
        const [px, py] = f.pts[i - 1];
        for (let k = 1; k <= 3; k++) { const q = k / 4; ctx.lineTo((px + (x - px) * q) * TS + (Math.random() - .5) * 6, (py + (y - py) * q) * TS + (Math.random() - .5) * 6); }
        ctx.lineTo(x * TS, y * TS);
      });
      ctx.strokeStyle = rgba(f.c, a * .35); ctx.lineWidth = 4; ctx.stroke();
      ctx.strokeStyle = rgba('#ede9fe', a); ctx.lineWidth = 1.3; ctx.stroke();
    }
  }
  // floating numbers on top
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const f of S.fx) {
    if (f.k !== 'text') continue;
    const a = f.t / f.life, rise = (1 - a) * (f.big ? .6 : .45), sc = f.big ? 1 + .25 * Math.max(0, a - .8) * 5 : 1;
    ctx.font = `${f.big ? 800 : 700} ${(f.big ? 10 : 8) * sc}px system-ui,sans-serif`;
    ctx.globalAlpha = Math.min(1, a * 2);
    ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 2.5; ctx.strokeText(f.s, f.x * TS, (f.y - rise) * TS);
    ctx.fillStyle = f.c; ctx.fillText(f.s, f.x * TS, (f.y - rise) * TS);
  }
  ctx.globalAlpha = 1;
  // banner
  if (S.banner) {
    const b = S.banner;
    ctx.globalAlpha = Math.min(1, b.t * 2);
    ctx.font = '800 10.5px system-ui,sans-serif';
    const tw = ctx.measureText(b.s).width + 22;
    rr(ctx, W / 2 - tw / 2, 6, tw, 19, 9.5); ctx.fillStyle = 'rgba(8,11,18,.82)'; ctx.fill();
    ctx.strokeStyle = rgba(b.c, .8); ctx.lineWidth = 1; ctx.stroke();
    glow(ctx, W / 2, 15.5, tw / 2, b.c, .12);
    ctx.fillStyle = b.c; ctx.fillText(b.s, W / 2, 16);
    ctx.globalAlpha = 1;
  }
}

// ================= UI =================
function setText(el, v){ if (el._v !== v) { el._v = v; el.textContent = v; } }
function iconCanvas(cvs, type, size, tier){
  cvs.width = cvs.height = size * DPR;
  const g = cvs.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, size, size);
  drawTower(g, type, size / 2, size / 2, size * .86, -Math.PI / 4, tier, .6, 0);
}
const bar = $('bar'), tip = $('tip'), hot = [];
TOWERS.forEach((d, i) => {
  const b = document.createElement('button');
  b.className = 'tw';
  b.style.setProperty('--rc', RARITY[d.rarity].c);
  const key = document.createElement('span'); key.className = 'k'; key.textContent = HOTKEYS[i];
  const c = document.createElement('canvas'); iconCanvas(c, i, 30, 0);
  const n = document.createElement('span'); n.className = 'n'; n.textContent = d.short;
  const k = document.createElement('span'); k.className = 'c'; k.textContent = '$' + fmt(d.cost);
  b.append(key, c, n, k);
  b.onclick = () => { ui.build = ui.build === i ? null : i; closePanel(); };
  b.onmouseenter = () => {
    setText($('tName'), d.name); setText($('tCost'), '$' + d.cost.toLocaleString());
    const tr = $('tRole'); setText(tr, `${RARITY[d.rarity].name} · ${d.role}`); tr.style.color = RARITY[d.rarity].c;
    setText($('tDesc'), d.desc);
    tip.classList.remove('hidden');
    const x = b.offsetLeft - bar.scrollLeft + b.offsetWidth / 2 - tip.offsetWidth / 2;
    tip.style.left = Math.max(6, Math.min(400 - tip.offsetWidth - 8, x)) + 'px';
  };
  b.onmouseleave = () => tip.classList.add('hidden');
  bar.append(b); hot.push(b);
});
bar.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { bar.scrollLeft += e.deltaY; e.preventDefault(); tip.classList.add('hidden'); } }, { passive:false });

function openPanel(t){
  ui.sel = t; ui.build = null;
  const p = $('panel');
  p.style.left = t.x < COLS / 2 ? 'auto' : '6px';
  p.style.right = t.x < COLS / 2 ? '6px' : 'auto';
  p.classList.remove('hidden');
  $('pMuts')._k = null;
  refreshPanel();
}
function closePanel(){ ui.sel = null; $('panel').classList.add('hidden'); }
function refreshPanel(){
  const t = ui.sel, d = TOWERS[t.type], tier = t.muts.length, pm = $('pMuts'), key = t.type + ':' + t.muts.join(',');
  if (pm._k !== key) {
    pm._k = key;
    iconCanvas($('pIcon'), t.type, 26, tier);
    pm.innerHTML = '';
    for (const m of t.muts) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = TRAITS[m].icon + ' ' + TRAITS[m].name.split(' ')[0]; c.title = `${TRAITS[m].name}: ${TRAITS[m].desc}`; pm.append(c); }
    pm.classList.toggle('hidden', !tier);
  }
  setText($('pName'), d.name);
  setText($('pRole'), d.role);
  const pt = $('pTier');
  setText(pt, tier ? `✦${tier}` : 'BASE');
  pt.style.background = TIER_COL[Math.min(tier, 5)];
  setText($('pLv'), String(t.lv));
  const nextMut = (Math.floor(t.lv / 5) + 1) * 5;
  setText($('pNext'), `✦ at Lv ${nextMut}`);
  $('pBar').style.width = (t.lv % 5) * 20 + '%';
  if (isMint(t)) {
    const m = mintStats(t);
    setText($('pK1'), '$/sec'); setText($('pV1'), fmt(m.gps));
    setText($('pK2'), 'Wave $'); setText($('pV2'), fmt(m.bonus));
    setText($('pK3'), 'Range'); setText($('pV3'), m.range.toFixed(1));
  } else {
    const s = stats(t);
    setText($('pK1'), d.kind === 'beam' ? 'DPS ×64' : 'DPS'); setText($('pV1'), fmt(dpsOf(t, s)));
    setText($('pK2'), 'Range'); setText($('pV2'), s.range > 50 ? '∞' : s.range.toFixed(1));
    setText($('pK3'), 'Kills'); setText($('pV3'), fmt(t.kills));
  }
  setText($('pV4'), fmt(t.earned));
  const c = upCost(t), up = $('pUp'), mutNext = (t.lv + 1) % 5 === 0;
  setText(up, `${mutNext ? '✦ Mutate' : '▲ Upgrade'} → Lv ${t.lv + 1}  ·  $${fmt(c)}`);
  up.classList.toggle('mut', mutNext);
  up.disabled = S.gold < c;
  setText($('pSell'), `Sell $${fmt(sellValue(t))}`);
  setText($('pAuto'), `Auto-mut ${S.autoMut ? 'ON' : 'OFF'}`);
  $('pAuto').classList.toggle('on', S.autoMut);
}
function openMut(t){
  ui.mutT = t; ui.mutOpts = mutOptions(t);
  setText($('mTitle'), `· ${TOWERS[t.type].short} ✦${t.muts.length + 1}`);
  setText($('mSub'), `Pick a trait · every choice also grants ×1.5 ${isMint(t) ? 'gold generation' : 'damage'}`);
  renderMutOpts();
  $('mut').classList.remove('hidden');
}
function renderMutOpts(){
  const box = $('mOpts'), eco = isMint(ui.mutT);
  box.innerHTML = '';
  for (const k of ui.mutOpts) {
    const tr = TRAITS[k], b = document.createElement('button');
    b.className = 'mc glass' + (eco ? ' eco' : '');
    b.innerHTML = `<span class="i">${tr.icon}</span><span class="t">${tr.name}</span><span class="d">${tr.desc}</span><span class="m">+50% ${eco ? 'GOLD' : 'DMG'}</span>`;
    b.onclick = () => { const t = ui.mutT; ui.mutT = null; $('mut').classList.add('hidden'); applyMut(t, k); };
    box.append(b);
  }
}
const reqCards = [0, 1, 2, 3].map(() => {
  const el = document.createElement('div');
  el.className = 'rq';
  el.innerHTML = '<div class="rq-i"></div><div class="rq-b"><div class="rq-l"></div><div class="rq-v"></div><div class="rq-bar"><i></i></div></div>';
  $('prReqs').append(el);
  return { el, icon:el.querySelector('.rq-i'), label:el.querySelector('.rq-l'), value:el.querySelector('.rq-v'), bar:el.querySelector('.rq-bar i') };
});
function openPrestige(){ closePanel(); ui.build = null; ui.pres = true; ui.rerollT = 0; $('pres').classList.remove('hidden'); refreshPrestige(prestigeReady()); }
function closePrestige(){ ui.pres = false; $('pres').classList.add('hidden'); }
function refreshPrestige(ready){
  const reqs = prestigeReqs(), reward = prestigeReward(), met = reqs.filter(r => r.have >= r.need).length;
  reqs.forEach((r, i) => {
    const c = reqCards[i], done = r.have >= r.need;
    c.el.classList.toggle('done', done);
    setText(c.icon, done ? '✓' : r.icon);
    setText(c.label, r.label);
    const v = `${fmt(Math.min(r.have, r.need))} / ${fmt(r.need)}`;
    if (c.value._v !== v) { c.value._v = v; const [a, b] = v.split(' / '); c.value.innerHTML = `${a} <span class="n">/ ${b}</span>`; }
    c.bar.style.width = Math.min(100, r.have / r.need * 100) + '%';
  });
  setText($('prFrom'), String(S.prestige));
  setText($('prTo'), String(S.prestige + (ready ? reward : 0)));
  setText($('prBonus'), `+${S.prestige * 10}% → +${(S.prestige + (ready ? reward : 0)) * 10}% dmg & gold`);
  $('prEmblem').classList.toggle('ready', ready);
  const go = $('prGo');
  go.disabled = !ready;
  setText(go, ready ? `★ Ascend · +${reward} ★` : `🔒 Locked · ${met}/4 met`);
  const rr = $('prReroll');
  setText(rr, ui.rerollT > 0 ? 'Sure? Lose run' : '⟳ Reroll map');
  rr.classList.toggle('sell', ui.rerollT > 0);
}
function updateUI(){
  setText($('sWave'), String(S.wave));
  setText($('sGold'), fmt(S.gold));
  setText($('sRate'), `+${fmt(incomeRate())}/s`);
  setText($('sLives'), String(Math.max(0, S.lives)));
  const bw = $('bWave');
  bw.disabled = S.waveActive || S.over;
  bw.title = S.waveActive ? `Wave ${S.wave} in progress` : `Start wave ${S.wave + 1} (Space)`;
  setText($('bSpeed'), S.speed + 'x');
  $('bSpeed').classList.toggle('on', S.speed > 1);
  $('bAuto').classList.toggle('on', S.auto);
  $('bMute').classList.toggle('off', S.muted);
  const ready = prestigeReady(), bp = $('bPres');
  bp.classList.toggle('ready', ready);
  bp.title = `Prestige · ★${S.prestige} (+${S.prestige * 10}% dmg & gold) · ◆${S.catalysts} Catalysts${ready ? '\nReady to ascend!' : ''}`;
  if (ui.pres) refreshPrestige(ready);
  $('bMinPath').setAttribute('d', ui.min ? 'm4 10 4-4 4 4' : 'm4 6 4 4 4-4');
  hot.forEach((b, i) => { b.classList.toggle('sel', ui.build === i); b.classList.toggle('poor', S.gold < TOWERS[i].cost); });
  if (ui.sel) refreshPanel();
  if (ui.mutT) {
    const r = $('mReroll');
    setText(r, `Reroll · 1◆ (have ${S.catalysts})`);
    r.disabled = S.catalysts < 1;
    setText($('mAuto'), `Auto-mut ${S.autoMut ? 'ON' : 'OFF'}`);
    $('mAuto').classList.toggle('on', S.autoMut);
  }
}

// ================= Input =================
function tileOf(ev){
  const r = cv.getBoundingClientRect();
  return { x: Math.floor((ev.clientX - r.left) / r.width * COLS), y: Math.floor((ev.clientY - r.top) / r.height * ROWS) };
}
cv.addEventListener('mousemove', ev => { ui.hover = tileOf(ev); });
cv.addEventListener('mouseleave', () => { ui.hover = null; });
cv.addEventListener('contextmenu', ev => { ev.preventDefault(); ui.build = null; closePanel(); });
cv.addEventListener('click', ev => {
  if (S.over) return;
  const { x, y } = tileOf(ev), t = towerAt(x, y);
  if (t) { openPanel(t); return; }
  if (ui.build !== null && !isPath(x, y)) { place(ui.build, x, y); return; }
  closePanel();
});
document.addEventListener('pointerdown', initAudio);
$('pClose').onclick = closePanel;
$('pUp').onclick = () => upgrade(ui.sel);
$('pSell').onclick = () => sell(ui.sel);
$('pAuto').onclick = $('mAuto').onclick = () => { S.autoMut = !S.autoMut; save(); };
$('mReroll').onclick = () => { S.catalysts--; ui.mutOpts = mutOptions(ui.mutT); renderMutOpts(); save(); };
$('bWave').onclick = startWave;
$('bSpeed').onclick = () => { S.speed = S.speed % 3 + 1; save(); };
$('bAuto').onclick = () => { S.auto = !S.auto; S.autoT = 1; save(); };
$('bMute').onclick = () => { S.muted = !S.muted; save(); };
$('bPres').onclick = () => ui.pres ? closePrestige() : openPrestige();
$('prClose').onclick = closePrestige;
$('prGo').onclick = ascend;
$('prReroll').onclick = () => { if (ui.rerollT > 0) newMap(0); else ui.rerollT = 3; };
$('oNew').onclick = () => prestigeReady() ? ascend() : newMap(0);
$('bMin').onclick = () => { ui.min = !ui.min; $('w').classList.toggle('min', ui.min); tip.classList.add('hidden'); save(); };
document.addEventListener('keydown', ev => {
  if (ev.code === 'Space') {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    ev.preventDefault(); startWave(); return;
  }
  if (ev.key === 'Escape') { ui.build = null; closePanel(); closePrestige(); return; }
  const i = HOTKEYS.indexOf(ev.key);
  if (i >= 0 && !S.over) { ui.build = ui.build === i ? null : i; closePanel(); }
});
window.addEventListener('beforeunload', save);

// ================= Desktop overlay bridge =================
if (window.overlay) {
  document.documentElement.classList.add('overlay');
  new ResizeObserver(() => { const r = $('w').getBoundingClientRect(); window.overlay.fit(r.width, r.height); }).observe($('w'));
}

// ================= Main loop =================
load();
$('w').classList.toggle('min', ui.min);
if (S.over) gameOver();
let last = performance.now(), acc = 0, lastSave = 0;
function frame(now){
  const dt = Math.min((now - last) / 1000, .25);
  last = now;
  if (ui.rerollT > 0) ui.rerollT -= dt;
  ui.shake *= Math.exp(-dt * 12);
  if (!S.over && !ui.mutT) {
    acc += dt;
    while (acc >= STEP) { for (let i = 0; i < S.speed; i++) update(STEP); acc -= STEP; }
  } else acc = 0;
  if (!ui.min) render(now / 1000);
  updateUI();
  if (now - lastSave > 10000) { lastSave = now; save(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
