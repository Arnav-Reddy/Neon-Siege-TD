<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Neon Siege TD</title>
<style>
/* Bone & Ember: warm paper, ink rules, flat colour, hard offset shadows. */
:root{
  --paper:#fff4dc;--paper2:#ffe8bc;--paper3:#ffdc96;--ink:#16115e;--ink2:#4a4592;--ink3:#8783b6;
  --ember:#ff653f;--ochre:#ffc85c;--moss:#3730aa;--plum:#3730aa;--steel:#3730aa;
  --rule:1.5px solid var(--ink);--shadow:3px 3px 0 var(--ink);--shadow-sm:2px 2px 0 var(--ink);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f3dfb4;color:var(--ink);font-family:var(--sans)}
body{background-image:radial-gradient(rgba(22,17,94,.12) 1px,transparent 1px);background-size:14px 14px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
svg{display:block}
.hidden{display:none!important}
.glass{background:var(--paper);border:var(--rule);box-shadow:var(--shadow)}
.lbl{font-size:8px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3)}

/* ---------- Shell (position via #wrap, size via zoom on #w) ---------- */
#wrap{position:fixed;z-index:2147483000}
#w{position:relative;width:400px;height:344px;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:var(--paper);border:var(--rule);border-radius:7px;box-shadow:4px 4px 0 var(--ink);font-size:11px;font-variant-numeric:tabular-nums}
#w.min{width:auto;height:40px}
#w.min .full{display:none!important}
#w.dragging{box-shadow:7px 7px 0 var(--ink)}
html.overlay,html.overlay body{background:transparent;background-image:none}
html.overlay #wrap{left:0;top:0}
html.overlay #w{box-shadow:none}
html.overlay .handle{-webkit-app-region:drag}

/* ---------- Top bar ---------- */
#top{height:38px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 3px;border-bottom:var(--rule);background:var(--paper2)}
#w.min #top{border-bottom:none}
.grip{width:14px;height:26px;display:grid;place-items:center;color:var(--ink3);cursor:grab}
.grip:hover{color:var(--ink)}
.stats{display:flex;align-items:center;flex:1;min-width:0;height:26px;overflow:hidden;white-space:nowrap;cursor:grab;
  background:var(--paper);border:var(--rule);border-radius:4px}
#w.dragging .stats,#w.dragging .grip{cursor:grabbing}
.st{display:flex;align-items:center;gap:3px;height:100%;padding:0 5px;font-family:var(--mono);font-weight:700;font-size:11px;color:var(--ink)}
.st+.st{border-left:var(--rule)}
.st svg{width:11px;height:11px;flex:none}
.st-w svg{color:var(--steel)}.st-g svg{color:var(--ochre)}.st-l svg{color:var(--ember)}
.st .rate{font-size:9.5px;font-weight:700;color:var(--moss)}
.st-l.hurt{animation:hurt .45s steps(2) 2}
@keyframes hurt{50%{background:var(--ember);color:var(--paper)}}
.ib{height:26px;min-width:24px;padding:0 4px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  background:var(--paper);border:var(--rule);box-shadow:var(--shadow-sm);color:var(--ink);font-family:var(--mono);font-size:10.5px;font-weight:700;
  transition:background .1s}
.ib svg{width:12px;height:12px}
.ib:hover{background:var(--paper3)}
.ib:active{transform:translate(2px,2px);box-shadow:none}
.ib.go{background:var(--ember);color:var(--paper)}
.ib.go:hover{background:#f04f28}
.ib.go:disabled{background:var(--paper2);color:var(--ink3);box-shadow:none;cursor:default;transform:translate(2px,2px)}
.ib.on{background:var(--ink);color:var(--paper)}
.seg{display:flex;gap:3px}
.ib .alt{display:none}.ib.off .main{display:none}.ib.off .alt{display:block}.ib.off{color:var(--ink3)}
.ib.star{color:var(--ink)}
.ib.star.ready{background:var(--ochre);color:var(--ink);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-2px)}}

/* ---------- Stage ---------- */
#stage{position:relative;width:384px;height:224px;margin:7px auto 0;flex:none;border:var(--rule);border-radius:4px;overflow:hidden;box-sizing:content-box}
#cv{display:block;width:384px;height:224px;cursor:crosshair}
.ovl{position:absolute;z-index:5;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Inspector ---------- */
#panel{top:6px;width:174px;border-radius:5px;padding:8px;font-size:10px}
.ph{display:flex;align-items:center;gap:7px;margin-bottom:7px;padding-bottom:7px;border-bottom:var(--rule)}
#pIcon{width:28px;height:28px;flex:none;border-radius:3px;background:#120e4d;border:var(--rule)}
.pt{flex:1;min-width:0;line-height:1.2}
.nm{font-weight:800;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3)}
.badge{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border:var(--rule);border-radius:3px;color:var(--ink)}
.x{width:20px;height:20px;border-radius:3px;color:var(--ink2);font-size:15px;line-height:1}
.x:hover{background:var(--ink);color:var(--paper)}
.prog{margin-bottom:7px}
.pl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:9px;color:var(--ink2)}
.pl b{font-family:var(--mono);color:var(--ink)}
.track{height:7px;border:var(--rule);border-radius:2px;background:var(--paper2);overflow:hidden}
.fill{height:100%;background:repeating-linear-gradient(-45deg,var(--plum) 0 4px,#5a52d6 4px 8px);transition:width .3s ease}
.sg{display:grid;grid-template-columns:repeat(4,1fr);border:var(--rule);border-radius:3px;margin-bottom:7px;background:var(--paper2)}
.sc{padding:4px 2px;text-align:center;line-height:1.25}
.sc+.sc{border-left:var(--rule)}
.sc span{display:block;font-size:7px;font-weight:700;letter-spacing:.9px;color:var(--ink3);text-transform:uppercase}
.sc b{font-family:var(--mono);font-size:10.5px;font-weight:700}
.muts{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px}
.chip{font-size:8.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--plum);color:var(--paper)}
.btn{width:100%;height:25px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.3px;border:var(--rule);background:var(--paper);box-shadow:var(--shadow-sm);transition:background .1s}
.btn:not(:disabled):hover{background:var(--paper3)}
.btn:not(:disabled):active{transform:translate(2px,2px);box-shadow:none}
.btn:disabled{color:var(--ink3);box-shadow:none;cursor:default;transform:translate(2px,2px);background:var(--paper2)}
.btn.up{background:var(--ink);color:var(--paper);margin-bottom:6px}
.btn.up:not(:disabled):hover{background:#2a2380}
.btn.up.mut{background:var(--moss)}
.btn.up:disabled{background:var(--paper2);color:var(--ink3)}
.btn.sell{color:var(--ember)}
.btn.sm{font-size:9px;font-weight:700}
.btn.on{background:var(--moss);color:var(--paper)}
.prow{display:flex;gap:6px}

/* ---------- Full-stage sheets: mutation, prestige, game over ---------- */
#mut,#pres,#over{inset:0;background:var(--paper);display:flex;flex-direction:column;padding:10px 11px;gap:7px}
#mut,#over{align-items:center;justify-content:center}
.mh{font-weight:900;font-size:12px;letter-spacing:3px;color:var(--plum)}
.msub{font-size:9px;color:var(--ink2)}
.mopts{display:flex;gap:7px;width:100%}
.mc{flex:1;min-height:104px;border-radius:5px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;transition:transform .1s}
.mc:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.mc:active{transform:translate(2px,2px);box-shadow:none}
.mc .i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--paper);background:var(--plum);border:var(--rule)}
.mc.eco .i{background:var(--ochre);color:var(--ink)}
.mc .t{font-weight:800;font-size:10px}.mc .d{font-size:8.5px;color:var(--ink2);line-height:1.3}
.mc .m{margin-top:auto;font-family:var(--mono);font-size:8.5px;font-weight:700;color:var(--moss)}
#mut .prow{width:100%}
.oh{font-weight:900;font-size:17px;letter-spacing:4px;color:var(--ember)}
#oTxt{text-align:center;color:var(--ink2);font-size:10.5px;line-height:1.6}
#oTxt b{color:var(--ink)}
#over .btn{width:160px}

/* ---------- Prestige ---------- */
.pr-head{display:flex;align-items:center;gap:9px;padding-bottom:7px;border-bottom:var(--rule)}
.emblem{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--paper2);border:var(--rule)}
.emblem svg{width:18px;height:18px;fill:var(--ink3)}
.emblem.ready{background:var(--ochre)}
.emblem.ready svg{fill:var(--ink)}
.pr-ttl{flex:1;min-width:0}
.pr-t{font-weight:900;font-size:12px;letter-spacing:4px}
.pr-s{display:flex;align-items:center;gap:5px;margin-top:2px;font-family:var(--mono);font-size:10px;font-weight:700}
.pr-star{color:var(--ink2)}.pr-star.to{color:var(--ember)}
.pr-arrow{color:var(--ink3)}
.pr-bonus{margin-left:3px;font-size:8.5px;color:var(--ink2);padding:0 5px;border:1px solid var(--ink3);border-radius:3px}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.rq{display:flex;align-items:center;gap:7px;padding:5px 7px;border:var(--rule);border-radius:4px;background:var(--paper2)}
.rq-i{width:22px;height:22px;flex:none;border-radius:3px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink2);background:var(--paper);border:var(--rule)}
.rq-b{flex:1;min-width:0}
.rq-l{font-size:7.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3)}
.rq-v{font-family:var(--mono);font-size:11px;font-weight:700;margin:1px 0 3px;white-space:nowrap}
.rq-v .n{color:var(--ink3)}
.rq-bar{height:5px;border:1px solid var(--ink);border-radius:2px;background:var(--paper);overflow:hidden}
.rq-bar i{display:block;height:100%;background:var(--ochre);transition:width .35s ease}
.rq.done{background:#e6e3ff}
.rq.done .rq-i{background:var(--moss);color:var(--paper)}
.rq.done .rq-bar i{background:var(--moss)}
.pr-foot{display:flex;gap:6px}
.pr-foot .btn.sm{flex:0 0 112px}
.btn.asc{background:var(--ochre);color:var(--ink)}
.btn.asc:not(:disabled):hover{background:#f5b53e}
.btn.asc:disabled{background:var(--paper2);color:var(--ink3)}

/* ---------- Dock ---------- */
#dock{flex:1;min-height:0;display:flex;align-items:center}
#bar{width:100%;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:3px 8px 5px 8px;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.tw{--rc:#8c8577;position:relative;flex:none;width:56px;height:60px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--paper);border:var(--rule);box-shadow:var(--shadow-sm);transition:transform .1s}
.tw:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.tw:active{transform:translate(2px,2px);box-shadow:none}
.tw.sel{background:var(--ink);color:var(--paper);transform:translate(2px,2px);box-shadow:none}
.tw.sel .n{color:var(--paper)}.tw.sel .c{color:var(--ochre)}
.tw.poor{opacity:.42}
.tw .tag{position:absolute;top:4px;left:4px;width:6px;height:6px;border-radius:1px;background:var(--rc);outline:1px solid var(--ink)}
.tw .k{position:absolute;top:2px;right:4px;font-family:var(--mono);font-size:8px;font-weight:700;color:var(--ink3)}
.tw canvas{width:28px;height:28px;border-radius:3px;background:#120e4d}
.tw .n{font-size:8.5px;font-weight:700;color:var(--ink);line-height:1;margin-top:2px}
.tw .c{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--ink2);line-height:1.15}
#tip{position:absolute;z-index:9;bottom:80px;width:188px;border-radius:5px;padding:7px 9px;pointer-events:none}
#tip .tn{font-weight:800;font-size:11px;display:flex;justify-content:space-between}
#tip .tn b{font-family:var(--mono)}
#tip .tr{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:1px 0 4px}
#tip .td{font-size:9.5px;color:var(--ink2);line-height:1.4}

/* ---------- Resize grip: sits on the corner opposite the anchored one ---------- */
#resize{position:absolute;z-index:12;width:14px;height:14px;color:var(--ink3);bottom:1px;right:1px;cursor:nwse-resize}
#resize:hover,#w.resizing #resize{color:var(--ember)}
#w.ax-r #resize{right:auto;left:1px;cursor:nesw-resize;transform:scaleX(-1)}
#w.ay-b #resize{bottom:auto;top:1px;transform:scaleY(-1);cursor:nesw-resize}
#w.ax-r.ay-b #resize{transform:scale(-1,-1);cursor:nwse-resize}
#w.ay-b:not(.ax-r) #top{padding-right:18px}
#w.ay-b.ax-r #top{padding-left:16px}
</style>
</head>
<body>
<div id="wrap">
<div id="w">
  <div id="top">
    <div id="grip" class="grip handle" title="Drag to move"><svg width="6" height="12" viewBox="0 0 6 12" fill="currentColor"><circle cx="1.2" cy="1.5" r="1.1"/><circle cx="4.8" cy="1.5" r="1.1"/><circle cx="1.2" cy="6" r="1.1"/><circle cx="4.8" cy="6" r="1.1"/><circle cx="1.2" cy="10.5" r="1.1"/><circle cx="4.8" cy="10.5" r="1.1"/></svg></div>
    <div class="stats handle" title="Drag to move">
      <span class="st st-w" title="Wave"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 6c2-2.5 4-2.5 6 0s4 2.5 6 0M2 11c2-2.5 4-2.5 6 0s4 2.5 6 0"/></svg><span id="sWave">0</span></span>
      <i class="sep"></i>
      <span class="st st-g" title="Gold · rolling 10s income per game-second"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor"/><circle cx="8" cy="8" r="4.2" fill="none" stroke="#7c4a03" stroke-width="1.2"/></svg><span id="sGold">0</span><span id="sRate" class="rate">+0/s</span></span>
      <i class="sep"></i>
      <span id="pLives" class="st st-l" title="Core lives"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M8 14.2 2.3 8.6a3.4 3.4 0 0 1 4.8-4.9L8 4.6l.9-.9a3.4 3.4 0 0 1 4.8 4.9z"/></svg><span id="sLives">0</span></span>
    </div>
    <button id="bWave" class="ib go" title="Start next wave (Space)"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M4.5 2.8v10.4L13 8z"/></svg></button>
    <div class="seg full">
      <button id="bSpeed" class="ib" title="Game speed">1x</button>
      <button id="bAuto" class="ib" title="Auto-wave"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6.5A5 5 0 0 0 4 4.3L2.5 6M3 9.5a5 5 0 0 0 9 2.2L13.5 10"/><path d="M2.5 2.8V6h3.2M13.5 13.2V10h-3.2"/></svg></button>
      <button id="bMute" class="ib" title="Sound"><svg class="main" viewBox="0 0 16 16"><path fill="currentColor" d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.7a6 6 0 0 1 0 8.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><svg class="alt" viewBox="0 0 16 16"><path fill="currentColor" d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="m10.5 6 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <button id="bPres" class="ib star" title="Prestige"><svg viewBox="0 0 16 16"><path fill="currentColor" d="m8 1.4 1.9 4.1 4.5.5-3.4 3 1 4.4L8 11.2l-4 2.2 1-4.4-3.4-3 4.5-.5z"/></svg></button>
    </div>
    <button id="bMin" class="ib" title="Minimize to pill / expand"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path id="bMinPath" d="m4 6 4 4 4-4"/></svg></button>
  </div>
  <div id="stage" class="full">
    <canvas id="cv"></canvas>
    <div id="panel" class="glass ovl hidden">
      <div class="ph"><canvas id="pIcon"></canvas><div class="pt"><div id="pName" class="nm"></div><div id="pRole" class="role"></div></div><span id="pTier" class="badge"></span><button id="pClose" class="x" title="Close">×</button></div>
      <div class="prog"><div class="pl"><span>Level <b id="pLv"></b></span><span id="pNext"></span></div><div class="track"><div id="pBar" class="fill"></div></div></div>
      <div class="sg">
        <div class="sc"><span id="pK1"></span><b id="pV1"></b></div>
        <div class="sc"><span id="pK2"></span><b id="pV2"></b></div>
        <div class="sc"><span id="pK3"></span><b id="pV3"></b></div>
        <div class="sc"><span>Earned</span><b id="pV4"></b></div>
      </div>
      <div id="pMuts" class="muts"></div>
      <button id="pUp" class="btn up"></button>
      <div class="prow"><button id="pSell" class="btn sell"></button><button id="pAuto" class="btn sm" title="Auto-pick mutations for idle play"></button></div>
    </div>
    <div id="mut" class="ovl hidden">
      <div class="mh">✦ MUTATION <span id="mTitle"></span></div>
      <div id="mSub" class="msub"></div>
      <div id="mOpts" class="mopts"></div>
      <div class="prow"><button id="mReroll" class="btn sm"></button><button id="mAuto" class="btn sm" title="Auto-pick mutations for idle play"></button></div>
    </div>
    <div id="pres" class="ovl hidden">
      <div class="pr-head">
        <div id="prEmblem" class="emblem"><svg viewBox="0 0 16 16"><path d="m8 1.4 1.9 4.1 4.5.5-3.4 3 1 4.4L8 11.2l-4 2.2 1-4.4-3.4-3 4.5-.5z"/></svg></div>
        <div class="pr-ttl">
          <div class="pr-t">PRESTIGE</div>
          <div class="pr-s"><span class="pr-star">★<span id="prFrom"></span></span><span class="pr-arrow">→</span><span class="pr-star to">★<span id="prTo"></span></span><span id="prBonus" class="pr-bonus"></span></div>
        </div>
        <button id="prClose" class="x" title="Close (Esc)">×</button>
      </div>
      <div id="prReqs" class="pr-grid"></div>
      <div class="pr-foot">
        <button id="prReroll" class="btn sm" title="Restart on a new map without earning stars"></button>
        <button id="prGo" class="btn asc"></button>
      </div>
    </div>
    <div id="over" class="ovl hidden">
      <div class="oh">CORE BREACHED</div>
      <div id="oTxt"></div>
      <button id="oNew" class="btn up">New Map</button>
    </div>
  </div>
  <div id="dock" class="full"><div id="bar"></div></div>
  <div id="tip" class="glass hidden"><div class="tn"><span id="tName"></span><b id="tCost"></b></div><div id="tRole" class="tr"></div><div id="tDesc" class="td"></div></div>
  <div id="resize" class="full" title="Drag to resize · double-click to reset"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M14 6 6 14M14 10l-4 4M14 14h0"/></svg></div>
</div>
</div>
<script>
'use strict';
// ================= Constants =================
const COLS = 12, ROWS = 7, TS = 32, W = COLS * TS, H = ROWS * TS;
const STEP = 1 / 60;
const SAVE_KEY = 'neonSiegeTD.v2';
const SAVE_KEY_V1 = 'neonSiegeTD.v1';
const START_LIVES = 20;
const RARITY = [
  { name:'Common', c:'#8783b6' }, { name:'Uncommon', c:'#3730aa' }, { name:'Rare', c:'#16115e' },
  { name:'Epic', c:'#ff9b7a' }, { name:'Legendary', c:'#ffc85c' }, { name:'Mythic', c:'#ff653f' },
];

const TOWERS = [
  { id:'bolt',   name:'Bolt Turret',      short:'Bolt',    cost:25,     kind:'proj',   dmg:5,     range:2.4, rate:2.5,  rarity:0, color:'#ffd37a', dark:'#8a5a12', role:'Single target', desc:'Fast-firing kinetic shots. Reliable single-target starter.' },

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmt(n){
  if (n < 10 && n > 0 && n % 1) return n.toFixed(1);
  n = Math.floor(n);
  if (n < 1000) return String(n);
  const u = ['k','M','B','T','Qa','Qi','Sx','Sp'];
  let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + u[i];
}
const RGB = {};
function rgba(hex, a){
  let c = RGB[hex];
  if (!c) { const n = parseInt(hex.slice(1), 16); c = RGB[hex] = `${n >> 16 & 255},${n >> 8 & 255},${n & 255}`; }
  return `rgba(${c},${a})`;
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let AC = null, master = null, noiseBuf = null;
const lastSfx = {};
function initAudio(){
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type, vol, f2, delay = 0){
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq){
  const t = AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = 'lowpass'; fl.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}

// ================= Map =================
let P; // { set, pts, cum, ang, len }
function genPath(seed){
  const r = mulberry32(seed), ri = (a, b) => a + Math.floor(r() * (b - a + 1));
  let y = ri(1, ROWS - 2);
  const tiles = [[0, y]];
  for (let x = 0; x < COLS - 1; x++) {
    if (x % 2 === 1) {
      let ty; do { ty = ri(0, ROWS - 1); } while (Math.abs(ty - y) < 2);
      const d = Math.sign(ty - y);
      while (y !== ty) { y += d; tiles.push([x, y]); }
    }
    tiles.push([x + 1, y]);
  }
  return tiles;
}
function setMap(seed){
  const tiles = genPath(seed);
  const pts = tiles.map(([x, y]) => [x + .5, y + .5]);
  const cum = [0], ang = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1];
    cum.push(cum[i] + Math.hypot(dx, dy)); ang.push(Math.atan2(dy, dx));
  }
  P = { set: new Set(tiles.map(([x, y]) => x + ',' + y)), pts, cum, ang, len: cum[cum.length - 1] };
  renderBackground();
}
function posAt(d){
  const { pts, cum, ang } = P;
  if (d <= 0) return [pts[0][0], pts[0][1], ang[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    if (d <= cum[i + 1]) {
      const k = (d - cum[i]) / (cum[i + 1] - cum[i]);
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k, ang[i]];
    }
  }
  const l = pts[pts.length - 1];
  return [l[0], l[1], ang[ang.length - 1]];
}
const isPath = (x, y) => P.set.has(x + ',' + y);
const towerAt = (x, y) => S.towers.find(t => t.x === x && t.y === y);

function migrateV1(d){
  const ids = ['bolt','frost','flak','tesla','venom','rail','prism','hell','chrono','sing'];
  return { ...d, towers: d.towers.map(t => ({ id:ids[t.type], x:t.x, y:t.y, lv:t.lv, kills:t.kills, earned:0, muts:t.muts, invested:t.invested })) };

function load(){
  let raw = localStorage.getItem(SAVE_KEY);
  const old = localStorage.getItem(SAVE_KEY_V1);
  if (!raw && old) raw = JSON.stringify(migrateV1(JSON.parse(old)));
  if (old) localStorage.removeItem(SAVE_KEY_V1);
  if (!raw) { S = freshRun({ prestige:0, catalysts:0, best:0, speed:1, auto:false, autoMut:false, muted:false }); setMap(S.seed); return; }
  const d = JSON.parse(raw);
  // Saves from before prestige requirements have no run-progress counters; the run starts counting now.
  if (d.bossKills === undefined) { d.bossKills = 0; d.runEarned = 0; }
  S = makeState(d);
  ui.min = d.min;
  // Saves from before move/resize keep the default bottom-right placement at 100%.
  if (d.scale !== undefined) { ui.scale = d.scale; ui.ax = d.place.ax; ui.ay = d.place.ay; ui.pos = { dx:d.place.dx, dy:d.place.dy }; }
  setMap(S.seed);
  // A reload during a pending mutation choice resolves it automatically.
  for (const t of S.towers) while (t.muts.length < Math.floor(t.lv / 5)) t.muts.push(mutOptions(t)[0]);
}

// ================= Stats =================
function cnt(t, k){ let n = 0; for (const m of t.muts) if (m === k) n++; return n; }
const isMint = t => TOWERS[t.type].kind === 'mint';
function stats(t){
  const d = TOWERS[t.type], pm = 1 + 0.1 * S.prestige;
  const dmg = (d.dmg || 0) * Math.pow(1.2, t.lv - 1) * Math.pow(1.5, t.muts.length) * pm;
  const range = d.kind === 'rail' ? 99 : d.range * Math.min(1.6, 1 + .03 * (t.lv - 1)) * (1 + .25 * cnt(t, 'range'));
  const rate = d.rate * (1 + .04 * (t.lv - 1)) * (1 + .4 * cnt(t, 'overclock')) * t.buff;
  return { dmg, range, rate };
}
function mintStats(t){
  const d = TOWERS[t.type], g = Math.pow(1.22, t.lv - 1) * Math.pow(1.5, t.muts.length) * (1 + .1 * S.prestige);
  return { gps: d.gps * g * (1 + .65 * cnt(t, 'quantum')) * t.buff, bonus: d.bonus * g, range: d.range * Math.min(1.6, 1 + .03 * (t.lv - 1)) };
}
function dpsOf(t, s){
  const d = TOWERS[t.type];
  switch (d.kind) {
    case 'chain': { let m = 0, f = 1; for (let j = 0; j <= d.jumps + Math.floor(t.lv / 10); j++) { m += f; f *= .8; } return s.dmg * s.rate * m; }
    case 'rail': return s.dmg * s.rate * (1 + d.crit * (d.critMul - 1));
    case 'mortar': return 3 * s.dmg * s.rate;
    case 'hole': return 2 * s.dmg * s.rate;
    default: return s.dmg * s.rate;
  }
}
const upCost = t => Math.ceil(TOWERS[t.type].cost * .5 * Math.pow(1.38, t.lv - 1));
const sellValue = t => Math.floor(t.invested * .7);
const incomeRate = () => S.inc.reduce((a, b) => a + b, 0) / 10;

// ================= Waves =================
function buildWave(w){
  const pool = ['grunt'];
  if (w >= 3) pool.push('runner');
  if (w >= 5) pool.push('brute');
  if (w >= 7) pool.push('swarm');
  if (w >= 12) pool.push('shielded');
  const q = [];
  let budget = Math.min(45, 6 + Math.floor(w * .7));
  while (budget > 0) {
    const ty = pool[Math.floor(Math.random() * pool.length)];
    if (ty === 'swarm') { for (let i = 0; i < 5; i++) q.push({ ty, gap: i ? .14 : .6 }); budget -= 2; }
    else { q.push({ ty, gap: ty === 'runner' ? .4 : ty === 'brute' ? 1 : .65 }); budget -= 1; }
  }
  if (w % 10 === 0) for (let i = 0, n = 1 + Math.floor(w / 50); i < n; i++) q.push({ ty:'boss', gap: i ? 1.5 : 1.8 });
  return q;
}
function startWave(){
  if (S.waveActive || S.over) return;
  S.wave++;
  S.q = buildWave(S.wave);
  S.spawnT = .3;
  S.waveActive = true;
  S.banner = { s: `WAVE ${S.wave}${S.wave % 10 === 0 ? ' — BOSS' : ''}`, c: S.wave % 10 === 0 ? '#ff653f' : '#ffc85c', t: 2 };
  sfx('wave');
}
function endWave(){
  S.waveActive = false;
  const clear = goldScale(S.wave) * 5 * (1 + .1 * S.prestige);
  earn(clear);
  let interest = 0, payouts = 0;
  for (const t of S.towers) {
    if (!isMint(t)) continue;
    const b = mintStats(t).bonus;
    earn(b); t.earned += b; payouts += b;
    addText(t.x + .5, t.y + .1, '+$' + fmt(b), '#ffc85c', true);
    interest += .04 * cnt(t, 'compound');
  }
  if (interest > 0) {
    const g = S.gold * Math.min(.2, interest);
    earn(g);
    addText(P.pts[P.pts.length - 1][0], P.pts[P.pts.length - 1][1] - .6, `+$${fmt(g)} interest`, '#ffc85c', true);
  }
  if (payouts) sfx('payout');
  S.best = Math.max(S.best, S.wave);
  S.banner = { s: `WAVE ${S.wave} CLEAR  +$${fmt(clear + payouts)}`, c: '#7fd18b', t: 1.8 };
  S.autoT = 1.5;
  sfx('clear');
  save();
}
function spawnEnemy(ty){
  const d = ENEMIES[ty], w = S.wave, hp = hpScale(w) * d.hp, sh = d.shield ? hp * d.shield : 0;
  const e = {
    type:ty, hp, maxHp:hp, shield:sh, maxShield:sh, armor:d.armor, spd:d.spd * (1 + Math.min(w, 100) * .003),
    dist:0, x:0, y:0, ang:0, off:(Math.random() - .5) * (ty === 'swarm' ? .32 : .14),
    slowAmt:0, slowT:0, pStacks:0, pDps:0, pT:0, pSrc:null, shred:0, siphon:0, lastHit:-9,
    dmgAcc:0, dmgT:0, gold:goldScale(w) * d.gold, boss:!!d.boss, dead:false,
  };
  setPos(e);
  S.enemies.push(e);
}
function setPos(e){
  const [x, y, a] = posAt(e.dist);
  e.x = x - Math.sin(a) * e.off; e.y = y + Math.cos(a) * e.off; e.ang = a;
}

// ================= Economy & feedback =================
function earn(g){ S.gold += g; S.runEarned += g; S.inc[S.incI] += g; }
function addFx(f){ if (S.fx.length < 260) S.fx.push(f); }
function addText(x, y, s, c, big){
  if (!big && S.fx.length > 150) return;
  S.fx.push({ k:'text', x, y, s, c, big:!!big, t:big ? 1.2 : .8, life:big ? 1.2 : .8 });
}
function burst(x, y, c, n, spd){
  for (let i = 0; i < n && S.parts.length < 320; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (.4 + Math.random() * .8);
    S.parts.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, c, s:1 + Math.random() * 1.6, t:.5 + Math.random() * .3, life:.8 });
  }
}
function shake(m){ ui.shake = Math.max(ui.shake, m); }

// ================= Combat =================
function hit(e, amt, src, proc){
  if (e.dead) return;
  let d = amt * (1 - Math.max(-.5, e.armor - e.shred));
  e.lastHit = S.time;
  e.dmgAcc += d;
  if (e.shield > 0) { const a = Math.min(e.shield, d); e.shield -= a; d -= a; }
  e.hp -= d;
  if (src) {
    const sg = .2 * cnt(src, 'siphon');
    if (sg > e.siphon) e.siphon = sg;
    const ex = cnt(src, 'execute');
    if (ex && e.hp > 0 && e.hp < e.maxHp * Math.min(.3, .1 + .05 * ex)) { e.hp = 0; addText(e.x, e.y - .3, 'EXECUTE', '#ff653f', true); }
    if (proc) { const sw = cnt(src, 'shockwave'); if (sw && Math.random() < Math.min(.6, .2 * sw)) shockwave(e, amt, src); }
  }
  if (e.hp <= 0) kill(e, src);
}
function shockwave(e, amt, src){
  addFx({ k:'ring', x:e.x, y:e.y, r:1, c:'#8f86ff', t:.35, life:.35, w:2 });
  for (const o of S.enemies) if (!o.dead && dist2(o.x, o.y, e.x, e.y) <= 1) hit(o, amt, src, false);
}
function kill(e, src){
  e.dead = true;
  const ed = ENEMIES[e.type];
  const g = e.gold * (1 + e.siphon) * (1 + .1 * S.prestige) * (1 + (src ? src.midas : 0));
  earn(g);
  if (src) { src.kills++; src.earned += g; }
  for (const m of S.towers) {
    const k = isMint(m) ? cnt(m, 'bounty') : 0;
    if (!k) continue;
    const r = mintStats(m).range;
    if (dist2(e.x, e.y, m.x + .5, m.y + .5) > r * r) continue;
    const b = e.gold * .5 * k;
    earn(b); m.earned += b;
    addFx({ k:'line', x1:e.x, y1:e.y, x2:m.x + .5, y2:m.y + .5, c:'#ffc85c', w:1.5, t:.3, life:.3 });
  }
  addText(e.x, e.y - .15, '+$' + fmt(g), '#ffc85c', e.boss);
  addFx({ k:'ring', x:e.x, y:e.y, r:ed.size * 2.6, c:ed.color, t:.3, life:.3 });
  burst(e.x, e.y, ed.color, e.boss ? 36 : 8, e.boss ? 3.5 : 2.2);
  if (e.boss) {
    const c = 1 + Math.floor(S.wave / 30);
    S.catalysts += c;
    S.bossKills++;
    addText(e.x, e.y - .55, `+${c} ◆ CATALYST`, '#b08ac4', true);
    burst(e.x, e.y, '#ffc85c', 20, 3);
    shake(6);
    sfx('boss');
  } else sfx('kill');
}
function slow(e, amt, time){
  if (e.boss) amt *= .5;
  if (amt >= e.slowAmt || e.slowT <= 0) e.slowAmt = amt;
  e.slowT = Math.max(e.slowT, time);
}
function poison(e, dmg, src){
  e.pStacks = Math.min(10, e.pStacks + 1);
  e.pDps = Math.max(e.pDps, dmg * .5);
  e.pT = 4; e.pSrc = src;
  e.shred = e.pStacks * .05;
}
function explode(x, y, r, dmg, src, c, sh){
  addFx({ k:'ring', x, y, r, c, t:.3, life:.3, fill:true });
  burst(x, y, c, 6, 2);
  shake(sh);
  for (const e of S.enemies) if (!e.dead && dist2(e.x, e.y, x, y) <= r * r) hit(e, dmg, src, true);
  sfx('boom');
}
function inRange(t, r){
  const cx = t.x + .5, cy = t.y + .5, r2 = r * r;
  return S.enemies.filter(e => !e.dead && dist2(e.x, e.y, cx, cy) <= r2);
}
function pick(t, r, n, byHp){
  const l = inRange(t, r);
  l.sort(byHp ? (a, b) => (b.hp + b.shield) - (a.hp + a.shield) : (a, b) => b.dist - a.dist);
  return l.slice(0, n);
}
function chain(t, first, dmg, jumps){
  const pts = [[t.x + .5, t.y + .5]], done = new Set();
  let e = first;
  for (let j = 0; j <= jumps && e; j++) {
    pts.push([e.x, e.y]); done.add(e);
    hit(e, dmg, t, true);
    dmg *= .8;
    let best = null, bd = 1.6 * 1.6;
    for (const o of S.enemies) {
      if (o.dead || done.has(o)) continue;
      const dd = dist2(o.x, o.y, e.x, e.y);
      if (dd < bd) { bd = dd; best = o; }
    }
    e = best;
  }
  addFx({ k:'zap', pts, c:'#9d8ad6', t:.18, life:.18 });
}

function updMint(t, dt){
  t.cd -= dt;
  if (t.cd > 0) return;
  t.cd += 1;
  const g = mintStats(t).gps;
  earn(g); t.earned += g;
  addText(t.x + .5, t.y + .2, '+$' + fmt(g), '#ffe2a0');
  burst(t.x + .5, t.y + .5, '#ffc85c', 3, .8);
  t.recoil = 1;
  sfx('coin');
}
function updTower(t, dt){
  const d = TOWERS[t.type];
  t.recoil = Math.max(0, t.recoil - dt * 5);
  if (d.kind === 'mint') { updMint(t, dt); return; }
  const s = stats(t), cx = t.x + .5, cy = t.y + .5;
  if (d.kind === 'beam') {
    let e = t.target;
    if (!e || e.dead || dist2(e.x, e.y, cx, cy) > s.range * s.range) {
      e = pick(t, s.range, 1)[0] || null;
      t.target = e; t.lock = 0;
      if (e) sfx('prism');
    }
    if (e) {
      t.lock += dt;
      t.ang = Math.atan2(e.y - cy, e.x - cx);
      hit(e, s.dmg * s.rate * Math.min(64, Math.pow(2, t.lock)) * dt, t, false);
    }
    return;
  }
  t.cd -= dt;
  if (t.cd > 0) return;
  const n = 1 + 2 * cnt(t, 'split');
  let ts = [];
  switch (d.kind) {
    case 'proj': case 'shell':
      ts = pick(t, s.range, n);
      ts.forEach((e, i) => S.projs.push({ kind:d.id, x:cx, y:cy, tx:e.x, ty:e.y, e, dmg:i ? s.dmg * .5 : s.dmg, src:t, spd:d.kind === 'shell' ? 7 : 11, splash:d.splash, c:d.color }));
      break;
    case 'pulse':
      ts = inRange(t, s.range);
      if (ts.length) {
        for (const e of ts) { hit(e, s.dmg, t, true); if (!e.dead) slow(e, d.slow, d.slowT); }
        addFx({ k:'ring', x:cx, y:cy, r:s.range, c:d.color, t:.45, life:.45, w:2, fill:true });
      }
      break;
    case 'chain':
      ts = pick(t, s.range, n);
      ts.forEach((e, i) => chain(t, e, i ? s.dmg * .5 : s.dmg, d.jumps + Math.floor(t.lv / 10)));
      break;
    case 'rail':
      ts = pick(t, s.range, n, true);
      ts.forEach((e, i) => {
        const crit = Math.random() < d.crit, a = Math.atan2(e.y - cy, e.x - cx);
        addFx({ k:'line', x1:cx, y1:cy, x2:e.x + Math.cos(a) * .6, y2:e.y + Math.sin(a) * .6, c:crit ? '#ffffff' : d.color, w:crit ? 4 : 2.5, t:.25, life:.25 });
        burst(e.x, e.y, '#c7dbe6', crit ? 10 : 4, 2.5);
        if (crit) { addText(e.x, e.y - .45, 'CRIT!', '#a9cbe0', true); shake(2); }
        hit(e, (i ? .5 : 1) * s.dmg * (crit ? d.critMul : 1), t, true);
      });
      break;
    case 'mortar':
      ts = pick(t, s.range, n);
      ts.forEach((e, i) => {
        for (let k = 0; k < 3; k++) S.projs.push({ kind:'hell', sx:cx, sy:cy, x:cx, y:cy, h:0, tx:e.x + (Math.random() - .5) * .7, ty:e.y + (Math.random() - .5) * .7, t:0, T:.7 + k * .08, dmg:i ? s.dmg * .5 : s.dmg, src:t, splash:d.splash });
      });
      break;
    case 'hole':
      ts = pick(t, s.range, 1);
      if (ts.length) { S.hazards.push({ k:'hole', x:ts[0].x, y:ts[0].y, r:1.1, dps:s.dmg, t:2, life:2, src:t }); shake(2.5); }
      break;
  }
  if (ts.length) {
    t.cd = 1 / s.rate;
    t.ang = Math.atan2(ts[0].y - cy, ts[0].x - cx);
    t.recoil = 1;
    sfx(d.id);
  }
}
function updEnemy(e, dt){
  if (e.dead) return;
  if (e.slowT > 0) e.slowT -= dt; else e.slowAmt = 0;
  if (e.pT > 0) {
    e.pT -= dt;
    hit(e, e.pStacks * e.pDps * dt, e.pSrc, false);
    if (e.pT <= 0) { e.pStacks = 0; e.pDps = 0; e.shred = 0; }
    if (e.dead) return;
  }
  e.dmgT -= dt;
  if (e.dmgT <= 0 && e.dmgAcc > 0) { addText(e.x + (Math.random() - .5) * .3, e.y - ENEMIES[e.type].size - .1, fmt(e.dmgAcc), '#ece4d0'); e.dmgAcc = 0; e.dmgT = .45; }
  if (e.maxShield > 0 && S.time - e.lastHit > 1.5) e.shield = Math.min(e.maxShield, e.shield + e.maxShield * .25 * dt);
  e.dist += e.spd * (1 - e.slowAmt) * dt;
  if (e.dist >= P.len) {
    e.dead = true;
    S.lives -= e.boss ? 5 : 1;
    S.coreFlash = .4;
    shake(e.boss ? 6 : 3);
    const pl = $('pLives'); pl.classList.remove('hurt'); void pl.offsetWidth; pl.classList.add('hurt');
    sfx('leak');
    if (S.lives <= 0) gameOver();
    return;
  }
  setPos(e);
}
function updProjs(dt){
  for (const p of S.projs) {
    if (p.kind === 'hell') {
      p.t += dt;
      const k = Math.min(1, p.t / p.T);
      p.x = p.sx + (p.tx - p.sx) * k; p.y = p.sy + (p.ty - p.sy) * k; p.h = Math.sin(k * Math.PI) * .8;
      if (k >= 1) {
        p.done = true;
        explode(p.tx, p.ty, p.splash, p.dmg, p.src, '#e8412b', 1.5);
        S.hazards.push({ k:'lava', x:p.tx, y:p.ty, r:.45, dps:p.dmg * .35, t:3, life:3, src:p.src });
        if (S.hazards.length > 60) S.hazards.shift();
      }
      continue;
    }
    if (!p.e.dead) { p.tx = p.e.x; p.ty = p.e.y; }
    else if (p.kind !== 'flak') { p.done = true; continue; }
    const dx = p.tx - p.x, dy = p.ty - p.y, dd = Math.hypot(dx, dy), step = p.spd * dt;
    if (dd > step) { p.x += dx / dd * step; p.y += dy / dd * step; continue; }
    p.done = true;
    if (p.kind === 'flak') explode(p.tx, p.ty, p.splash, p.dmg, p.src, '#e2552d', .8);
    else {
      hit(p.e, p.dmg, p.src, true);
      burst(p.tx, p.ty, p.c, 2, 1.2);
      if (p.kind === 'venom' && !p.e.dead) poison(p.e, p.dmg, p.src);
    }
  }
}
function updHazards(dt){
  for (const h of S.hazards) {
    h.t -= dt;
    for (const e of S.enemies) {
      if (e.dead || dist2(e.x, e.y, h.x, h.y) > h.r * h.r) continue;
      if (h.k === 'hole') { e.dist = Math.max(0, e.dist - (e.boss ? .8 : 1.6) * dt); setPos(e); }
      hit(e, h.dps * dt, h.src, false);
    }
  }
}
function applyBuffs(){
  for (const t of S.towers) { t.buff = 1; t.midas = 0; }
  for (const c of S.towers) {
    if (TOWERS[c.type].buff) {
      const b = 1.3 + .02 * (c.lv - 1);
      for (const t of S.towers) if (t !== c && Math.abs(t.x - c.x) <= 1 && Math.abs(t.y - c.y) <= 1) t.buff = Math.max(t.buff, b);
    }
    const mk = isMint(c) ? cnt(c, 'midas') : 0;
    if (mk) {
      const r = mintStats(c).range;
      for (const t of S.towers) if (!isMint(t) && dist2(t.x, t.y, c.x, c.y) <= r * r) t.midas = Math.max(t.midas, .4 * mk);
    }
  }
}
function update(dt){
  S.time += dt;
  S.incT += dt;
  if (S.incT >= 1) { S.incT -= 1; S.incI = (S.incI + 1) % S.inc.length; S.inc[S.incI] = 0; }
  if (S.waveActive && S.q.length) {
    S.spawnT -= dt;
    if (S.spawnT <= 0) { const it = S.q.shift(); spawnEnemy(it.ty); S.spawnT = S.q.length ? S.q[0].gap : 0; }
  }
  if (!S.waveActive && S.auto) { S.autoT -= dt; if (S.autoT <= 0) startWave(); }
  applyBuffs();
  for (const e of S.enemies) updEnemy(e, dt);
  for (const t of S.towers) updTower(t, dt);
  updProjs(dt);
  updHazards(dt);
  for (const f of S.fx) f.t -= dt;
  for (const p of S.parts) { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .93; p.vy *= .93; }
  S.fx = S.fx.filter(f => f.t > 0);
  S.parts = S.parts.filter(p => p.t > 0);
  S.enemies = S.enemies.filter(e => !e.dead);
  S.projs = S.projs.filter(p => !p.done);
  S.hazards = S.hazards.filter(h => h.t > 0);
  if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
  if (S.coreFlash > 0) S.coreFlash -= dt;
  if (S.waveActive && !S.over && !S.q.length && !S.enemies.length) endWave();
}
function gameOver(){
  S.over = true;
  S.best = Math.max(S.best, S.wave);
  closePanel();
  $('mut').classList.add('hidden');
  const ready = prestigeReady();
  $('oTxt').innerHTML = `Reached wave <b>${S.wave}</b> · Best <b>${S.best}</b><br>` + (ready
    ? `Prestige ready: <b style="color:#ffe2a0">+${prestigeReward()} ★</b>`
    : `<span style="color:#8c8577">Prestige requirements not met: no ★ this run</span>`);
  setText($('oNew'), ready ? `★ Ascend · +${prestigeReward()} ★` : 'New Map');
  $('oNew').classList.toggle('asc', ready);
  $('over').classList.remove('hidden');
  save();
}

// ================= Prestige =================
const clearedWaves = () => S.waveActive ? S.wave - 1 : S.wave;
function prestigeReqs(){
  const p = S.prestige;
  return [
    { icon:'≋', label:'Reach wave',    have:clearedWaves(), need:10 + 5 * p },
    { icon:'☠', label:'Bosses slain',  have:S.bossKills, need:1 + Math.floor(p / 2) },
    { icon:'✦', label:'Mutation tier', have:Math.max(0, ...S.towers.map(t => t.muts.length)), need:1 + Math.floor(p / 3) },
    { icon:'$', label:'Gold earned',   have:S.runEarned, need:1500 * Math.pow(2, p) },
  ];
}
const prestigeReady = () => prestigeReqs().every(r => r.have >= r.need);
const prestigeReward = () => Math.max(1, Math.floor(clearedWaves() / 10));
function ascend(){
  if (!prestigeReady()) throw new Error('Ascend called with prestige requirements unmet');
  newMap(prestigeReward());
}

// ================= Player actions =================
function place(type, x, y){
  const d = TOWERS[type];
  if (S.gold < d.cost) { sfx('err'); return; }
  S.gold -= d.cost;
  S.towers.push(makeTower(type, x, y));
  addFx({ k:'ring', x:x + .5, y:y + .5, r:.9, c:d.color, t:.4, life:.4, w:2 });
  burst(x + .5, y + .5, d.color, 10, 2);
  sfx('place');
  if (S.gold < d.cost) ui.build = null;
  save();
}
function upgrade(t){
  const c = upCost(t);
  if (S.gold < c) { sfx('err'); return; }
  S.gold -= c; t.invested += c; t.lv++;
  addFx({ k:'ring', x:t.x + .5, y:t.y + .5, r:.7, c:'#ffc85c', t:.3, life:.3, w:1.5 });
  sfx('up');
  if (t.lv % 5 === 0) {
    if (S.autoMut) applyMut(t, mutOptions(t)[0]);
    else openMut(t);
  }
  save();
}
function sell(t){
  S.gold += sellValue(t);
  burst(t.x + .5, t.y + .5, '#ffc85c', 12, 2);
  S.towers.splice(S.towers.indexOf(t), 1);
  sfx('sell');
  closePanel();
  save();
}
function mutOptions(t){ return shuffle(TRAIT_POOL[TOWERS[t.type].kind].slice()).slice(0, 3); }
function applyMut(t, k){
  t.muts.push(k);
  const tier = t.muts.length, c = isMint(t) ? '#ffc85c' : TIER_COL[Math.min(tier, 5)];
  addFx({ k:'ring', x:t.x + .5, y:t.y + .5, r:1.5, c, t:.7, life:.7, w:3 });
  burst(t.x + .5, t.y + .5, c, 24, 3);
  S.banner = { s: `${TOWERS[t.type].short} ✦${tier}: ${TRAITS[k].name}`, c:'#8f86ff', t:1.8 };
  sfx('mut');
  save();
}
function newMap(earned){
  S = freshRun({ prestige:S.prestige + earned, catalysts:S.catalysts, best:Math.max(S.best, S.wave), speed:S.speed, auto:S.auto, autoMut:S.autoMut, muted:S.muted });
  setMap(S.seed);
  closePanel();
  $('mut').classList.add('hidden');
  $('over').classList.add('hidden');
  closePrestige();
  ui.build = null;
  if (earned) { burst(W / TS / 2, H / TS / 2, '#ffe2a0', 60, 5); shake(5); sfx('mut'); }
  S.banner = { s: earned ? `ASCENDED · ★${S.prestige}  (+${S.prestige * 10}% dmg & gold)` : 'NEW MAP', c:'#ffe2a0', t:2.4 };
  save();
}

// ================= Rendering =================
const cv = $('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(3, window.devicePixelRatio || 1);
let RS = DPR; // device pixels per CSS pixel of game art: DPR × widget zoom
const bg = document.createElement('canvas');
const bctx = bg.getContext('2d');
function sizeCanvases(){
  cv.width = W * RS; cv.height = H * RS;
  bg.width = W * RS; bg.height = H * RS;
  bctx.setTransform(RS, 0, 0, RS, 0, 0);
}
sizeCanvases();

function circle(c, x, y, r, f){ c.fillStyle = f; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function poly(c, n, r, rot){ c.beginPath(); for (let i = 0; i < n; i++) { const a = rot + i / n * Math.PI * 2; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); }
function glow(c, x, y, r, col, a){
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
}
function lin(c, x0, y0, x1, y1, a, b){ const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }

function renderBackground(){
  const c = bctx;
  c.fillStyle = '#120e4d'; c.fillRect(0, 0, W, H);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const px = x * TS, py = y * TS;
    if (isPath(x, y)) continue;
    // recessed build plot: darker well with a lit bottom lip
    rr(c, px + 2, py + 2, TS - 4, TS - 4, 3);
    c.fillStyle = lin(c, 0, py, 0, py + TS, '#0f0b40', '#1b1666'); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = 1; c.stroke();
    c.beginPath(); c.moveTo(px + 5, py + TS - 2.5); c.lineTo(px + TS - 5, py + TS - 2.5);
    c.strokeStyle = 'rgba(255,244,220,.06)'; c.stroke();
  }
  // packed-earth trail with a worn centre
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath(); P.pts.forEach(([x, y], i) => i ? c.lineTo(x * TS, y * TS) : c.moveTo(x * TS, y * TS));
  c.strokeStyle = '#0b0838'; c.lineWidth = 26; c.stroke();
  c.strokeStyle = '#2b2590'; c.lineWidth = 22; c.stroke();
  c.strokeStyle = '#3730aa'; c.lineWidth = 14; c.stroke();
  // speckle texture on the trail
  const r = mulberry32(S.seed);
  for (let i = 0; i < 260; i++) {
    const [x, y] = posAt(r() * P.len);
    circle(c, (x + (r() - .5) * .6) * TS, (y + (r() - .5) * .6) * TS, .6 + r() * .8, r() < .5 ? 'rgba(11,8,56,.35)' : 'rgba(255,244,220,.07)');
  }
}

function drawTower(c, type, px, py, s, ang, tier, now, recoil){
  const d = TOWERS[type], col = d.color, dk = d.dark, tc = TIER_COL[Math.min(tier, 5)], r = s / 2, nb = 1 + Math.min(tier, 3);
  const mint = d.kind === 'mint', ringCol = mint ? '#ffc85c' : tc, k = recoil * r * .22;
  if (tier > 0) glow(c, px, py, r * (1.2 + .12 * Math.sin(now * 3 + px * .1) + tier * .04), ringCol, .45);

    }
    case 'tesla': {

      c.strokeStyle = '#ebe6f7'; c.lineWidth = 1;
      for (let i = 0; i < nb + 1; i++) {

        for (let j = 1; j <= 3; j++) { const q = .2 + j * .12, aa = a + (Math.random() - .5) * .5; c.lineTo(Math.cos(aa) * r * q, Math.sin(aa) * r * q); }

        c.fillStyle = '#34481c'; c.fillRect(r * .1 - k, o - r * .09, r * .52, r * .18);

function drawEnemy(e, now){
  const d = ENEMIES[e.type], px = e.x * TS, py = e.y * TS, s = d.size * TS;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(px, py + s * .75, s * .9, s * .35, 0, 0, 7); ctx.fill();
  if (e.boss) glow(ctx, px, py, s * 2, '#c8412b', .4 + .15 * Math.sin(now * 5));
  if (e.type === 'runner') { ctx.strokeStyle = rgba(d.color, .3); ctx.lineWidth = s; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - Math.cos(e.ang) * s * 2.5, py - Math.sin(e.ang) * s * 2.5); ctx.stroke(); }
  const g = ctx.createRadialGradient(px - s * .35, py - s * .4, 0, px, py, s * 1.3);
  g.addColorStop(0, d.light); g.addColorStop(.55, d.color); g.addColorStop(1, rgba(d.color, .7));
  ctx.save(); ctx.translate(px, py);
  ctx.beginPath();
  if (d.shape === 'circle') ctx.arc(0, 0, s, 0, 7);
  else if (d.shape === 'tri') { for (let i = 0; i < 3; i++) { const b = e.ang + i * Math.PI * 2 / 3, k = i ? 1 : 1.4; ctx.lineTo(Math.cos(b) * s * k, Math.sin(b) * s * k); } ctx.closePath(); }
  else if (d.shape === 'square') { ctx.rotate(e.ang); rr(ctx, -s, -s, s * 2, s * 2, s * .3); }
  else { for (let i = 0; i < 12; i++) { const b = i / 12 * Math.PI * 2 + now * .8, rad = i % 2 ? s * .78 : s * 1.08; ctx.lineTo(Math.cos(b) * rad, Math.sin(b) * rad); } ctx.closePath(); }
  ctx.translate(-px, -py);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
  if (d.shape === 'square') { ctx.save(); ctx.translate(px, py); ctx.rotate(e.ang); rr(ctx, -s * .55, -s * .55, s * 1.1, s * 1.1, s * .15); ctx.fillStyle = 'rgba(30,10,50,.45)'; ctx.fill(); ctx.restore(); }
  // eye / core facing the direction of travel
  const ex = px + Math.cos(e.ang) * s * .35, ey = py + Math.sin(e.ang) * s * .35;
  circle(ctx, ex, ey, Math.max(1.2, s * .28), 'rgba(10,6,16,.85)');
  circle(ctx, ex, ey, Math.max(.6, s * .12), e.boss ? '#ffc85c' : '#fff');
  if (e.slowT > 0) { ctx.strokeStyle = 'rgba(140,199,204,.85)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(px, py, s + 1.8, 0, 7); ctx.stroke(); }
  if (e.pT > 0) for (let i = 0; i < Math.min(3, e.pStacks); i++) circle(ctx, px + Math.cos(now * 3 + i * 2.1) * (s + 2), py + Math.sin(now * 3 + i * 2.1) * (s + 2), 1.3, '#7fd18b');
  if (e.shield > 0) {
    ctx.save(); ctx.translate(px, py); poly(ctx, 6, s + 3.5, now);
    ctx.strokeStyle = `rgba(140,199,192,${.25 + .7 * e.shield / e.maxShield})`; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = `rgba(140,199,192,${.08 * e.shield / e.maxShield})`; ctx.fill(); ctx.restore();
  }
  if (e.hp < e.maxHp || e.boss || e.shield < e.maxShield) {
    const bw = Math.max(14, s * 2.4), bx = px - bw / 2, by = py - s - 7;
    rr(ctx, bx - 1, by - 1, bw + 2, 4, 2); ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fill();
    const f = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = f > .5 ? '#7fd18b' : f > .25 ? '#ffc85c' : '#ff653f'; ctx.fillRect(bx, by, bw * f, 2);
    if (e.maxShield > 0) { ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(bx - 1, by - 4, bw + 2, 3); ctx.fillStyle = '#8cc7c0'; ctx.fillRect(bx, by - 3.5, bw * e.shield / e.maxShield, 1.5); }
  }
}

function drawRange(x, y, r, col){
  ctx.beginPath(); ctx.arc(x * TS, y * TS, r * TS, 0, 7);
  ctx.fillStyle = rgba(col, .07); ctx.fill();
  ctx.setLineDash([4, 4]); ctx.lineDashOffset = -performance.now() / 60;
  ctx.strokeStyle = rgba(col, .6); ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
}

function drawDynamicMap(now){
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // animated energy flow along the path
  ctx.beginPath(); P.pts.forEach(([x, y], i) => i ? ctx.lineTo(x * TS, y * TS) : ctx.moveTo(x * TS, y * TS));
  ctx.setLineDash([3, 9]); ctx.lineDashOffset = -now * 22;
  ctx.strokeStyle = 'rgba(140,199,204,.45)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.setLineDash([]);
  for (let k = 0, n = Math.ceil(P.len / 3); k < n; k++) {
    const [x, y] = posAt((now * 1.4 + k * 3) % P.len);
    glow(ctx, x * TS, y * TS, 7, '#ffc85c', .35);
  }
  // spawn portal
  const [sx, sy] = P.pts[0], spx = sx * TS, spy = sy * TS;
  glow(ctx, spx, spy, 16, '#ff653f', .55);
  circle(ctx, spx, spy, 6, '#1a0f1d');
  for (let i = 0; i < 4; i++) {
    const a = now * (2.2 + i * .6) * (i % 2 ? -1 : 1) + i * 1.7;
    ctx.strokeStyle = i % 2 ? 'rgba(224,122,154,.9)' : 'rgba(255,101,63,.9)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(spx, spy, 5 + i * 2.6, a, a + 2.8); ctx.stroke();
  }
  // core base
  const [ex, ey] = P.pts[P.pts.length - 1], cpx = ex * TS, cpy = ey * TS, flash = S.coreFlash > 0, pulse = Math.sin(now * 3);
  const cc = flash ? '#ff653f' : '#ffc85c';
  glow(ctx, cpx, cpy, 18 + pulse * 2, cc, .5);
  ctx.save(); ctx.translate(cpx, cpy);
  poly(ctx, 6, 11 + pulse, Math.PI / 6); ctx.fillStyle = flash ? 'rgba(232,103,74,.35)' : 'rgba(58,40,20,.9)'; ctx.fill();
  ctx.strokeStyle = cc; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.rotate(-now); poly(ctx, 6, 6.5, 0); ctx.strokeStyle = rgba(cc, .7); ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
  circle(ctx, cpx, cpy, 3 + pulse * .5, flash ? '#f3c9bb' : '#e6f3f1');
}

function render(now){
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  if (ui.shake > .05) ctx.translate((Math.random() - .5) * ui.shake, (Math.random() - .5) * ui.shake);
  ctx.fillStyle = '#120e4d'; ctx.fillRect(-8, -8, W + 16, H + 16);
  drawDynamicMap(now);
  // hazards
  for (const h of S.hazards) {
    const a = h.t / h.life, px = h.x * TS, py = h.y * TS, r = h.r * TS;
    if (h.k === 'lava') {
      const g = ctx.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, `rgba(243,210,176,${.6 * a})`); g.addColorStop(.5, `rgba(226,85,45,${.45 * a})`); g.addColorStop(1, 'rgba(212,72,42,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r * (.9 + .1 * Math.sin(now * 12 + px)), 0, 7); ctx.fill();
    } else {
      glow(ctx, px, py, r * 1.1, '#ff653f', .3 * a);
      ctx.strokeStyle = `rgba(255,101,63,${.85 * a})`; ctx.lineWidth = 1.5;
      for (let i = 0; i < 5; i++) { const b = -now * 6 + i * Math.PI * .4; ctx.beginPath(); ctx.arc(px, py, r * (.3 + i * .14), b, b + 1.8); ctx.stroke(); }
      circle(ctx, px, py, r * .26, '#000');
      ctx.strokeStyle = `rgba(241,224,236,${a})`; ctx.lineWidth = .8; ctx.beginPath(); ctx.arc(px, py, r * .27, 0, 7); ctx.stroke();
    }
  }
  // chrono fields & midas auras
  for (const t of S.towers) {
    const d = TOWERS[t.type];
    if (d.buff) { ctx.setLineDash([2, 5]); ctx.lineDashOffset = now * 10; ctx.strokeStyle = 'rgba(236,228,208,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc((t.x + .5) * TS, (t.y + .5) * TS, stats(t).range * TS, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    if (isMint(t) && cnt(t, 'midas')) { ctx.strokeStyle = 'rgba(255,200,92,.18)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc((t.x + .5) * TS, (t.y + .5) * TS, mintStats(t).range * TS, 0, 7); ctx.stroke(); }
  }
  // build hover
  const hv = ui.hover;
  if (hv && !S.over) {
    const free = !isPath(hv.x, hv.y) && !towerAt(hv.x, hv.y);
    if (ui.build !== null) {
      const ok = free && S.gold >= TOWERS[ui.build].cost;
      rr(ctx, hv.x * TS + 2, hv.y * TS + 2, TS - 4, TS - 4, 5);
      ctx.fillStyle = ok ? 'rgba(156,194,90,.16)' : 'rgba(232,103,74,.18)'; ctx.fill();
      ctx.strokeStyle = ok ? 'rgba(156,194,90,.7)' : 'rgba(232,103,74,.7)'; ctx.lineWidth = 1; ctx.stroke();

  if (!ui.min) render(now / 1000);
  updateUI();
  if (now - lastSave > 10000) { lastSave = now; save(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
