<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Neon Siege TD</title>
<style>
:root{
  --base:#090c12;--glass:rgba(22,28,42,.55);--glass-hi:rgba(30,38,56,.7);--edge:rgba(255,255,255,.1);--edge-hi:rgba(255,255,255,.18);
  --text:#e8eef8;--dim:#8590a6;--accent:#22d3ee;--gold:#fbbf24;--emerald:#34d399;--bad:#fb7185;--violet:#c084fc;--star:#fde68a;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 85% 90%,#101826 0%,#06080c 60%);color:var(--text);font-family:var(--font)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
svg{display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 24px rgba(0,0,0,.45)}

/* ---------- Widget shell ---------- */
#w{position:fixed;right:16px;bottom:16px;width:400px;height:340px;display:flex;flex-direction:column;overflow:hidden;user-select:none;
  background:rgba(9,12,18,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--edge);border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.6),0 0 30px rgba(34,211,238,.07);
  font-size:11px;font-variant-numeric:tabular-nums;transition:width .25s ease,height .25s ease,border-radius .25s ease}
#w.min{width:auto;height:34px;border-radius:999px}
/* Desktop overlay (Electron): the OS window is exactly the widget's size and fully transparent around it. */
html.overlay,html.overlay body{background:transparent}
html.overlay #w{right:0;bottom:0;transition:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
html.overlay .pills{-webkit-app-region:drag;cursor:grab}
#w.min .full{display:none!important}

/* ---------- HUD ---------- */
#top{height:32px;flex:none;display:flex;align-items:center;gap:3px;padding:0 6px;border-bottom:1px solid rgba(255,255,255,.06);
  background:linear-gradient(rgba(255,255,255,.035),rgba(255,255,255,0))}
#w.min #top{border-bottom:none;height:34px;padding:0 5px 0 7px}
.pills{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden}
.pill{display:flex;align-items:center;gap:3px;height:21px;padding:0 6px 0 5px;border-radius:999px;background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);white-space:nowrap;font-weight:650;letter-spacing:.1px}
.pill svg{width:11px;height:11px;flex:none}
.pill .rate{font-size:9px;font-weight:600;color:var(--emerald);opacity:.9;margin-left:2px}
.p-w{color:var(--accent)}.p-g{color:var(--gold)}.p-l{color:var(--bad)}
.p-l.hurt{animation:hurt .4s ease}
@keyframes hurt{0%,100%{transform:none}30%{transform:translateX(-2px);background:rgba(251,113,133,.25)}60%{transform:translateX(2px)}}
.ib{height:22px;min-width:22px;padding:0 5px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:2px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#c9d3e3;font-size:10px;font-weight:700;
  transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease,color .15s ease}
.ib svg{width:12px;height:12px}
.ib:hover{transform:translateY(-1px);background:rgba(255,255,255,.09);border-color:var(--edge-hi);color:#fff}
.ib:active{transform:scale(.92)}
.ib.on{color:var(--accent);border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.12);box-shadow:0 0 10px rgba(34,211,238,.25)}
.ib.go{color:#04131a;background:linear-gradient(#5eead4,#22d3ee);border-color:transparent;box-shadow:0 0 12px rgba(34,211,238,.45)}
.ib.go:disabled{background:rgba(255,255,255,.05);color:#5d677a;box-shadow:none;border-color:rgba(255,255,255,.08);cursor:default;transform:none}
.ib.warn{color:#fff;background:rgba(251,113,133,.25);border-color:var(--bad)}
.ib .alt{display:none}.ib.off .main{display:none}.ib.off .alt{display:block}.ib.off{color:#5d677a}

/* ---------- Stage ---------- */
#stage{position:relative;width:384px;height:224px;margin:5px auto 0;flex:none;border-radius:9px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),inset 0 0 0 1px rgba(0,0,0,.5)}
#cv{display:block;width:384px;height:224px;cursor:crosshair}
.ovl{position:absolute;z-index:5;animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.hidden{display:none!important}

/* ---------- Inspector ---------- */
#panel{top:6px;width:170px;border-radius:11px;padding:7px;font-size:10px}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#pIcon{width:26px;height:26px;flex:none;border-radius:6px;background:rgba(0,0,0,.25)}
.pt{flex:1;min-width:0;line-height:1.15}
.nm{font-weight:750;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:9px;color:var(--dim)}
.badge{font-size:9px;font-weight:800;padding:1px 5px;border-radius:999px;color:#05070b}
.x{width:18px;height:18px;border-radius:6px;color:var(--dim);font-size:14px;line-height:1;transition:background .15s,color .15s}
.x:hover{background:rgba(255,255,255,.08);color:#fff}
.prog{margin-bottom:6px}
.pl{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);margin-bottom:3px}
.pl b{color:var(--text);font-weight:700}
.track{height:5px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#a855f7,#f0abfc);box-shadow:0 0 8px rgba(240,171,252,.7);transition:width .3s ease}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:6px}
.sc{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.05);border-radius:6px;padding:3px 2px;text-align:center;line-height:1.2}
.sc span{display:block;font-size:7.5px;letter-spacing:.6px;color:var(--dim);text-transform:uppercase}
.sc b{font-size:10px;font-weight:750}
.muts{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.chip{font-size:8.5px;font-weight:650;padding:1px 5px;border-radius:999px;border:1px solid rgba(240,171,252,.35);color:#f5d0fe;background:rgba(240,171,252,.08)}
.btn{width:100%;height:23px;border-radius:7px;font-size:10px;font-weight:750;letter-spacing:.2px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
  transition:transform .12s ease,box-shadow .15s ease,background .15s ease,filter .15s}
.btn:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.12)}
.btn:not(:disabled):active{transform:scale(.96)}
.btn:disabled{opacity:.42;cursor:default}
.btn.up{color:#04131a;background:linear-gradient(#67e8f9,#22d3ee);border-color:transparent;box-shadow:0 0 12px rgba(34,211,238,.35);margin-bottom:4px}
.btn.up.mut{background:linear-gradient(#f5d0fe,#c084fc);box-shadow:0 0 12px rgba(192,132,252,.45)}
.btn.up:disabled{background:rgba(255,255,255,.06);color:var(--dim);box-shadow:none}
.btn.sell{color:#fecdd3;border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}
.btn.sm{font-size:9px;font-weight:650;color:var(--dim)}
.btn.on{color:var(--emerald);border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08)}
.prow{display:flex;gap:4px}

/* ---------- Mutation / Game over ---------- */
#mut,#over{inset:0;background:rgba(6,8,12,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.mh{font-weight:850;font-size:12px;color:#f5d0fe;letter-spacing:2px;text-shadow:0 0 12px rgba(240,171,252,.7)}
.msub{font-size:9px;color:#aab3c5}
.mopts{display:flex;gap:6px;width:100%}
.mc{flex:1;min-height:100px;border-radius:10px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.mc:hover{transform:translateY(-3px);border-color:rgba(240,171,252,.7);box-shadow:0 0 18px rgba(240,171,252,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.mc:active{transform:scale(.96)}
.mc .i{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#f5d0fe,#a855f7);box-shadow:0 0 12px rgba(192,132,252,.6)}
.mc.eco .i{background:radial-gradient(circle at 35% 30%,#fef3c7,#d97706);box-shadow:0 0 12px rgba(251,191,36,.6)}
.mc .t{font-weight:750;font-size:10px}.mc .d{font-size:8.5px;color:#b4bdcf;line-height:1.3}.mc .m{font-size:8.5px;font-weight:700;color:var(--gold);margin-top:auto}
#mut .prow{width:100%}
.oh{font-weight:900;font-size:16px;color:var(--bad);letter-spacing:3px;text-shadow:0 0 14px rgba(251,113,133,.7)}
#oTxt{text-align:center;color:#cbd5e1;font-size:10.5px;line-height:1.55}
#over .btn{width:150px}

/* ---------- Prestige ---------- */
.ib.star{color:#fde68a}
.ib.star.ready{color:#1c1203;background:linear-gradient(#fef3c7,#f59e0b);border-color:transparent;animation:readyPulse 1.6s ease-in-out infinite}
@keyframes readyPulse{0%,100%{box-shadow:0 0 6px rgba(251,191,36,.45)}50%{box-shadow:0 0 16px rgba(251,191,36,.95)}}
#pres{inset:0;display:flex;flex-direction:column;gap:7px;padding:9px 10px;color:var(--text);
  background:radial-gradient(260px 160px at 50% 0%,rgba(251,191,36,.2),transparent 70%),radial-gradient(300px 200px at 50% 120%,rgba(168,85,247,.18),transparent 70%),rgba(7,9,14,.86);
  -webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%)}
.pr-head{display:flex;align-items:center;gap:9px}
.emblem{position:relative;width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from 0deg,#fde68a,#f59e0b,#a855f7,#22d3ee,#fde68a);animation:spin 6s linear infinite}
.emblem::before{content:"";position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2a1f08,#0b0d14 70%)}
.emblem svg{position:relative;width:20px;height:20px;fill:#fbbf24;filter:drop-shadow(0 0 5px rgba(251,191,36,.9));animation:spin 6s linear infinite reverse}
.emblem.ready{box-shadow:0 0 18px rgba(251,191,36,.75)}
@keyframes spin{to{transform:rotate(360deg)}}
.pr-ttl{flex:1;min-width:0}
.pr-t{font-weight:900;font-size:13px;letter-spacing:4px;background:linear-gradient(90deg,#fef3c7,#fbbf24 45%,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.pr-s{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:10px;font-weight:750}
.pr-star{color:#cbd5e1}.pr-star.to{color:#fde68a;text-shadow:0 0 8px rgba(251,191,36,.6)}
.pr-arrow{color:var(--dim)}
.pr-bonus{margin-left:3px;font-size:8.5px;font-weight:650;color:#c7d2e2;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.rq{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:border-color .3s,background .3s,box-shadow .3s}
.rq-i{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fde68a;
  background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);transition:all .3s}
.rq-b{flex:1;min-width:0}
.rq-l{font-size:8px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
.rq-v{font-size:11px;font-weight:800;margin:1px 0 3px;white-space:nowrap}
.rq-v .n{color:var(--dim);font-weight:650}
.rq-bar{height:4px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.rq-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#f59e0b,#fde68a);transition:width .35s ease}
.rq.done{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 10px rgba(52,211,153,.12)}
.rq.done .rq-i{color:#04130d;background:linear-gradient(#6ee7b7,#10b981);border-color:transparent;box-shadow:0 0 8px rgba(52,211,153,.6)}
.rq.done .rq-bar i{background:linear-gradient(90deg,#10b981,#6ee7b7)}
.pr-foot{display:flex;gap:6px}
.pr-foot .btn.sm{flex:0 0 112px}
.btn.asc{position:relative;overflow:hidden;color:#1c1203;background:linear-gradient(#fef3c7,#f59e0b);border-color:transparent;box-shadow:0 0 14px rgba(251,191,36,.45)}
.btn.asc::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 2.4s ease-in-out infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.btn.asc:disabled{color:var(--dim);background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);box-shadow:none;opacity:1}
.btn.asc:disabled::after{display:none}

/* ---------- Dock ---------- */
#bar{flex:1;display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;padding:6px 7px 4px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
#bar::-webkit-scrollbar{height:4px}#bar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.tw{--rc:#94a3b8;position:relative;flex:none;width:54px;height:62px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 10px color-mix(in srgb,var(--rc) 22%,transparent);
  transition:transform .14s ease,box-shadow .15s ease,filter .2s ease,opacity .2s ease,border-color .15s ease}
.tw:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 14px color-mix(in srgb,var(--rc) 45%,transparent)}
.tw:active{transform:scale(.94)}
.tw.sel{border-color:#fff;box-shadow:0 0 0 1px var(--rc),0 0 16px color-mix(in srgb,var(--rc) 70%,transparent);background:linear-gradient(color-mix(in srgb,var(--rc) 22%,transparent),rgba(255,255,255,.02))}
.tw.poor{filter:grayscale(.85) brightness(.65);box-shadow:none;border-color:rgba(255,255,255,.08)}
.tw .k{position:absolute;top:2px;left:4px;font-size:7.5px;font-weight:700;color:rgba(255,255,255,.35)}
.tw canvas{width:30px;height:30px}
.tw .n{font-size:8.5px;font-weight:650;color:#cbd5e1;line-height:1}
.tw .c{font-size:9px;font-weight:800;color:var(--gold);line-height:1.1}
#tip{position:absolute;z-index:9;bottom:84px;width:184px;border-radius:10px;padding:7px 8px;pointer-events:none;animation:pop .14s ease}
#tip .tn{font-weight:800;font-size:11px;display:flex;justify-content:space-between}
#tip .tn b{color:var(--gold)}
#tip .tr{font-size:8.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:1px 0 3px}
#tip .td{font-size:9.5px;color:#b9c2d3;line-height:1.35}
</style>
</head>
<body>
<div id="w">
  <div id="top">
    <div class="pills">
      <span class="pill p-w" title="Wave"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 6c2-2.5 4-2.5 6 0s4 2.5 6 0M2 11c2-2.5 4-2.5 6 0s4 2.5 6 0"/></svg><span id="sWave">0</span></span>
      <span class="pill p-g" title="Gold · rolling 10s income per game-second"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor"/><circle cx="8" cy="8" r="4.2" fill="none" stroke="#7c4a03" stroke-width="1.2"/></svg><span id="sGold">0</span><span id="sRate" class="rate">+0/s</span></span>
      <span id="pLives" class="pill p-l" title="Core lives"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M8 14.2 2.3 8.6a3.4 3.4 0 0 1 4.8-4.9L8 4.6l.9-.9a3.4 3.4 0 0 1 4.8 4.9z"/></svg><span id="sLives">0</span></span>
    </div>
    <button id="bWave" class="ib go" title="Start next wave (Space)"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M4.5 2.8v10.4L13 8z"/></svg></button>
    <button id="bSpeed" class="ib full" title="Game speed">1x</button>
    <button id="bAuto" class="ib full" title="Auto-wave"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6.5A5 5 0 0 0 4 4.3L2.5 6M3 9.5a5 5 0 0 0 9 2.2L13.5 10"/><path d="M2.5 2.8V6h3.2M13.5 13.2V10h-3.2"/></svg></button>
    <button id="bMute" class="ib full" title="Sound"><svg class="main" viewBox="0 0 16 16"><path fill="currentColor" d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.7a6 6 0 0 1 0 8.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><svg class="alt" viewBox="0 0 16 16"><path fill="currentColor" d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="m10.5 6 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button id="bPres" class="ib star full" title="Prestige"><svg viewBox="0 0 16 16"><path fill="currentColor" d="m8 1.4 1.9 4.1 4.5.5-3.4 3 1 4.4L8 11.2l-4 2.2 1-4.4-3.4-3 4.5-.5z"/></svg></button>
    <button id="bMin" class="ib" title="Minimize to pill / expand"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path id="bMinPath" d="m4 6 4 4 4-4"/></svg></button>
  </div>
  <div id="stage" class="full">
    <canvas id="cv"></canvas>
    <div id="panel" class="glass ovl hidden">
      <div class="ph"><canvas id="pIcon"></canvas><div class="pt"><div id="pName" class="nm"></div><div id="pRole" class="role"></div></div><span id="pTier" class="badge"></span><button id="pClose" class="x" title="Close">×</button></div>
      <div class="prog"><div class="pl"><span>Level <b id="pLv"></b></span><span id="pNext"></span></div><div class="track"><div id="pBar" class="fill"></div></div></div>
      <div class="sg">
        <div class="sc"><span id="pK1"></span><b id="pV1"></b></div>
        <div class="sc"><span id="pK2"></span><b id="pV2"></b></div>
        <div class="sc"><span id="pK3"></span><b id="pV3"></b></div>
        <div class="sc"><span>Earned</span><b id="pV4"></b></div>
      </div>
      <div id="pMuts" class="muts"></div>
      <button id="pUp" class="btn up"></button>
      <div class="prow"><button id="pSell" class="btn sell"></button><button id="pAuto" class="btn sm" title="Auto-pick mutations for idle play"></button></div>
    </div>
    <div id="mut" class="ovl hidden">
      <div class="mh">✦ MUTATION <span id="mTitle"></span></div>
      <div id="mSub" class="msub"></div>
      <div id="mOpts" class="mopts"></div>
      <div class="prow"><button id="mReroll" class="btn sm"></button><button id="mAuto" class="btn sm" title="Auto-pick mutations for idle play"></button></div>
    </div>
    <div id="pres" class="ovl hidden">
      <div class="pr-head">
        <div id="prEmblem" class="emblem"><svg viewBox="0 0 16 16"><path d="m8 1.4 1.9 4.1 4.5.5-3.4 3 1 4.4L8 11.2l-4 2.2 1-4.4-3.4-3 4.5-.5z"/></svg></div>
        <div class="pr-ttl">
          <div class="pr-t">PRESTIGE</div>
          <div class="pr-s"><span class="pr-star">★<span id="prFrom"></span></span><span class="pr-arrow">→</span><span class="pr-star to">★<span id="prTo"></span></span><span id="prBonus" class="pr-bonus"></span></div>
        </div>
        <button id="prClose" class="x" title="Close (Esc)">×</button>
      </div>
      <div id="prReqs" class="pr-grid"></div>
      <div class="pr-foot">
        <button id="prReroll" class="btn sm" title="Restart on a new map without earning stars"></button>
        <button id="prGo" class="btn asc"></button>
      </div>

const $ = id => document.getElementById(id);
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmt(n){
  if (n < 10 && n > 0 && n % 1) return n.toFixed(1);
  n = Math.floor(n);
  if (n < 1000) return String(n);
  const u = ['k','M','B','T','Qa','Qi','Sx','Sp'];
  let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + u[i];
}
const RGB = {};
function rgba(hex, a){

  if (!c) { const n = parseInt(hex.slice(1), 16); c = RGB[hex] = `${n >> 16 & 255},${n >> 8 & 255},${n & 255}`; }

}

// ================= Audio =================
let AC = null, master = null, noiseBuf = null;

function initAudio(){
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

}
function tone(f, dur, type, vol, f2, delay = 0){
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq){
  const t = AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = 'lowpass'; fl.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
