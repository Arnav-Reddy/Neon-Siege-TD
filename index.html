// Self-bootstrapping update cache. If an in-game update stored a newer version, run that instead of this file.
// The game script below is inert until loaded at the end of <body>, so a swap never runs two copies of the game.
function cmpVer(a, b){
  const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0);
  return 0;
}

  if (!cached) return;
  const m = cached.match(/<meta name="app-version" content="([^"]+)"/);
  if (!m || cmpVer(m[1], local) <= 0) { localStorage.removeItem('f1_td_cached_html'); return; } // this file is current
  window.__F1_SWAP = true;
  document.addEventListener('DOMContentLoaded', () => { document.open(); document.write(cached); document.close(); });
})();

/* Bone & Ember: warm paper, ink rules, flat colour, hard offset shadows. */
:root{
  --paper:#fff4dc;--paper2:#ffe8bc;--paper3:#ffdc96;--ink:#16115e;--ink2:#4a4592;--ink3:#8783b6;
  --ember:#ff653f;--ochre:#ffc85c;--moss:#3730aa;--plum:#3730aa;--steel:#3730aa;
  --rule:1.5px solid var(--ink);--shadow:3px 3px 0 var(--ink);--shadow-sm:2px 2px 0 var(--ink);
  --sans:'Titillium Web',ui-sans-serif,system-ui,sans-serif;
  --mono:'Titillium Web',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f3dfb4;color:var(--ink);font-family:var(--sans)}
body{background-image:radial-gradient(rgba(22,17,94,.12) 1px,transparent 1px);background-size:14px 14px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
svg{display:block}
.hidden{display:none!important}
.glass{background:var(--paper);border:var(--rule);box-shadow:var(--shadow)}
.lbl{font-size:8px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3)}

/* ---------- Shell (position via #wrap, size via zoom on #w) ---------- */
#wrap{position:fixed;z-index:2147483000}
#w{position:relative;width:440px;height:344px;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:var(--paper);border:var(--rule);border-radius:7px;box-shadow:4px 4px 0 var(--ink);font-size:11px;font-variant-numeric:tabular-nums}
#w.min{width:auto;height:40px}
#w.min .full{display:none!important}
#w.dragging{box-shadow:7px 7px 0 var(--ink)}
html.overlay,html.overlay body{background:transparent;background-image:none}
html.overlay #wrap{left:0;top:0}
html.overlay #w{box-shadow:none}
html.overlay .handle{-webkit-app-region:drag}

/* ---------- Top bar ---------- */
#top{height:38px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 3px;border-bottom:var(--rule);background:var(--paper2)}
#w.min #top{border-bottom:none}
.grip{width:14px;height:26px;display:grid;place-items:center;color:var(--ink3);cursor:grab}
.grip:hover{color:var(--ink)}
.stats{display:flex;align-items:center;flex:1;min-width:0;height:26px;overflow:hidden;white-space:nowrap;cursor:grab;
  background:var(--paper);border:var(--rule);border-radius:4px}
#w.dragging .stats,#w.dragging .grip{cursor:grabbing}
.st{display:flex;align-items:center;gap:3px;height:100%;padding:0 4px;font-family:var(--mono);font-weight:700;font-size:11px;color:var(--ink)}
.st+.st{border-left:var(--rule)}
.st svg{width:11px;height:11px;flex:none}
.st-w svg{color:var(--steel)}.st-g svg{color:var(--ochre)}.st-l svg{color:var(--ember)}
.st .rate{font-size:9.5px;font-weight:700;color:var(--moss)}
.st-l.hurt{animation:hurt .45s steps(2) 2}
@keyframes hurt{50%{background:var(--ember);color:var(--paper)}}
.ib{height:26px;min-width:24px;padding:0 4px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  background:var(--paper);border:var(--rule);box-shadow:var(--shadow-sm);color:var(--ink);font-family:var(--mono);font-size:10.5px;font-weight:700;
  transition:background .1s}
.ib svg{width:12px;height:12px}
.ib:hover{background:var(--paper3)}
.ib:active{transform:translate(2px,2px);box-shadow:none}
.ib.go{background:var(--ember);color:var(--paper)}
.ib.go:hover{background:#f04f28}
.ib.go:disabled{background:var(--paper2);color:var(--ink3);box-shadow:none;cursor:default;transform:translate(2px,2px)}
.ib.on{background:var(--ink);color:var(--paper)}
.seg{display:flex;gap:3px}
.ib .alt{display:none}.ib.off .main{display:none}.ib.off .alt{display:block}.ib.off{color:var(--ink3)}
.ib.pres{gap:3px;padding:0 6px 0 5px;background:var(--ochre);color:var(--ink);font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.ib.pres:hover{background:#ffb93a}
.ib.pres svg{width:12px;height:12px}
.ib.pres.ready{position:relative;animation:nudge 1.2s ease-in-out infinite}
.ib.pres.ready::after{content:"";position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--ember);border:1.5px solid var(--ink)}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-2px)}}

/* ---------- Stage ---------- */
#stage{position:relative;width:384px;height:224px;margin:7px auto 0;flex:none;border:var(--rule);border-radius:4px;overflow:hidden;box-sizing:content-box}
#cv{display:block;width:384px;height:224px;cursor:crosshair}
.ovl{position:absolute;z-index:5;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Inspector ---------- */
#panel{top:6px;width:174px;border-radius:5px;padding:8px;font-size:10px}
.ph{display:flex;align-items:center;gap:7px;margin-bottom:7px;padding-bottom:7px;border-bottom:var(--rule)}
#pIcon{width:28px;height:28px;flex:none;border-radius:3px;background:#120e4d;border:var(--rule)}
.pt{flex:1;min-width:0;line-height:1.2}
.nm{font-weight:800;font-size:11.5px;white-space:nowrap;overflow:hidden}
.role{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);white-space:nowrap;overflow:hidden}
.badge{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border:var(--rule);border-radius:3px;color:var(--ink)}
.x{width:20px;height:20px;border-radius:3px;color:var(--ink2);font-size:15px;line-height:20px;text-align:center;overflow:hidden}
.x:hover{background:var(--ink);color:var(--paper)}
.prog{margin-bottom:7px}
.pl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:9px;color:var(--ink2)}
.pl b{font-family:var(--mono);color:var(--ink)}
.track{height:7px;border:var(--rule);border-radius:2px;background:var(--paper2);overflow:hidden}
.fill{height:100%;background:repeating-linear-gradient(-45deg,var(--plum) 0 4px,#5a52d6 4px 8px);transition:width .3s ease}
.sg{display:grid;grid-template-columns:repeat(4,1fr);border:var(--rule);border-radius:3px;margin-bottom:7px;background:var(--paper2)}
.sc{padding:4px 2px;text-align:center;line-height:1.25}
.sc+.sc{border-left:var(--rule)}
.sc span{display:block;font-size:7px;font-weight:700;letter-spacing:.9px;color:var(--ink3);text-transform:uppercase}
.sc b{font-family:var(--mono);font-size:10.5px;font-weight:700}
.muts{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px}
.chip{font-size:8.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--plum);color:var(--paper)}
.btn{width:100%;height:25px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.3px;border:var(--rule);background:var(--paper);box-shadow:var(--shadow-sm);transition:background .1s}
.btn:not(:disabled):hover{background:var(--paper3)}
.btn:not(:disabled):active{transform:translate(2px,2px);box-shadow:none}
.btn:disabled{color:var(--ink3);box-shadow:none;cursor:default;transform:translate(2px,2px);background:var(--paper2)}
.btn.up{background:var(--ink);color:var(--paper);margin-bottom:6px}
.btn.up:not(:disabled):hover{background:#2a2380}
.btn.up.mut{background:var(--moss)}
.btn.up:disabled{background:var(--paper2);color:var(--ink3)}
.btn.sell{color:var(--ember)}
.btn.sm{font-size:9px;font-weight:700}
.btn.on{background:var(--moss);color:var(--paper)}
.prow{display:flex;gap:6px}

/* ---------- Full-stage sheets: mutation, prestige, game over ---------- */
#mut,#pres,#over,#season,#hq{inset:0;background:var(--paper);display:flex;flex-direction:column;padding:10px 11px;gap:7px}
#mut,#over{align-items:center;justify-content:center}
.mh{font-weight:900;font-size:12px;letter-spacing:3px;color:var(--plum)}
.msub{font-size:9px;color:var(--ink2)}
.mopts{display:flex;gap:7px;width:100%}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.mcol .mc{width:100%}.mcol .msel{height:21px;margin:0}
.mc{flex:1;min-height:104px;border-radius:5px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;transition:transform .1s}
.mc:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.mc:active{transform:translate(2px,2px);box-shadow:none}
.mc .i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--paper);background:var(--plum);border:var(--rule)}
.mc.eco .i{background:var(--ochre);color:var(--ink)}
.mc .t{font-weight:800;font-size:10px}.mc .d{font-size:8.5px;color:var(--ink2);line-height:1.3}
.mc .m{margin-top:auto;font-family:var(--mono);font-size:8.5px;font-weight:700;color:var(--moss)}
#mut .prow{width:100%}
.oh{font-weight:900;font-size:17px;letter-spacing:4px;color:var(--ember)}
#oTxt{text-align:center;color:var(--ink2);font-size:10.5px;line-height:1.6}
#oTxt b{color:var(--ink)}
#over .btn{width:160px}

/* ---------- HUD extras ---------- */
.st-t svg{color:var(--ink2)}
.ib.sc{--p:0%;background:linear-gradient(90deg,var(--paper3) var(--p),var(--paper) var(--p));color:var(--ink)}
.ib.sc.live{background:var(--ochre);animation:nudge 1s ease-in-out infinite}
.ib.sc:disabled{cursor:default}
/* ---------- Homescreen (save slots) ---------- */
#home{position:absolute;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;padding:9px 10px 7px;gap:6px}
.hm-head{display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:var(--rule)}
.hm-logo{width:30px;height:30px;border:var(--rule);border-radius:50%;display:grid;place-items:center;background:var(--ochre);font-size:14px}
.hm-ttl{flex:1}.hm-head .handle{cursor:grab}.hm-t{font-weight:900;font-size:13px;letter-spacing:4px}.hm-s{font-size:9px;color:var(--ink2);font-family:var(--mono)}
.hm-cont{height:30px;flex:none;border:var(--rule);border-radius:4px;background:var(--ember);color:var(--paper);font-weight:800;font-size:11px;box-shadow:var(--shadow-sm)}
.hm-cont:hover{background:#f04f28}.hm-cont:active{transform:translate(2px,2px);box-shadow:none}
.hm-slots{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:0 2px 2px 0}
.slot{border:var(--rule);border-radius:4px;background:var(--paper2);padding:5px 7px;display:flex;flex-direction:column;gap:3px;flex:none}
.sl-top{display:flex;align-items:center;gap:5px}
.sl-n{font-family:var(--mono);font-size:9px;font-weight:700;width:15px;height:15px;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--paper);border-radius:3px}
.sl-name{font-weight:800;font-size:11px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.sl-name input{width:100%;font:inherit;border:1px solid var(--ink);border-radius:3px;padding:0 3px;background:var(--paper)}
.sl-ren{color:var(--ink2);font-size:11px;width:18px;height:18px;border-radius:3px;flex:none}.sl-ren:hover{background:var(--paper3)}
.sl-rank{font-family:var(--mono);font-size:9px;font-weight:700;padding:0 5px;border-radius:3px;background:var(--ochre);border:1px solid var(--ink);flex:none}
.sl-meta{font-family:var(--mono);font-size:9px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.sl-btns{display:flex;gap:4px}.sl-btns .btn{height:21px;font-size:9.5px;margin:0}.sl-btns .sl-go{flex:2}.sl-btns .sl-exp{flex:0 0 26px}.sl-btns .sl-del{flex:1}
.slot.empty{background:transparent;border-style:dashed}
.sl-empty{font-family:var(--mono);font-size:9.5px;color:var(--ink3);text-align:center}
.sl-new{display:flex;gap:4px}.sl-new input{flex:1;min-width:0;font:inherit;font-size:10px;border:1px solid var(--ink3);border-radius:3px;padding:0 5px;background:var(--paper)}
.sl-new .btn{flex:0 0 92px;height:21px;margin:0;font-size:9.5px}
.hm-foot{display:flex;gap:5px;flex:none}.hm-foot .btn{height:22px}.hm-foot #hmUrlBtn{flex:0 0 26px}
.hm-url{display:flex;gap:4px;flex:none}.hm-url input{flex:1;min-width:0;font-family:var(--mono);font-size:8.5px;border:var(--rule);border-radius:3px;padding:2px 4px;background:var(--paper)}.hm-url .btn{flex:0 0 50px;height:20px}
.hm-msg{font-size:9px;color:var(--ink2);min-height:11px;text-align:center;flex:none}
/* ---------- Update popup ---------- */
#upd{position:absolute;inset:0;z-index:30;background:rgba(22,17,94,.35);display:flex;align-items:center;justify-content:center}
.upd-card{width:280px;background:var(--paper);border:var(--rule);border-radius:6px;box-shadow:4px 4px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:center}
.upd-t{font-weight:900;letter-spacing:3px;font-size:12px}.upd-v{font-family:var(--mono);font-size:11px}.upd-n{font-size:9px;color:var(--ink2)}
.upd-card .prow .btn.sm{flex:0 0 70px}
/* ---------- Inspector extras ---------- */
#panel{max-height:212px;display:flex;flex-direction:column;overflow:hidden}
#panel>.ph,#panel>.uprow,#panel>.prow{flex:none}
.pbody{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;margin-right:-4px;padding-right:4px;padding-bottom:6px;-webkit-mask-image:linear-gradient(#000 calc(100% - 12px),transparent);mask-image:linear-gradient(#000 calc(100% - 12px),transparent)}
#panel .pl .badge{margin-left:5px;font-size:8px;padding:0 4px}
#panel .btn{white-space:nowrap;overflow:hidden;height:22px}
#panel .prow{gap:4px}#panel .prow .btn{width:auto;flex:1 1 auto;min-width:0;padding-left:3px;padding-right:3px;font-size:9px}
#panel .role{letter-spacing:.5px}
#panel .pdelta{white-space:normal}
#panel .nm{font-size:10.5px;white-space:normal;line-height:1.15;overflow:visible}
.pdelta{font-family:var(--mono);font-size:8.5px;color:var(--ink2);margin-bottom:4px;white-space:nowrap;overflow:hidden}
.pdelta b{color:var(--moss)}
.uprow{display:flex;gap:5px;margin-bottom:6px}.uprow .btn{margin:0}.uprow #pUp{flex:1}.uprow #pMax{flex:0 0 42px}
.prio{display:flex;gap:3px;margin-bottom:5px}.prio button{flex:1;height:17px;font-size:8px;font-weight:700;border:1px solid var(--ink);border-radius:3px;background:var(--paper);white-space:nowrap}
.prio button:hover{background:var(--paper3)}.prio button.on{background:var(--ink);color:var(--paper)}
.prio .lk{font-size:8px;color:var(--ink3);font-family:var(--mono)}
.prow .btn.od{color:var(--ember)}.prow .btn.od.on{background:var(--ember);color:var(--paper)}
/* ---------- Dock locks ---------- */
.tw.locked{opacity:.55}.tw.locked canvas{filter:grayscale(1)}
.tw .lock{position:absolute;top:3px;left:3px;font-family:var(--mono);font-size:8px;font-weight:700;padding:0 3px;border-radius:2px;background:var(--ink);color:var(--paper)}
/* ---------- Season finale ---------- */
.se-btns{display:flex;gap:5px}.se-btns .btn{margin:0}.se-btns .btn.sm{flex:0 0 96px}
/* ---------- Season summary & Team HQ ---------- */
.ss-cp{font-family:var(--mono);font-weight:900;font-size:22px;line-height:1;color:var(--ember);display:flex;align-items:baseline;gap:2px}
.ss-cp small{font-size:9px;letter-spacing:1px;color:var(--ink2)}
.ss-grid{display:grid;grid-template-columns:repeat(4,1fr);border:var(--rule);border-radius:4px;background:var(--paper2)}
.ss-grid .sc b{font-size:13px}
.ss-break{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;font-size:10px;color:var(--ink2)}
.ss-break div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--ink3);padding-bottom:2px}
.ss-break b{font-family:var(--mono);color:var(--ink)}
.hq-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:5px;min-height:0}
.hq-card{display:flex;flex-direction:column;gap:1px;padding:4px 6px;border:var(--rule);border-radius:4px;background:var(--paper2);min-width:0}
.hq-card .hn{display:flex;align-items:center;gap:4px;font-weight:800;font-size:9.5px;white-space:nowrap;overflow:hidden}
.hq-card .hn i{font-style:normal;width:15px;height:15px;flex:none;display:grid;place-items:center;border-radius:3px;background:var(--ink);color:var(--paper);font-size:9px}
.hq-card .hd{font-size:8.5px;color:var(--ink2);line-height:1.25;flex:1}
.hq-card .btn{height:18px;font-size:9px}
.hq-card.maxed{opacity:.6}
/* ---------- Prestige ---------- */
.pr-head{display:flex;align-items:center;gap:9px;padding-bottom:7px;border-bottom:var(--rule)}
.emblem{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--paper2);border:var(--rule)}
.emblem svg{width:18px;height:18px;fill:var(--ink3)}
.emblem.ready{background:var(--ochre)}
.emblem.ready svg{fill:var(--ink)}
.pr-ttl{flex:1;min-width:0}
.pr-t{font-weight:900;font-size:12px;letter-spacing:4px}
.pr-s{display:flex;align-items:center;gap:5px;margin-top:2px;font-family:var(--mono);font-size:10px;font-weight:700}
.pr-star{color:var(--ink2)}.pr-star.to{color:var(--ember)}
.pr-arrow{color:var(--ink3)}
.pr-earn{margin-top:2px;font-size:8.5px;font-weight:700;color:var(--ink2);font-family:var(--mono)}
.pr-bonus{margin-left:3px;font-size:8.5px;color:var(--ink2);padding:0 5px;border:1px solid var(--ink3);border-radius:3px}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.rq{display:flex;align-items:center;gap:7px;padding:5px 7px;border:var(--rule);border-radius:4px;background:var(--paper2)}
.rq-i{width:22px;height:22px;flex:none;border-radius:3px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink2);background:var(--paper);border:var(--rule)}
.rq-b{flex:1;min-width:0}
.rq-l{font-size:7.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3)}
.rq-v{font-family:var(--mono);font-size:11px;font-weight:700;margin:1px 0 3px;white-space:nowrap}
.rq-v .n{color:var(--ink3)}
.rq-bar{height:5px;border:1px solid var(--ink);border-radius:2px;background:var(--paper);overflow:hidden}
.rq-bar i{display:block;height:100%;background:var(--ochre);transition:width .35s ease}
.rq.done{background:#e6e3ff}
.rq.done .rq-i{background:var(--moss);color:var(--paper)}
.rq.done .rq-bar i{background:var(--moss)}
.pr-foot{display:flex;gap:6px}
.pr-foot .btn.sm{flex:0 0 112px}
.btn.asc{background:var(--ochre);color:var(--ink)}
.btn.asc:not(:disabled):hover{background:#f5b53e}
.btn.asc:disabled{background:var(--paper2);color:var(--ink3)}

/* ---------- Dock ---------- */
#dock{flex:1;min-height:0;display:flex;align-items:center}
#bar{width:100%;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:3px 8px 5px 8px;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.tw{--rc:#8c8577;position:relative;flex:none;width:56px;height:60px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--paper);border:var(--rule);box-shadow:var(--shadow-sm);transition:transform .1s}
.tw:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.tw:active{transform:translate(2px,2px);box-shadow:none}
.tw.sel{background:var(--ink);color:var(--paper);transform:translate(2px,2px);box-shadow:none}
.tw.sel .n{color:var(--paper)}.tw.sel .c{color:var(--ochre)}
.tw.poor{opacity:.42}
.tw .tag{position:absolute;top:4px;left:4px;width:6px;height:6px;border-radius:1px;background:var(--rc);outline:1px solid var(--ink)}
.tw .k{position:absolute;top:2px;right:4px;font-family:var(--mono);font-size:8px;font-weight:700;color:var(--ink3)}
.tw canvas{width:28px;height:28px;border-radius:3px;background:#120e4d}
.tw .n{font-size:8.5px;font-weight:700;color:var(--ink);line-height:1;margin-top:2px}
.tw .c{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--ink2);line-height:1.15}
#tip{position:absolute;z-index:9;bottom:80px;width:188px;border-radius:5px;padding:7px 9px;pointer-events:none}
#tip .tn{font-weight:800;font-size:11px;display:flex;justify-content:space-between}
#tip .tn b{font-family:var(--mono)}
#tip .tr{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:1px 0 4px}
#tip .td{font-size:9.5px;color:var(--ink2);line-height:1.4}

/* ---------- Resize handles on every edge and corner ---------- */
/* Resize from any side or corner: the opposite side stays fixed while dragging */
.rz{position:absolute;z-index:25;-webkit-app-region:no-drag} /* siblings of #w in #wrap: unscaled, cover the border; above the home screen (20), below the update box (30) */
#w.min ~ .rz{display:none}
.rz-n,.rz-s{left:14px;right:14px;height:7px;cursor:ns-resize}.rz-n{top:0}.rz-s{bottom:0}
.rz-e,.rz-w{top:14px;bottom:14px;width:7px;cursor:ew-resize}.rz-e{right:0}.rz-w{left:0}
.rz-ne,.rz-nw,.rz-se,.rz-sw{width:14px;height:14px}
.rz-ne{top:0;right:0;cursor:nesw-resize}.rz-sw{bottom:0;left:0;cursor:nesw-resize}
.rz-nw{top:0;left:0;cursor:nwse-resize}.rz-se{bottom:0;right:0;cursor:nwse-resize}
#w.resizing .rz{background:transparent}
</style>
</head>
<body>
<div id="wrap">
<div id="w">
  <div id="top">
    <div id="grip" class="grip handle" title="Drag to move"><svg width="6" height="12" viewBox="0 0 6 12" fill="currentColor"><circle cx="1.2" cy="1.5" r="1.1"/><circle cx="4.8" cy="1.5" r="1.1"/><circle cx="1.2" cy="6" r="1.1"/><circle cx="4.8" cy="6" r="1.1"/><circle cx="1.2" cy="10.5" r="1.1"/><circle cx="4.8" cy="10.5" r="1.1"/></svg></div>
    <div class="stats handle" title="Drag to move">
      <span class="st st-w" title="Wave"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 6c2-2.5 4-2.5 6 0s4 2.5 6 0M2 11c2-2.5 4-2.5 6 0s4 2.5 6 0"/></svg><span id="sWave">0</span></span>
      <i class="sep"></i>
      <span class="st st-g" title="Gold · rolling 10s income per game-second"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor"/><circle cx="8" cy="8" r="4.2" fill="none" stroke="#7c4a03" stroke-width="1.2"/></svg><span id="sGold">0</span><span id="sRate" class="rate">+0/s</span></span>
      <i class="sep"></i>
      <span id="pLives" class="st st-l" title="Core lives"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M8 14.2 2.3 8.6a3.4 3.4 0 0 1 4.8-4.9L8 4.6l.9-.9a3.4 3.4 0 0 1 4.8 4.9z"/></svg><span id="sLives">0</span></span>
      <i class="sep"></i>
      <span class="st st-t" title="Towers placed / max towers"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M3 14h10v-2H11V6l1-2V2H4v2l1 2v6H3z"/></svg><span id="sTowers">0/5</span></span>
    </div>
    <button id="bWave" class="ib go" title="Start next wave (Space)"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M4.5 2.8v10.4L13 8z"/></svg></button>
    <div class="seg full">
      <button id="bSpeed" class="ib" title="Game speed">1x</button>
      <button id="bAuto" class="ib" title="Auto-lap: start the next lap automatically">AUTO</button>
    </div>
    <button id="bSC" class="ib sc full" title="Deploy Safety Car: 75% global slow for 6s (45s cooldown)">SC</button>
    <button id="bPres" class="ib pres full" title="Prestige"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M4.5 1.5h7v1.6h2.6v1.6a3 3 0 0 1-2.9 3A4 4 0 0 1 9 10v1.6h2.2v2.9H4.8v-2.9H7V10a4 4 0 0 1-2.2-2.3 3 3 0 0 1-2.9-3V3.1h2.6zM3.4 4.6v.1c0 .7.5 1.3 1.1 1.4V4.6zm9.2 0h-1.1v1.5c.6-.1 1.1-.7 1.1-1.4z"/></svg><span>Prestige</span></button>
    <button id="bMenu" class="ib full" title="Menu: F1 Paddock (save slots)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h10"/></svg></button>
    <button id="bMin" class="ib" title="Minimize to pill / expand"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path id="bMinPath" d="m4 6 4 4 4-4"/></svg></button>
  </div>
  <div id="stage" class="full">
    <canvas id="cv"></canvas>
    <div id="panel" class="glass ovl hidden">
      <div class="ph"><canvas id="pIcon"></canvas><div class="pt"><div id="pName" class="nm"></div><div id="pRole" class="role fit"></div></div><button id="pClose" class="x" title="Close">×</button></div>
      <div class="pbody">
      <div class="prog"><div class="pl"><span>Level <b id="pLv"></b><span id="pTier" class="badge"></span></span><span id="pNext"></span></div><div class="track"><div id="pBar" class="fill"></div></div></div>
      <div class="sg">
        <div class="sc"><span id="pK1"></span><b id="pV1"></b></div>
        <div class="sc"><span id="pK2"></span><b id="pV2"></b></div>
        <div class="sc"><span id="pK3"></span><b id="pV3"></b></div>
        <div class="sc"><span>Earned</span><b id="pV4"></b></div>
      </div>
      <div id="pMuts" class="muts"></div>
      <div id="pPrio" class="prio"></div>
      <div id="pDelta" class="pdelta"></div>
      </div>
      <div class="uprow"><button id="pUp" class="btn up fit"></button><button id="pMax" class="btn up max fit" title="Buy every level you can afford">MAX</button></div>
      <div class="prow"><button id="pSell" class="btn sell fit"></button><button id="pOD" class="btn sm od fit" title="Push Lap: +60% fire rate for 4s (20s cooldown, Lv 5+)">Push Lap</button><button id="pSel" class="btn sm fit" title="Pinned mutation: applied automatically on every mutation of this tower. Click to unpin."></button></div>
    </div>
    <div id="mut" class="ovl hidden">
      <div class="mh">✦ MUTATION <span id="mTitle"></span></div>
      <div id="mSub" class="msub"></div>
      <div id="mOpts" class="mopts"></div>
      <div class="prow"><button id="mReroll" class="btn sm" title="Reshuffle this draft (rerolls come from Constructors' HQ)"></button></div>
    </div>
    <div id="pres" class="ovl hidden">
      <div class="pr-head">
        <div id="prEmblem" class="emblem"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M4.5 1.5h7v1.6h2.6v1.6a3 3 0 0 1-2.9 3A4 4 0 0 1 9 10v1.6h2.2v2.9H4.8v-2.9H7V10a4 4 0 0 1-2.2-2.3 3 3 0 0 1-2.9-3V3.1h2.6zM3.4 4.6v.1c0 .7.5 1.3 1.1 1.4V4.6zm9.2 0h-1.1v1.5c.6-.1 1.1-.7 1.1-1.4z"/></svg></div>
        <div class="pr-ttl"><div class="pr-t">PRESTIGE</div><div class="pr-s"><span id="prRank"></span></div></div>
        <button id="prClose" class="x" title="Close (Esc)">×</button>
      </div>
      <div class="pr-grid">
        <div id="prReq" class="rq"><div class="rq-i">≋</div><div class="rq-b"><div class="rq-l">Clear lap</div><div id="prReqV" class="rq-v"></div><div class="rq-bar"><i id="prReqBar"></i></div></div></div>
        <div class="rq"><div class="rq-i">★</div><div class="rq-b"><div class="rq-l">Reward</div><div id="prRew" class="rq-v"></div><div class="rq-l" id="prRew2"></div></div></div>
      </div>
      <div id="prUnlock" class="ss-break"></div>
      <div class="pr-foot"><button id="prHQ" class="btn sm">⚙ Constructors' HQ</button><button id="prGo" class="btn asc"></button></div>
    </div>
    <div id="season" class="ovl hidden">
      <div class="pr-head">
        <div class="emblem ready"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M4.5 1.5h7v1.6h2.6v1.6a3 3 0 0 1-2.9 3A4 4 0 0 1 9 10v1.6h2.2v2.9H4.8v-2.9H7V10a4 4 0 0 1-2.2-2.3 3 3 0 0 1-2.9-3V3.1h2.6zM3.4 4.6v.1c0 .7.5 1.3 1.1 1.4V4.6zm9.2 0h-1.1v1.5c.6-.1 1.1-.7 1.1-1.4z"/></svg></div>
        <div class="pr-ttl"><div class="pr-t">SEASON <span id="ssNum"></span> COMPLETE</div><div class="pr-earn">Abu Dhabi finale won · Championship Points banked</div></div>
        <div class="ss-cp">+<span id="ssCP"></span><small>CP</small></div>
      </div>
      <div class="ss-grid">
        <div class="sc"><span>Laps</span><b id="ssLaps"></b></div>
        <div class="sc"><span>Cars beaten</span><b id="ssCars"></b></div>
        <div class="sc"><span>Bosses</span><b id="ssBoss"></b></div>
        <div class="sc"><span>Gold earned</span><b id="ssGold"></b></div>
      </div>
      <div id="ssBreak" class="ss-break"></div>
      <div class="se-btns"><button id="ssNext" class="btn up"></button><button id="ssKeep" class="btn sm">∞ Keep racing</button><button id="ssPres" class="btn asc"></button></div>
    </div>
    <div id="hq" class="ovl hidden">
      <div class="pr-head">
        <div class="emblem"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M6.6 1h2.8l.4 1.8 1.4.6 1.6-1 2 2-1 1.6.6 1.4L16 6.6v2.8l-1.8.4-.6 1.4 1 1.6-2 2-1.6-1-1.4.6-.4 1.8H6.6l-.4-1.8-1.4-.6-1.6 1-2-2 1-1.6-.6-1.4L0 9.4V6.6l1.8-.4.6-1.4-1-1.6 2-2 1.6 1 1.4-.6zM8 5.4a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2z"/></svg></div>
        <div class="pr-ttl"><div class="pr-t">TEAM HQ</div><div id="hqSub" class="pr-earn"></div></div>
        <div class="ss-cp"><span id="hqCP"></span><small>CP</small></div>
        <button id="hqClose" class="x" title="Close (Esc)">×</button>
      </div>
      <div id="hqGrid" class="hq-grid"></div>

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmt(n){
  if (n < 10 && n > 0 && n % 1) return n.toFixed(1);
  n = Math.floor(n);
  if (n < 1000) return String(n);
  const u = ['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
  let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }

}
const RGB = {};
function rgba(hex, a){

}

// ================= Map =================
let P; // { set, pts, cum, ang, len }
function genPath(seed){
  const r = mulberry32(seed), ri = (a, b) => a + Math.floor(r() * (b - a + 1));
  let y = ri(1, ROWS - 2);
  const tiles = [[0, y]];
  for (let x = 0; x < COLS - 1; x++) {
    if (x % 2 === 1) {
      let ty; do { ty = ri(0, ROWS - 1); } while (Math.abs(ty - y) < 2);
      const d = Math.sign(ty - y);
      while (y !== ty) { y += d; tiles.push([x, y]); }
    }
    tiles.push([x + 1, y]);
  }
  return tiles;
}
function setMap(seed){
  const tiles = genPath(seed);
  const pts = tiles.map(([x, y]) => [x + .5, y + .5]);
  const cum = [0], ang = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1];
    cum.push(cum[i] + Math.hypot(dx, dy)); ang.push(Math.atan2(dy, dx));
  }
  const corners = [];
  for (let i = 1; i < pts.length - 1; i++) {
    if (ang[i - 1] === ang[i]) continue;
    const d1 = [Math.cos(ang[i - 1]), Math.sin(ang[i - 1])], d2 = [Math.cos(ang[i]), Math.sin(ang[i])];
    corners.push({ x: pts[i][0], y: pts[i][1], d1, d2, cross: d1[0] * d2[1] - d1[1] * d2[0], dist: cum[i] });
  }
  P = { set: new Set(tiles.map(([x, y]) => x + ',' + y)), pts, cum, ang, len: cum[cum.length - 1], corners };
  // 2-3 hot-zone pads next to the track
  const r = mulberry32(seed ^ 0x2545f491), near = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (!P.set.has(x + ',' + y) && [[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => P.set.has((x + dx) + ',' + (y + dy)))) near.push([x, y]);
  const kinds = ['drs', 'stand', 'vip'].slice(0, 2 + Math.floor(r() * 2));
  if (S) S.hot = kinds.map(k => { const [x, y] = near.splice(Math.floor(r() * near.length), 1)[0]; return { k, x, y }; });
  renderBackground();
}
function posAt(d){
  const { pts, cum, ang } = P;
  if (d <= 0) return [pts[0][0], pts[0][1], ang[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    if (d <= cum[i + 1]) {
      const k = (d - cum[i]) / (cum[i + 1] - cum[i]);
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k, ang[i]];
    }
  }
  const l = pts[pts.length - 1];
  return [l[0], l[1], ang[ang.length - 1]];
}
const isPath = (x, y) => P.set.has(x + ',' + y);
const towerAt = (x, y) => S.towers.find(t => t.x === x && t.y === y);

// ================= Stats =================
function mc(t, id){ let n = 0; for (const m of t.muts) if (m === id) n++; return n; }
const hq = id => S.hq[id] || 0;
const towerCap = () => BASE_CAP + S.prestige + hq('garage');
const tileMult = () => 1 + .25 * hq('tile');
const isMint = t => TOWERS[t.type].kind === 'econ';   // economy towers
const weather = () => ['sun', 'rain', 'night'][Math.floor(Math.max(0, S.wave - 1) / 5) % 3];
const hotAt = t => { const h = S.hot.find(z => z.x === t.x && z.y === t.y); return h ? h.k : null; };
const tuneMult = t => 1 + Math.min(2, .2 * mc(t, 'tune'));
const lit = t => S.towers.some(o => TOWERS[o.type].light && dist2(o.x, o.y, t.x, t.y) <= (TOWERS[o.type].range + .5) ** 2);
// Every level: +30% damage, a little range and speed, and tower-specific hardware. Lv(1.3) vs cost(1.6) per level.
function stats(t, lv = t.lv){
  const d = TOWERS[t.type], hz = hotAt(t), tm = tileMult();
  const own = d.id === 'dyson' ? 1 + .75 * mc(t, 'dy_ascend') : 1 + G.aura + t.aura;
  const dmg = (d.dmg || 0) * Math.pow(LEVEL_POWER, lv - 1) * Math.pow(MUT_POWER, t.muts.length) * tuneMult(t) * (1 + .2 * hq('rnd')) * own;
  let range = d.kind === 'rail' || d.range > 50 ? 99 : d.range * Math.min(1.8, 1 + (d.id === 'frost' ? .04 : .03) * (lv - 1)) * (1 + .3 * mc(t, 'frost_double'));
  if (range < 50 && hz === 'stand') range *= 1 + .5 * tm;
  if (range < 50 && S.waveActive && weather() === 'night' && !lit(t)) range *= .75;
  const haste = 1 + .5 * mc(t, 'bolt_wrench') + .45 * mc(t, 'tesla_deploy') + .45 * mc(t, 'sing_turb') + t.haste;
  const rate = d.rate * (1 + .03 * (lv - 1)) * haste * t.buff * (hz === 'drs' ? 1 + .4 * tm : 1) * (t.odT > 0 ? 1.6 : 1);
  return { dmg, range, rate, crit: hz === 'stand' ? .25 * tm : 0 };
}
const chainJumps = (t, lv = t.lv) => TOWERS[t.type].jumps + Math.floor((lv - 1) / 2) + 2 * mc(t, 'tesla_boost');
const chainFall = t => Math.min(.97, .8 + .07 * mc(t, 'tesla_harvest'));
const railPierce = (t, lv = t.lv) => 1 + Math.floor((lv - 1) / 2);
const shrapnel = (t, lv = t.lv) => lv - 1;
const brittle = (t, lv = t.lv) => .04 * lv;
const boltBarrels = (t, lv = t.lv) => Math.min(6, lv);
const critChance = t => TOWERS[t.type].crit + .2 * mc(t, 'rail_trap');
const critMul = t => TOWERS[t.type].critMul + 3 * mc(t, 'rail_photo');
const shellCount = t => 3 + 2 * mc(t, 'hell_salvo');
const beamCap = t => 64 * (1 + 3 * mc(t, 'prism_purple'));
const orbBeams = t => 3 + 2 * mc(t, 'orb_const');
const lanceCount = t => Math.min(6, 1 + mc(t, 'lance_twin'));
const spireRate = (t, s) => Math.min(5, s.rate * (1 + .1 * mc(t, 'sp_wealth')));
const dysonLasers = t => Math.min(24, 8 + 3 * mc(t, 'dy_supernova'));
const droneCount = t => Math.min(12, 3 + 2 * mc(t, 'dy_armada'));
function dpsOf(t, s){
  const d = TOWERS[t.type];
  switch (d.kind) {
    case 'chain': { let m = 0, f = 1; const fall = chainFall(t); for (let j = 0; j <= chainJumps(t, s.lv); j++) { m += f; f *= fall; } return s.dmg * s.rate * m; }
    case 'rail': return s.dmg * s.rate * (1 + critChance(t) * (critMul(t) - 1)) * railPierce(t, s.lv);
    case 'shell': return s.dmg * s.rate * (1 + .15 * shrapnel(t, s.lv));
    case 'mortar': return shellCount(t) * s.dmg * s.rate;
    case 'hole': return 2 * s.dmg * s.rate;
    case 'emp': return s.dmg;
    case 'orbital': return s.dmg * s.rate * orbBeams(t);
    case 'lance': return s.dmg * s.rate * lanceCount(t);
    case 'spire': return s.dmg * (1 + .45 * mc(t, 'sp_wealth')) * spireRate(t, s);
    case 'dyson': return s.dmg * s.rate * dysonLasers(t);
    default: return s.dmg * s.rate * (d.id === 'bolt' ? 1 : 1);
  }
}
// Economy towers: payouts are fixed by level/mutations/tile and capped per lap. Nothing depends on cars.
const sponsorBonus = (t, lv = t.lv) => econPay(t, lv) * 25 * (1 + mc(t, 'mint_prize'));
function econPay(t, lv = t.lv){
  const d = TOWERS[t.type], vip = hotAt(t) === 'vip' ? 1 + tileMult() : 1;
  let g = d.grant * Math.pow(LEVEL_POWER, lv - 1) * Math.pow(MUT_POWER, t.muts.length) * tuneMult(t) * vip;
  if (d.id === 'mint') g *= 1 + .8 * mc(t, 'mint_title');
  if (d.id === 'wind') g *= 1 + .4 * mc(t, 'wind_grant');
  if (d.id === 'pit') g *= 1 + .35 * mc(t, 'pit_undercut');
  if (d.id === 'solar') g *= 1 + .3 * mc(t, 'solar_cells');
  return g;
}
const windNeed = t => Math.max(12, Math.round(30 * (1 - .2 * mc(t, 'wind_flow'))));
const pitCap = t => Math.min(4, 2 + mc(t, 'pit_double'));
const pitWindow = t => Math.min(6.5, 3.5 + mc(t, 'pit_quick'));
function solarPads(t){
  let free = 0, occ = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { if (isPath(x, y)) continue; if (towerAt(x, y)) occ++; else free++; }
  return free + occ * Math.min(1, .25 * mc(t, 'solar_canopy'));
}
function solarWeather(t){
  const w = weather(), st = mc(t, 'solar_storage');
  return w === 'sun' ? 1 : w === 'rain' ? Math.min(1, .4 + .2 * st) : Math.min(.6, .15 * st);
}
const solarPay = (t, lv = t.lv) => econPay(t, lv) * solarPads(t) * solarWeather(t);
const upCost = t => Math.ceil(TOWERS[t.type].cost * Math.pow(UP_GROWTH, t.lv));
const costOf = type => TOWERS[type].cost;
const sellValue = t => Math.floor(t.invested * .6);
const incomeRate = () => S.inc.reduce((a, b) => a + b, 0) / 10;
// What the next level adds, for the inspector's before → after preview.
function nextPerk(t){
  const d = TOWERS[t.type], n = t.lv + 1, out = [];
  if (d.id === 'bolt') out.push(n <= 6 ? '+1 barrel' : 'faster tracers');
  if (d.id === 'flak') out.push('+1 shrapnel, wider blast');
  if (d.id === 'frost') out.push('+4% brittle, wider ring');
  if (d.id === 'tesla' && chainJumps(t, n) > chainJumps(t)) out.push('+1 bounce');
  if (d.id === 'rail' && railPierce(t, n) > railPierce(t)) out.push('+1 pierce');
  if (n === 3) out.push('unlocks Target Priority');
  if (n === 5) out.push('unlocks Push Lap');
  if (n % 5 === 0) out.push('mutation draft');
  return out.join(' · ');
}

// ================= Waves =================
const seasonMult = () => Math.pow(1.35, S.season - 1);
const hpScale = w => 15 * Math.pow(1.18, w - 1) * seasonMult();
const goldScale = w => 13.5 * Math.pow(1.08, w - 1);   // slower growth than the old 5 * 1.115^w
const isBossWave = w => w % 10 === 0 || w === SEASON_LEN;
function bossFor(w){
  if (w === SEASON_LEN || w >= 50) return 'boss_levi';
  if (w === 20) return 'boss_jugg';
  if (w === 30) return 'boss_phantom';
  return 'boss_arrow';
}
function buildWave(w){
  const pool = ['spec', 'junior'];
  if (w >= 4) pool.push('papaya');
  if (w >= 6) pool.push('gt');
  if (w >= 9) pool.push('hybrid');
  if (w >= 12) pool.push('proto');
  if (w >= 40) pool.push('stealth');
  if (w >= 55) pool.push('holo');
  const gap = { spec:.65, papaya:.5, gt:1, hybrid:.7, proto:.5, stealth:.6, holo:.8 };
  const q = [];
  let budget = Math.min(40, 6 + Math.floor(w * .7));
  while (budget > 0) {
    let ty = pool[Math.floor(Math.random() * pool.length)];
    if (ty === 'junior') { for (let i = 0; i < ENEMIES.junior.pack; i++) q.push({ ty, gap: i ? .14 : .6 }); budget -= 2; continue; }
    const g = gap[ty];
    if (ty === 'proto') ty = Math.random() < .5 ? 'rosso' : 'midnight';
    q.push({ ty, gap:g }); budget -= 1;
    // Pit-crew support vans trail the heavy cars from lap 30
    if (w >= 30 && (ty === 'gt' || ty === 'rosso' || ty === 'midnight') && Math.random() < .5) q.push({ ty:'van', gap:.35 });
  }
  if (isBossWave(w)) q.push({ ty:bossFor(w), gap:1.8 });
  return q;
}
function startWave(){
  if (!S || S.waveActive || S.over) return;
  S.wave++;
  S.q = S.nextQ || buildWave(S.wave);
  S.nextQ = null;
  S.waveTotal = S.q.length;
  S.lightsT = LIGHTS;
  S.spawnT = 0;
  S.waveActive = true;
  S.lap = { gold:0, cp:0, lives:S.lives, bossKills:S.bossKills, carKills:S.carKills };
  // Adaptive chassis (lap 25+): resist whatever category did the most damage last lap.
  const top = Object.entries(S.dmgCat).sort((a, b) => b[1] - a[1])[0];
  S.resist = S.wave >= 25 && top ? top[0] : null;
  S.dmgCat = {};
  for (const t of S.towers) { t.harvest = 0; t.pays = 0; t.pitsDone = 0; t.pitCycle = 0; }
  if (S.resist) S.banner = { s:`ADAPTIVE CHASSIS · −40% ${S.resist.toUpperCase()}`, c:'#ff653f', t:2 };
}
function endWave(){
  S.waveActive = false;
  const clear = goldScale(S.wave) * 5;
  earn(clear);
  let paid = 0;

// A new run on a fresh circuit; CP, rank, unlocks and HQ upgrades stay.
function clearDraft(){ ui.mutT = null; ui.mutQueue = 0; $('mut').classList.add('hidden'); }
function newRun(){
  clearDraft();
  const d = serialize();
  d.run = freshRun(d);

function keepRacing(){ S.endless = true; ui.season = null; closeSeasonEnd(); S.banner = { s:'ENDLESS · +1 CP EVERY 3 LAPS', c:'#ffc85c', t:2.4 }; save(); }

function buyHQ(id){

// ================= Player actions =================
function place(type, x, y){
  const d = TOWERS[type], c = costOf(type);
  if (isPath(x, y) || towerAt(x, y)) return;          // only free build pads
  if (d.pr > S.prestige) { S.banner = { s:`LOCKED · REACH PRESTIGE ${d.pr}`, c:'#ff653f', t:1.6 }; return; }
  if (S.towers.length >= towerCap()) { S.banner = { s:`TOWER CAP ${towerCap()} REACHED`, c:'#ff653f', t:1.6 }; return; }
  if (S.gold < c) return;
  S.gold -= c;
  S.towers.push(makeTower(type, x, y, c));
  addFx({ k:'ring', x:x + .5, y:y + .5, r:.9, c:d.color, t:.4, life:.4, w:2 });
  burst(x + .5, y + .5, d.color, 10, 2);
  if (S.gold < c || S.towers.length >= towerCap()) ui.build = null;
  save();
}
// One level: +30% power, a shockwave, and a mutation draft every 5th level.
function levelUp(t){
  const c = upCost(t);
  S.gold -= c; t.invested += c; t.lv++;
  t.flash = .5;
  addFx({ k:'ring', x:t.x + .5, y:t.y + .5, r:1.4, c:'#ffc85c', t:.5, life:.5, w:2.5 });
  burst(t.x + .5, t.y + .5, '#ffc85c', 10, 2);
  return t.lv % 5 === 0;
}
function upgrade(t){
  if (S.gold < upCost(t)) return;
  if (levelUp(t)) queueMutations(t, 1);
  save();
}
// MAX: buy every level you can afford, then show each earned mutation draft one after another.
function upgradeMax(t){
  let earned = 0, n = 0;
  while (S.gold >= upCost(t) && n < 200) { if (levelUp(t)) earned++; n++; }
  if (!n) return;
  addText(t.x + .5, t.y - .3, `+${n} LV`, '#ffc85c', true);
  if (earned) queueMutations(t, earned);
  save();
}
function queueMutations(t, n){
  if (t.mutSel) { for (let i = 0; i < n; i++) applyMut(t, t.mutSel); return; }
  ui.mutQueue += n;
  if (!ui.mutT) openMut(t);
}
function sell(t){
  S.gold += sellValue(t);
  burst(t.x + .5, t.y + .5, '#ffc85c', 12, 2);
  S.towers.splice(S.towers.indexOf(t), 1);
  closePanel();
  save();
}
const allMutOptions = t => [...MUTS[TOWERS[t.type].id], TUNE];
// Drafts show 3 of the tower's 4 options (all 4 with the HQ upgrade); rerolls reshuffle.
function draftOptions(t){
  const all = allMutOptions(t);
  return hq('draft4') ? all : shuffle(all.slice()).slice(0, 3).sort((a, b) => all.indexOf(a) - all.indexOf(b));
}
const mutOptions = allMutOptions;
const autoPick = t => MUTS[TOWERS[t.type].id].reduce((a, b) => mc(t, b.id) < mc(t, a.id) ? b : a).id;
function applyMut(t, id){
  t.muts.push(id);
  const tier = t.muts.length, c = TIER_COL[Math.min(tier, 5)];
  addFx({ k:'ring', x:t.x + .5, y:t.y + .5, r:1.5, c, t:.7, life:.7, w:3 });

// ================= Rendering =================
const cv = $('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(3, window.devicePixelRatio || 1);
let RS = DPR; // device pixels per CSS pixel of game art: DPR × widget zoom
const bg = document.createElement('canvas');
const bctx = bg.getContext('2d');
function sizeCanvases(){
  cv.width = W * RS; cv.height = H * RS;
  bg.width = W * RS; bg.height = H * RS;
  bctx.setTransform(RS, 0, 0, RS, 0, 0);
}
sizeCanvases();

function circle(c, x, y, r, f){ c.fillStyle = f; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function poly(c, n, r, rot){ c.beginPath(); for (let i = 0; i < n; i++) { const a = rot + i / n * Math.PI * 2; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); }
function glow(c, x, y, r, col, a){
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
}
function lin(c, x0, y0, x1, y1, a, b){ const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }

// Track geometry in px: asphalt half-width, white edge line, kerb width.
const HW = 10.5, EDGE = 1.6, KW = 3.2;
function trackPath(c){
  // the tarmac starts off the left edge so the grid isn't clipped
  const [x0, y0] = P.pts[0];
  c.beginPath(); c.moveTo((x0 - .6) * TS, y0 * TS);
  P.pts.forEach(([x, y]) => c.lineTo(x * TS, y * TS));
  const [xn, yn] = P.pts[P.pts.length - 1]; c.lineTo((xn + .6) * TS, yn * TS);
}
function kerbStroke(c, draw){
  c.lineCap = 'butt'; c.lineJoin = 'miter'; c.lineWidth = KW;
  c.setLineDash([]); c.strokeStyle = '#ffffff'; draw(); c.stroke();
  c.setLineDash([3.5, 3.5]); c.strokeStyle = '#e10600'; draw(); c.stroke();
  c.setLineDash([]);
}
function renderBackground(){
  const c = bctx, r = mulberry32(S.seed ^ 0x5bd1e995);
  // circuit grass with mowing stripes
  for (let x = 0; x < COLS; x++) { c.fillStyle = x % 2 ? '#1e4627' : '#225030'; c.fillRect(x * TS, 0, TS, H); }
  for (let i = 0; i < 700; i++) circle(c, r() * W, r() * H, .5 + r() * .8, r() < .6 ? 'rgba(0,0,0,.14)' : 'rgba(190,230,170,.06)');
  // gravel traps on the outside of every corner
  for (const k of P.corners) {
    const n1 = k.cross > 0 ? [k.d1[1], -k.d1[0]] : [-k.d1[1], k.d1[0]], n2 = k.cross > 0 ? [k.d2[1], -k.d2[0]] : [-k.d2[1], k.d2[0]];
    const gx = (k.x + (n1[0] + n2[0]) * .55) * TS, gy = (k.y + (n1[1] + n2[1]) * .55) * TS;
    c.fillStyle = '#b9a37c'; c.beginPath(); c.arc(gx, gy, .5 * TS, 0, 7); c.fill();
    for (let i = 0; i < 40; i++) { const a = r() * 7, d = r() * .48 * TS; circle(c, gx + Math.cos(a) * d, gy + Math.sin(a) * d, .5 + r() * .7, r() < .5 ? 'rgba(90,70,40,.35)' : 'rgba(255,245,220,.25)'); }
  }
  // pit-wall barriers along the top and bottom edges
  for (const y of [0, H - 4]) {
    c.fillStyle = '#d9dce1'; c.fillRect(0, y, W, 4);
    for (let x = 0; x < W; x += 16) { c.fillStyle = (x / 16) % 2 ? '#e10600' : '#f4f4f4'; c.fillRect(x, y + (y ? 0 : 3), 16, 1); }
    c.fillStyle = 'rgba(0,0,0,.35)'; for (let x = 8; x < W; x += 16) c.fillRect(x, y, 1, 4);
  }
  // tarmac: white edge lines, then asphalt
  c.lineJoin = 'round'; c.lineCap = 'butt';
  trackPath(c); c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = (HW + EDGE) * 2 + 2; c.stroke();
  trackPath(c); c.strokeStyle = '#f4f4f4'; c.lineWidth = (HW + EDGE) * 2; c.stroke();
  trackPath(c); c.strokeStyle = '#2c2e33'; c.lineWidth = HW * 2; c.stroke();
  for (let i = 0; i < 520; i++) {
    const [x, y] = posAt(r() * P.len);
    circle(c, (x + (r() - .5) * .6) * TS, (y + (r() - .5) * .6) * TS, .4 + r() * .6, r() < .55 ? 'rgba(0,0,0,.3)' : 'rgba(255,255,255,.06)');
  }
  // racing line: cut every corner through its apex, darkened by rubber
  const pts = P.pts;
  c.beginPath(); c.moveTo(pts[0][0] * TS, pts[0][1] * TS);
  for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(pts[i][0] * TS, pts[i][1] * TS, (pts[i][0] + pts[i + 1][0]) / 2 * TS, (pts[i][1] + pts[i + 1][1]) / 2 * TS);
  c.lineTo(pts[pts.length - 1][0] * TS, pts[pts.length - 1][1] * TS);
  c.lineJoin = 'round'; c.strokeStyle = 'rgba(0,0,0,.22)'; c.lineWidth = 6; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 1; c.stroke();
  // tyre rubber marks into each apex
  for (const k of P.corners) {
    const m = k.cross > 0 ? [-k.d1[1], k.d1[0]] : [k.d1[1], -k.d1[0]];
    for (const o of [-2, 2]) {
      c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.2; c.beginPath();
      c.moveTo((k.x - k.d1[0] * .45) * TS + m[0] * 3 + o * k.d1[1], (k.y - k.d1[1] * .45) * TS + m[1] * 3 - o * k.d1[0]);
      c.quadraticCurveTo(k.x * TS + (m[0] + (k.cross > 0 ? -k.d2[1] : k.d2[1])) * 5, k.y * TS + (m[1] + (k.cross > 0 ? k.d2[0] : -k.d2[0])) * 5,
        (k.x + k.d2[0] * .45) * TS + o * k.d2[1], (k.y + k.d2[1] * .45) * TS - o * k.d2[0]);
      c.stroke();
    }
  }
  for (const z of S.hot) {
    const hz = HOTZONES[z.k], x0 = z.x * TS + 2, y0 = z.y * TS + 2;
    rr(c, x0, y0, TS - 4, TS - 4, 4); c.fillStyle = rgba(hz.c, .16); c.fill();
    c.setLineDash([3, 2]); c.strokeStyle = hz.c; c.lineWidth = 1.4; c.stroke(); c.setLineDash([]);
    c.fillStyle = hz.c; c.font = "900 9px 'Titillium Web',sans-serif"; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(hz.icon, x0 + 3, y0 + 2);
  }
  // apex kerbs: an arc on the outside of each corner, an L on the inside
  for (const k of P.corners) {
    const cx = k.x * TS, cy = k.y * TS, off = HW - KW / 2 + .6;
    const n1 = k.cross > 0 ? [k.d1[1], -k.d1[0]] : [-k.d1[1], k.d1[0]], n2 = k.cross > 0 ? [k.d2[1], -k.d2[0]] : [-k.d2[1], k.d2[0]];
    kerbStroke(c, () => { c.beginPath(); c.arc(cx, cy, off, Math.atan2(n1[1], n1[0]), Math.atan2(n2[1], n2[0]), k.cross < 0); });
    const L = .46 * TS, m1 = [-n1[0], -n1[1]], m2 = [-n2[0], -n2[1]];
    kerbStroke(c, () => {
      c.beginPath();
      c.moveTo(cx - k.d1[0] * L + m1[0] * off, cy - k.d1[1] * L + m1[1] * off);
      c.lineTo(cx + (m1[0] + m2[0]) * off, cy + (m1[1] + m2[1]) * off);
      c.lineTo(cx + k.d2[0] * L + m2[0] * off, cy + k.d2[1] * L + m2[1] * off);
    });
  }
  // starting grid: staggered white slots on the opening straight (the track always starts heading right)
  const [gx0, gy0] = P.pts[0];
  c.strokeStyle = '#f4f4f4'; c.lineWidth = 1.2; c.lineCap = 'butt';
  for (let i = 0; i < 3; i++) {
    const x = (gx0 - .3 + i * .42) * TS, y = gy0 * TS + (i % 2 ? 4 : -4);
    c.beginPath(); c.moveTo(x + 5, y - 3.5); c.lineTo(x, y - 3.5); c.lineTo(x, y + 3.5); c.lineTo(x + 5, y + 3.5); c.stroke();
  }
  // chequered finish line across the final straight
  const [fx, fy] = P.pts[P.pts.length - 1], sq = 3, x0 = fx * TS + 4, top = fy * TS - HW;
  for (let row = 0; row < Math.ceil(HW * 2 / sq); row++) for (let col = 0; col < 3; col++) {
    c.fillStyle = (row + col) % 2 ? '#111111' : '#f4f4f4';
    c.fillRect(x0 + col * sq, top + row * sq, sq, Math.min(sq, top + HW * 2 - (top + row * sq)));
  }
}

// ---------- 2.5D: sprite stacking ----------
// A "solid" is a footprint path (built around the origin) repeated from height z0 to z1 (in px),
// in a darker side colour, then capped with its top colour. Shifting each layer up the screen
// gives a camera tilted down from the south; rotating each layer keeps the volume correct as it turns.
function shade(hex, f){ const n = parseInt(hex.slice(1), 16); return `rgb(${(n >> 16 & 255) * f | 0},${(n >> 8 & 255) * f | 0},${(n & 255) * f | 0})`; }
function solid(c, x, y, z0, z1, side, top, path, rot){
  c.fillStyle = side;
  for (let z = z0; z < z1; z += 1) { c.save(); c.translate(x, y - z); if (rot) c.rotate(rot); path(c); c.fill(); c.restore(); }
  c.fillStyle = top; c.save(); c.translate(x, y - z1); if (rot) c.rotate(rot); path(c); c.fill(); c.restore();
}
const fRect = (w, h, r) => c => rr(c, -w / 2, -h / 2, w, h, r || 0);
const fRectAt = (x, y, w, h, r) => c => rr(c, x, y, w, h, r || 0);
const fCirc = rad => c => { c.beginPath(); c.arc(0, 0, rad, 0, 7); };
const TOWER_TOP = { bolt:10, frost:20, flak:10, wind:10, pit:16, solar:9, mint:21, tesla:12, venom:11, rail:14, prism:18, hell:9, chrono:17, sing:10,
  emp:14, orbital:13, conglom:20, lance:8, anti:15, syndicate:17, spire:27, dyson:21 };

function drawTower(c, type, px, py, s, ang, tier, now, recoil, lv = 1, od = false){
  const d = TOWERS[type], col = d.color, tc = TIER_COL[Math.min(tier, 5)], u = s / 32, r = s / 2;
  const nb = d.id === 'bolt' ? boltBarrels(null, lv) : d.id === 'flak' ? Math.min(4, 1 + Math.floor((lv - 1) / 2)) : 1 + Math.min(tier, 3);
  const k = recoil * 3 * u, H = 3 * u, ringCol = d.kind === 'mint' ? '#ffc85c' : tc;
  // ground shadow, mutation aura, concrete plinth
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(px + 3 * u, py + 4 * u, r * .86, r * .64, 0, 0, 7); c.fill();
  if (tier > 0) glow(c, px, py - 4 * u, r * (1.25 + .12 * Math.sin(now * 3 + px * .1)), ringCol, .45);
  solid(c, px, py, 0, H, '#3f444c', '#6b717c', fRect(s * .8, s * .8, 3 * u));
  c.save(); c.translate(px, py - H); rr(c, -s * .4, -s * .4, s * .8, s * .8, 3 * u);
  c.strokeStyle = tier ? tc : rgba(col, .85); c.lineWidth = 1.2 * u; c.stroke(); c.restore();
  for (let i = 0, n = Math.min(lv - 1, 10); i < n; i++) circle(c, px - s * .34 + i * s * .068, py + s * .33 - H, .9 * u, '#ffc85c'); // level pips
  if (od) glow(c, px, py - 6 * u, r * 1.3, '#ff3b1f', .55 + .2 * Math.sin(now * 20));                                          // Push Lap: red-hot
  const offs = n => Array.from({ length:n }, (_, i) => (i - (n - 1) / 2));
  switch (d.id) {
    case 'bolt': { // Wheel Gun: compressor drum + pneumatic gun(s)
      solid(c, px, py, H, H + 4 * u, shade(col, .5), col, fCirc(5.5 * u));
      for (const o of offs(nb)) {
        solid(c, px, py, H + 4 * u, H + 7 * u, '#30333a', '#9aa1ad', fRectAt(-2 * u - k, o * 4 * u - 1.6 * u, 11 * u, 3.2 * u, u), ang);
        solid(c, px, py, H + 4.5 * u, H + 6.5 * u, '#7a5a10', '#ffd37a', fRectAt(9 * u - k, o * 4 * u - 1.3 * u, 3 * u, 2.6 * u, .6 * u), ang);
      }
      c.strokeStyle = '#141418'; c.lineWidth = 1.2 * u; c.beginPath(); c.moveTo(px - 4 * u, py - H - 3 * u); c.quadraticCurveTo(px - 10 * u, py + 3 * u, px - 2 * u, py + 6 * u); c.stroke();
      break;
    }
    case 'frost': { // Marshal Post: hut + waving yellow flags
      solid(c, px, py + u, H, H + 6 * u, '#b8bcc4', '#eef0f3', fRect(11 * u, 9 * u, u));
      solid(c, px, py + u, H + 6 * u, H + 7.5 * u, '#a5401c', '#ff653f', fRect(13 * u, 11 * u, 1.2 * u));
      for (const o of offs(nb)) {
        const fx = px + 4 * u + o * 3 * u, base = py - H - 7 * u, top = base - 10 * u;
        c.strokeStyle = '#d9dde3'; c.lineWidth = u; c.beginPath(); c.moveTo(fx, base); c.lineTo(fx, top); c.stroke();
        c.fillStyle = col; c.beginPath(); c.moveTo(fx, top);
        for (let j = 1; j <= 4; j++) c.lineTo(fx + j * 2 * u, top + Math.sin(now * 8 + j + o) * u);
        for (let j = 4; j >= 0; j--) c.lineTo(fx + j * 2 * u, top + 5 * u + Math.sin(now * 8 + j + o) * u);
        c.closePath(); c.fill(); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = .6 * u; c.stroke();
      }
      break;
    }
    case 'flak': { // Tyre Launcher: stacked spare tyres + launch tube
      for (let i = 0; i < 2; i++) {
        solid(c, px - 5 * u, py + 3 * u, H + i * 3 * u, H + i * 3 * u + 3 * u, '#0b0b0d', '#2a2a2f', fCirc(4.5 * u));
        circle(c, px - 5 * u, py + 3 * u - H - i * 3 * u - 3 * u, 1.8 * u, '#0b0b0d');
        c.strokeStyle = col; c.lineWidth = .8 * u; c.beginPath(); c.arc(px - 5 * u, py + 3 * u - H - i * 3 * u - 3 * u, 3.4 * u, 0, 7); c.stroke();
      }
      for (const o of offs(nb)) {
        solid(c, px + 3 * u, py - u, H + 3 * u, H + 7 * u, shade(col, .5), col, fRectAt(-3 * u - k, o * 5 * u - 2.2 * u, 12 * u, 4.4 * u, 2 * u), ang);
        solid(c, px + 3 * u, py - u, H + 3.5 * u, H + 6.5 * u, '#0b0b0d', '#1a1a1d', fRectAt(8 * u - k, o * 5 * u - 1.8 * u, 1.5 * u, 3.6 * u, .5 * u), ang);
      }
      break;
    }
    case 'mint': { // Sponsor Billboard on two posts, facing the camera
      for (const ox of [-6 * u, 6 * u]) solid(c, px + ox, py + 2 * u, H, H + 9 * u, '#4a4f5c', '#8a90a0', fRect(1.8 * u, 1.8 * u));
      const bw = 20 * u, bh = 9 * u, bx = px - bw / 2, by = py + 2 * u - H - 9 * u - bh;
      c.fillStyle = '#16115e'; c.fillRect(bx + u, by + u, bw, bh);

function drawRange(x, y, r, col){

  ctx.fillStyle = rgba(col, .07); ctx.fill();

function drawDynamicMap(now){

  for (let i = 0; i < 5; i++) {
    const ly = gy - HW + 1 + i * ((HW * 2 - 2) / 4);
    circle(ctx, gx, ly, 2.1, '#120404');

// Lap card during the start lights, "LIGHTS OUT" as they go out, a progress bar while racing,
// and a preview of the next lap's grid between laps.
function drawLapHud(){
  ctx.textBaseline = 'middle';
  // weather tag
  const wx = WEATHERS[weather()];
  ctx.font = "800 8px 'Titillium Web',sans-serif";
  const wt = `${wx.icon} ${wx.name.toUpperCase()} · S${S.season}`, ww = ctx.measureText(wt).width + 10;
  paperTag(4, 4, ww, 12); ctx.fillStyle = '#16115e'; ctx.textAlign = 'left'; ctx.fillText(wt, 9, 10.5);
  // PIT lights and jammed towers
  for (const t of S.towers) {
    const px = (t.x + .5) * TS, py = t.y * TS;
    if (t.pitWin > 0) {
      const pulse = .8 + .2 * Math.sin(S.time * 14);
      ctx.fillStyle = '#16115e'; ctx.fillRect(px - 13, py - 9, 28, 13);
      ctx.fillStyle = rgba('#2fae5a', pulse); ctx.fillRect(px - 14, py - 10, 28, 13);
      ctx.strokeStyle = '#16115e'; ctx.lineWidth = 1.2; ctx.strokeRect(px - 14, py - 10, 28, 13);
      ctx.fillStyle = '#fff4dc'; ctx.textAlign = 'center'; ctx.font = "900 9px 'Titillium Web',sans-serif"; ctx.fillText('PIT', px, py - 3);
      ctx.fillStyle = '#16115e'; ctx.fillRect(px - 14, py + 4, 28 * t.pitWin / pitWindow(t), 2);
    }
    if (t.pitStop > 0) { ctx.strokeStyle = t.pitFull ? '#2fae5a' : '#8783b6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py + 16, 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - t.pitStop / (t.pitFull ? 1.8 : 4))); ctx.stroke(); }
    if (t.jamT > 0) {
      ctx.fillStyle = 'rgba(22,17,94,.55)'; ctx.fillRect(t.x * TS + 2, t.y * TS + 2, TS - 4, TS - 4);
      ctx.fillStyle = '#7fe0ff'; ctx.textAlign = 'center'; ctx.font = "900 7px 'Titillium Web',sans-serif";
      ctx.fillText('JAMMED', px, py + 12); ctx.fillText(`${Math.ceil(t.jamT)}s · CLICK`, px, py + 21);
    }
  }
  // boss health bar with phase notches
  if (S.boss && !S.boss.dead) {
    const b = S.boss, bw = 220, bx = W / 2 - bw / 2, by = 20, f = Math.max(0, b.hp / b.maxHp);
    paperTag(bx, by, bw, 15);
    ctx.fillStyle = '#ffe8bc'; ctx.fillRect(bx + 3, by + 8, bw - 6, 5);
    ctx.fillStyle = '#ff653f'; ctx.fillRect(bx + 3, by + 8, (bw - 6) * f, 5);
    if (b.shield > 0) { ctx.fillStyle = '#7fe0d0'; ctx.fillRect(bx + 3, by + 8, (bw - 6) * Math.min(1, b.shield / b.maxHp), 2); }
    ctx.fillStyle = '#16115e';
    for (const n of [.75, .5, .25]) ctx.fillRect(bx + 3 + (bw - 6) * n - .5, by + 7, 1.2, 7);
    ctx.font = "800 7.5px 'Titillium Web',sans-serif"; ctx.textAlign = 'left';
    ctx.fillText(ENEMIES[b.type].name.toUpperCase(), bx + 4, by + 4.5);
    ctx.textAlign = 'right'; ctx.fillText(['', 'EMP JAMMER', 'PIT STOP', 'ESCORT'][b.phase] || '', bx + bw - 4, by + 4.5);
  }
  if (S.lightsT > 0 || S.goT > 0) {
    const boss = S.wave % 10 === 0, out = S.lightsT <= 0, a = out ? Math.min(1, S.goT * 2) : 1;
    ctx.globalAlpha = a;
    const w = 150, h = out ? 30 : 42, x = W / 2 - w / 2, y = H / 2 - h / 2 - 6;
    paperTag(x, y, w, h);
    ctx.textAlign = 'center'; ctx.fillStyle = out ? '#ff653f' : '#16115e';
    ctx.font = "900 17px 'Titillium Web',sans-serif";
    ctx.fillText(out ? 'LIGHTS OUT!' : `LAP ${S.wave}`, W / 2, y + (out ? h / 2 : 15));
    if (!out) { ctx.font = "700 9px 'Titillium Web',sans-serif"; ctx.fillStyle = boss ? '#ff653f' : '#4a4592'; ctx.fillText(boss ? 'HYPERCAR ON THE GRID' : `${S.waveTotal} CARS ON THE GRID`, W / 2, y + 31); }
    ctx.globalAlpha = 1;
    return;
  }
  const y = H - 17;
  if (S.waveActive) {
    const left = S.q.length + S.enemies.length, done = 1 - left / S.waveTotal, w = 170, x = W / 2 - w / 2;
    paperTag(x, y, w, 12);
    ctx.font = "800 8px 'Titillium Web',sans-serif"; ctx.textAlign = 'left'; ctx.fillStyle = '#16115e';
    ctx.fillText(`LAP ${S.wave}`, x + 5, y + 6.5);
    ctx.fillStyle = '#ffe8bc'; ctx.fillRect(x + 38, y + 3.5, w - 76, 5);
    ctx.fillStyle = '#ff653f'; ctx.fillRect(x + 38, y + 3.5, (w - 76) * done, 5);
    ctx.strokeStyle = '#16115e'; ctx.lineWidth = .8; ctx.strokeRect(x + 38, y + 3.5, w - 76, 5);
    ctx.textAlign = 'right'; ctx.fillStyle = '#16115e'; ctx.fillText(`${left} left`, x + w - 5, y + 6.5);
    return;
  }
  if (!S.nextQ || S.over) return;
  const counts = {};
  for (const it of S.nextQ) counts[it.ty] = (counts[it.ty] || 0) + 1;
  const types = Object.keys(counts), w = 52 + types.length * 27, x = W / 2 - w / 2;
  paperTag(x, y, w, 12);
  ctx.font = "800 8px 'Titillium Web',sans-serif"; ctx.textAlign = 'left'; ctx.fillStyle = '#16115e';
  ctx.fillText(`NEXT · LAP ${S.wave + 1}`, x + 4, y + 6.5);
  types.forEach((ty, i) => {
    const cx = x + 50 + i * 27, d = ENEMIES[ty];
    ctx.fillStyle = d.body; ctx.fillRect(cx, y + 3, 9, 6);
    ctx.fillStyle = d.accent; ctx.fillRect(cx + 1, y + 5.3, 7, 1.4);
    ctx.strokeStyle = '#16115e'; ctx.lineWidth = .7; ctx.strokeRect(cx, y + 3, 9, 6);
    ctx.fillStyle = d.boss ? '#ff653f' : '#16115e'; ctx.fillText(`×${counts[ty]}`, cx + 11, y + 6.5);
  });
}

function setText(el, v){ if (el._v !== v) { el._v = v; el.textContent = v; if (el.classList.contains('fit')) fitText(el); } }
// Shrink a label's font until its text fits on one line (no ellipsis anywhere).
function fitText(el){
  if (!el.offsetParent) return;
  el.style.fontSize = '';
  let px = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + .5 && px > 6) { px -= .5; el.style.fontSize = px + 'px'; }
}
function fitAll(root){ for (const el of root.querySelectorAll('.fit')) fitText(el); }
function iconCanvas(cvs, type, size, tier){
  cvs.width = cvs.height = size * RS;
  const g = cvs.getContext('2d');
  g.setTransform(RS, 0, 0, RS, 0, 0);
  g.clearRect(0, 0, size, size);
  drawTower(g, type, size / 2, size * .66, size * .7, -Math.PI / 4, tier, .6, 0, 1);
}

function openMut(t){

  setText($('mSub'), `${ui.mutQueue > 1 ? ui.mutQueue + ' drafts to pick · ' : ''}picks stack · every pick ×${MUT_POWER} ${isMint(t) ? 'payout' : 'damage'}`);

// Apply one draft pick; a pinned mutation also fills every remaining queued draft.
function pickMut(t, id){
  applyMut(t, id);
  ui.mutQueue = Math.max(0, ui.mutQueue - 1);
  if (t.mutSel) { while (ui.mutQueue > 0) { applyMut(t, t.mutSel); ui.mutQueue--; } }
  if (ui.mutQueue > 0) { openMut(t); return; }
  ui.mutT = null; $('mut').classList.add('hidden');
  if (ui.sel) $('panel').classList.remove('hidden');
}
function renderMutOpts(){
  const box = $('mOpts'), t = ui.mutT, eco = isMint(t);
  box.innerHTML = '';
  for (const o of ui.mutOpts) {
    const n = mc(t, o.id), col = document.createElement('div'), b = document.createElement('button'), sel = document.createElement('button');
    col.className = 'mcol';
    b.className = 'mc glass' + (eco ? ' eco' : '');

    sel.title = 'Pick this now and every time this tower mutates';

}

      inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') el.querySelector('button').click(); };
      el.querySelector('button').onclick = () => { createSlot(n, inp.value.trim()); closeHome(); };
    }
    box.append(el);
  }
  fitAll(box);
}
function exportSlot(n){
  const d = readSlot(n);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], { type:'application/json' }));
  a.download = `neon-siege-slot${n}-${d.name.replace(/[^\w-]+/g, '_')}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  homeMsg(`Exported slot ${n}`);
}

  const f = $('hmFile').files[0];

$('hmUrlSave').onclick = () => { const v = $('hmUrl').value.trim(); if (v) localStorage.setItem(URL_KEY, v); else localStorage.removeItem(URL_KEY); $('hmUrlRow').classList.add('hidden'); homeMsg('Update source saved'); };

// ---------------- In-game updater ----------------
const updateUrl = () => localStorage.getItem(URL_KEY) || DEFAULT_UPDATE_URL;
let latestHtml = null, updDismissed = false;
async function checkUpdates(manual){
  try {
    const res = await fetch(`${updateUrl()}?t=${Date.now()}`, { cache:'no-store' });
    if (!res.ok) throw new Error(`update server answered ${res.status}`);
    const html = await res.text(), m = html.match(/<meta name="app-version" content="([^"]+)"/);
    if (!m) throw new Error('no app-version found at the update URL');
    if (cmpVer(m[1], APP_VERSION) > 0) { latestHtml = html; if (manual || !updDismissed) showUpdate(m[1]); }
    else if (manual) homeMsg(`You're on the latest version (v${APP_VERSION})`);
  } catch (e) { if (manual) homeMsg(`Update check failed: ${e.message}`); }
}
function showUpdate(v){ setText($('updFrom'), APP_VERSION); setText($('updTo'), v); $('upd').classList.remove('hidden'); }
$('hmCheck').onclick = () => { homeMsg('Checking…'); checkUpdates(true); };
$('updLater').onclick = () => { updDismissed = true; $('upd').classList.add('hidden'); };
$('updGo').onclick = () => { save(); localStorage.setItem(CACHE_KEY, latestHtml); location.reload(); };
function updateUI(){
  if (!S) return;
  setText($('sWave'), S.endless || S.wave > SEASON_LEN ? String(S.wave) : `${S.wave}/${SEASON_LEN}`);
  setText($('sGold'), fmt(S.gold));
  setText($('sRate'), `+${fmt(incomeRate())}/s`);
  setText($('sLives'), String(Math.max(0, S.lives)));
  setText($('sTowers'), `${S.towers.length}/${towerCap()}`);
  const bw = $('bWave');
  bw.disabled = S.waveActive || S.over || !!ui.season;
  bw.title = S.waveActive ? `Lap ${S.wave} in progress` : `Start lap ${S.wave + 1} (Space)`;
  setText($('bSpeed'), S.speed + 'x');
  $('bSpeed').classList.toggle('on', S.speed > 1);
  $('bAuto').classList.toggle('on', S.auto);
  const sc = $('bSC');
  sc.disabled = S.scCD > 0 || !S.waveActive;
  sc.classList.toggle('live', S.scT > 0);
  sc.style.setProperty('--p', (S.scCD > 0 ? (1 - S.scCD / 45) * 100 : 100) + '%');
  const ready = prestigeReady(), bp = $('bPres');
  bp.classList.toggle('ready', ready);
  bp.title = `Prestige · P${S.prestige} ${rankName(S.prestige)} · ${S.cp} CP${ready ? '\nReady: prestige to P' + (S.prestige + 1) : '\nClear lap ' + prestigeTarget() + ' to prestige'}`;
  if (ui.pres) refreshPrestige();
  $('bMinPath').setAttribute('d', ui.min ? 'm4 10 4-4 4 4' : 'm4 6 4 4 4-4');
  const full = S.towers.length >= towerCap();
  hot.forEach((b, i) => {
    const d = TOWERS[i], locked = d.pr > S.prestige;
    b.classList.toggle('sel', ui.build === i);
    b.classList.toggle('locked', locked);
    b._lock.classList.toggle('hidden', !locked);
    b.classList.toggle('poor', !locked && (S.gold < d.cost || full));
  });
  if (ui.hqMode) refreshHQ();
  if (ui.sel) refreshPanel();
  if (ui.mutT) {
    const r = $('mReroll'); r.classList.toggle('hidden', hq('draft4') > 0 || hq('reroll') === 0);
    r.disabled = S.rerolls < 1; setText(r, `↻ Reroll (${S.rerolls})`);
  }
}

// ================= Input =================
function tileOf(ev){
  const r = cv.getBoundingClientRect();
  return { x: Math.floor((ev.clientX - r.left) / r.width * COLS), y: Math.floor((ev.clientY - r.top) / r.height * ROWS) };
}
cv.addEventListener('mousemove', ev => { ui.hover = tileOf(ev); });
cv.addEventListener('mouseleave', () => { ui.hover = null; });
cv.addEventListener('contextmenu', ev => { ev.preventDefault(); ui.build = null; closePanel(); });
cv.addEventListener('click', ev => {
  if (!S || S.over) return;
  const { x, y } = tileOf(ev), t = towerAt(x, y);
  if (t && t.jamT > 0) { t.jamT = Math.max(0, t.jamT - 1); burst(t.x + .5, t.y + .5, '#7fe0ff', 6, 1.5); return; } // click to reboot early
  if (t && TOWERS[t.type].id === 'pit' && tapPit(t)) return;
  if (t) { openPanel(t); return; }
  if (ui.build !== null && !isPath(x, y)) { place(ui.build, x, y); return; }
  closePanel();
});
$('pClose').onclick = closePanel;

$('oNew').onclick = () => prestigeReady() ? doPrestige() : restartSeason();
$('bMin').onclick = () => {
  if (OVERLAY) computeAnchor();
  ui.min = !ui.min; wEl.classList.toggle('min', ui.min); tip.classList.add('hidden');
  placeInPage(); fitWindow(); save();
};
document.addEventListener('keydown', ev => {
  if (!S || ui.home) return;
  if (ev.key === 'Escape') { ui.build = null; closePanel(); closePrestige(); if (ui.hqMode) closeHQ(); return; }
  if (ui.pres || ui.hqMode) return;         // the race is paused behind the prestige and HQ sheets
  if (ev.code === 'Space') {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    ev.preventDefault(); startWave(); return;
  }
  const i = HOTKEYS.indexOf(ev.key);
  if (i >= 0 && !S.over && TOWERS[i].pr <= S.prestige) { ui.build = ui.build === i ? null : i; closePanel(); }
});
window.addEventListener('beforeunload', save);

// ================= Placement: move, resize, anchor =================
// The widget anchors to the screen corner it is nearest. Minimizing and resizing keep that corner
// fixed; resizing from any edge keeps the opposite side fixed. In the browser the widget moves
// inside the page; in the desktop overlay the OS window moves and is sized to the widget.
const OVERLAY = !!window.overlay;
const wrap = $('wrap'), wEl = $('w'), BASE_W = 440, BASE_H = 344, MIN_SCALE = .6, MAX_SCALE = 2.5;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function maxScale(){ return OVERLAY ? MAX_SCALE : clamp(Math.min((innerWidth - 8) / BASE_W, (innerHeight - 8) / BASE_H), MIN_SCALE, MAX_SCALE); }
function setAnchor(ax, ay){
  ui.ax = ax; ui.ay = ay;
  wEl.classList.toggle('ax-r', ax === 'r');
  wEl.classList.toggle('ay-b', ay === 'b');
}
function computeAnchor(){
  if (OVERLAY) {
    const mx = screen.availLeft + screen.availWidth / 2, my = screen.availTop + screen.availHeight / 2;
    setAnchor(screenX + outerWidth / 2 > mx ? 'r' : 'l', screenY + outerHeight / 2 > my ? 'b' : 't');
    return;
  }
  const r = wEl.getBoundingClientRect(), ax = r.left + r.width / 2 > innerWidth / 2 ? 'r' : 'l', ay = r.top + r.height / 2 > innerHeight / 2 ? 'b' : 't';
  ui.pos = { dx: ax === 'l' ? r.left : innerWidth - r.right, dy: ay === 't' ? r.top : innerHeight - r.bottom };
  setAnchor(ax, ay);
}
function placeInPage(){
  if (OVERLAY) return;
  const r = wEl.getBoundingClientRect();
  ui.pos.dx = clamp(ui.pos.dx, 0, Math.max(0, innerWidth - r.width));
  ui.pos.dy = clamp(ui.pos.dy, 0, Math.max(0, innerHeight - r.height));
  wrap.style.left = ui.ax === 'l' ? ui.pos.dx + 'px' : '';
  wrap.style.right = ui.ax === 'r' ? ui.pos.dx + 'px' : '';
  wrap.style.top = ui.ay === 't' ? ui.pos.dy + 'px' : '';
  wrap.style.bottom = ui.ay === 'b' ? ui.pos.dy + 'px' : '';
}
function fitWindow(){
  if (!OVERLAY) return;
  const r = wEl.getBoundingClientRect();
  window.overlay.fit(r.width, r.height, ui.ax, ui.ay);
}
function applyScale(s){
  ui.scale = clamp(s, MIN_SCALE, maxScale());
  wEl.style.zoom = ui.scale;
  RS = DPR * ui.scale;
  sizeCanvases();
  if (S) renderBackground();
  hot.forEach((b, i) => iconCanvas(b._icon, i, 28, 0));
  $('pMuts')._k = null;
  fitWindow();
}
// Move (browser). In the overlay the .handle elements are native drag regions instead.
document.querySelectorAll('.handle').forEach(h => h.addEventListener('pointerdown', ev => {
  if (OVERLAY || ev.button !== 0) return;
  const r = wEl.getBoundingClientRect(), ox = ev.clientX - r.left, oy = ev.clientY - r.top;
  h.setPointerCapture(ev.pointerId);
  wEl.classList.add('dragging');
  const move = e => {
    wrap.style.right = wrap.style.bottom = '';
    wrap.style.left = clamp(e.clientX - ox, 0, innerWidth - r.width) + 'px';
    wrap.style.top = clamp(e.clientY - oy, 0, innerHeight - r.height) + 'px';
  };
  const up = () => {
    h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up);
    wEl.classList.remove('dragging');
    computeAnchor(); placeInPage(); save();
  };
  h.addEventListener('pointermove', move); h.addEventListener('pointerup', up);
}));
// Resize from any edge or corner. While dragging, the widget is anchored to the opposite side so that side
// stays put; on release it re-anchors to the nearest screen corner. Double-click any handle resets to 100%.
function anchorTo(ax, ay){
  if (OVERLAY) { setAnchor(ax, ay); return; }
  const r = wEl.getBoundingClientRect();
  ui.pos = { dx: ax === 'l' ? r.left : innerWidth - r.right, dy: ay === 't' ? r.top : innerHeight - r.bottom };
  setAnchor(ax, ay);
}
document.querySelectorAll('.rz').forEach(h => {
  h.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    const dir = h.dataset.dir;
    if (OVERLAY) computeAnchor();
    const sx = dir.includes('e') ? 1 : dir.includes('w') ? -1 : 0, sy = dir.includes('s') ? 1 : dir.includes('n') ? -1 : 0;
    anchorTo(sx > 0 ? 'l' : sx < 0 ? 'r' : ui.ax, sy > 0 ? 't' : sy < 0 ? 'b' : ui.ay);
    const x0 = ev.screenX, y0 = ev.screenY, s0 = ui.scale;
    let want = s0, queued = false;
    h.setPointerCapture(ev.pointerId);
    wEl.classList.add('resizing');
    const apply = () => { queued = false; applyScale(want); placeInPage(); };
    const move = e => {
      const gx = sx * (e.screenX - x0) / BASE_W, gy = sy * (e.screenY - y0) / BASE_H;
      want = s0 + (sx && sy ? Math.max(gx, gy) : sx ? gx : gy);
      if (!queued) { queued = true; requestAnimationFrame(apply); }   // at most one resize per frame
    };
    const up = () => {
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up);
      if (queued) apply();
      wEl.classList.remove('resizing');
      computeAnchor(); placeInPage(); fitWindow(); save();
    };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up);
  });
  h.addEventListener('dblclick', () => { applyScale(1); placeInPage(); save(); });
});
window.addEventListener('resize', () => { if (!OVERLAY) { applyScale(ui.scale); placeInPage(); } });

// ================= Main loop =================
if (OVERLAY) document.documentElement.classList.add('overlay');
loadPrefs();
migrateLegacy();
wEl.classList.toggle('min', ui.min);
if (OVERLAY) computeAnchor(); else setAnchor(ui.ax, ui.ay);
applyScale(ui.scale);
placeInPage();
openHome();
checkUpdates(false);
let last = performance.now(), acc = 0, lastSave = 0;
const CATCHUP_MAX = 300, CATCHUP_PER_FRAME = 2;  // seconds
function frame(now){
  const raw = (now - last) / 1000, dt = Math.min(raw, .25);
  last = now;
  ui.shake *= Math.exp(-dt * 12);
  if (S && !ui.home && !S.over && !ui.mutT && !ui.season && !ui.pres && !ui.hqMode) {
    ui.catchup = Math.min(CATCHUP_MAX, (ui.catchup || 0) + raw - dt);
    const extra = Math.min(ui.catchup, CATCHUP_PER_FRAME);
    ui.catchup -= extra;
    acc += dt + extra;
    while (acc >= STEP) { for (let i = 0; i < S.speed; i++) update(STEP); acc -= STEP; }
  } else acc = 0;
  if (S && !ui.min) render(now / 1000);
  updateUI();
  if (S && now - lastSave > 10000) { lastSave = now; save(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
